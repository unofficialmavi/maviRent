<script>

/* =====================================================
   PWA SERVICE WORKER
===================================================== */

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('MavRent service worker registered:', reg.scope))
      .catch(err => console.error('MavRent service worker registration failed:', err));
  });
}

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL = 'https://wborvbuqdiscoasnsrwa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1mthstK0eNmIFL1PHmBDLg_-5YJYScn';
const MEDIA_BUCKET = 'maintenance-media';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =====================================================
   GLOBAL STATE
===================================================== */

let role = 'landlord';
let user = null;
let profile = null;
let notifications = [];
let channel = null;
let loading = false;
let realtimeStarted = false;
let refreshTimer = null;
let currentPage = '';

let cache = {
  properties: [],
  units: [],
  tenants: [],
  registeredTenants: [],
  payments: [],
  maintenance_requests: [],
  expenses: [],
  receipts: [],
  rent_records: []
};

/* =====================================================
   HELPERS
===================================================== */

const $ = x => document.getElementById(x);
const money = n => 'UGX ' + Number(n||0).toLocaleString('en-US');
const today = () => new Date().toISOString().slice(0,10);
const esc = s => String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function shortId(id){
  return id ? 'MVR-' + String(id).replace(/-/g,'').slice(0,8).toUpperCase() : '—';
}

function monthLabel(date){
  if(!date) return '—';
  let d = new Date(date + 'T00:00:00');
  return d.toLocaleDateString('en-US', {month:'long', year:'numeric'});
}

function monthStart(date){
  let d = new Date(date + 'T00:00:00');
  return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10);
}

function addMonths(date, n){
  let d = new Date(date + 'T00:00:00');
  d.setMonth(d.getMonth() + n);
  return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10);
}

function rentBalance(r){
  return Math.max(0, Number(r.amount_due||0) - Number(r.amount_paid||0));
}

function msg(t, c='error'){
  let x = $('authMsg');
  x.textContent = t;
  x.className = 'message ' + c;
}

/* =====================================================
   LOGIN & PROFILE
===================================================== */

function chooseRole(r){
  role = r;
  $('landlordRole').classList.toggle('sel', r === 'landlord');
  $('tenantRole').classList.toggle('sel', r === 'tenant');
}

async function signup(){
  let email = $('email').value.trim();
  let password = $('password').value;
  if(!email) return msg('Enter your email.');
  if(password.length < 6) return msg('Password must be at least 6 characters.');
  
  msg('Creating account...', 'success');
  let r = await sb.auth.signUp({
    email,
    password,
    options: { data: { role, full_name: '', phone: '' } }
  });
  if(r.error) return msg(r.error.message);
  if(r.data.session){
    user = r.data.user;
    await loadApp();
  } else {
    msg('Account created. Check your email, confirm it, then log in.', 'success');
  }
}

async function resetPassword(){
  let e = $('email').value.trim();
  if(!e) return msg('Enter your email first.');
  let r = await sb.auth.resetPasswordForEmail(e, { redirectTo: location.origin });
  if(r.error) return msg(r.error.message);
  msg('Password reset email sent.', 'success');
}

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  msg('Logging in...', 'success');
  let r = await sb.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });
  if(r.error) return msg(r.error.message);
  user = r.data.user;
  await loadApp();
};

async function loadProfile(){
  let r = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if(r.error){
    console.error(r.error);
    return null;
  }
  return r.data;
}

/* =====================================================
   APP LIFECYCLE & BACKGROUND TASKS
===================================================== */

let scheduleMaintenanceRunning = false;
async function ensureRentSchedules(){
  if(scheduleMaintenanceRunning || !user || role !== 'landlord' || !navigator.onLine) return;
  scheduleMaintenanceRunning = true;
  try {
    for(const t of cache.tenants){
      const rows = rentRecordsForTenant(t.id);
      if(!rows.length){ await generateRentForTenant(t.id, 12); continue; }
      const last = rows.slice().sort((a,b) => String(b.period_month).localeCompare(String(a.period_month)))[0];
      const monthsAhead = Math.round((new Date(last.period_month + 'T00:00:00') - new Date(monthStart(today()) + 'T00:00:00')) / (30.44 * 86400000));
      if(monthsAhead < 6) await generateRentForTenant(t.id, 12);
    }
    await loadNotifications();
  } catch(e) {
    console.warn('Background rent schedule update:', e);
  } finally {
    scheduleMaintenanceRunning = false;
  }
}

async function loadApp(){
  if(!user || loading) return;
  loading = true;

  profile = await loadProfile();
  role = profile?.role || user.user_metadata?.role || role;
  if(!['landlord','tenant'].includes(role)) role = 'tenant';

  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');

  buildNav();
  await refresh();
  await loadNotifications();

  show(role === 'landlord' ? 'dashboard' : 'home', false);
  startRealtime();

  loading = false;
  ensureRentSchedules();
}

async function logout(){
  if(channel) await sb.removeChannel(channel);
  await sb.auth.signOut();
  location.reload();
}

function dbErr(t, e){
  console.error(t, e);
  $('main').innerHTML = `
    <div class="card">
      <h2>Database error</h2>
      <div class="notice error">
        <b>${esc(t)}</b><br>${esc(e?.message||e)}
      </div>
    </div>`;
}

/* =====================================================
   REFRESH DATA
===================================================== */

async function refresh(){
  cache = {
    properties: [], units: [], tenants: [], registeredTenants: [],
    payments: [], maintenance_requests: [], expenses: [], receipts: [], rent_records: []
  };

  if(role === 'landlord'){
    let r = await sb.from('profiles').select('id,full_name,email,phone,role,tenant_code,created_at').eq('role','tenant').order('created_at',{ascending:false});
    if(r.error) return dbErr('profiles', r.error);
    cache.registeredTenants = r.data || [];

    r = await sb.from('properties').select('*').eq('landlord_id', user.id).order('created_at',{ascending:false});
    if(r.error) return dbErr('properties', r.error);
    cache.properties = r.data || [];

    let ids = cache.properties.map(x=>x.id);
    if(ids.length){
      r = await sb.from('units').select('*').in('property_id', ids);
      if(r.error) return dbErr('units', r.error);
      cache.units = r.data || [];
    }

    for(let t of ['tenants','payments','maintenance_requests','expenses','receipts']){
      r = await sb.from(t).select('*').eq('landlord_id', user.id).order(t==='receipts'?'issued_at':'created_at', {ascending:false});
      if(r.error && t==='receipts'){
        r = await sb.from(t).select('*').eq('landlord_id', user.id);
      }
      if(r.error) return dbErr(t, r.error);
      cache[t] = r.data || [];
    }

    r = await sb.from('rent_records').select('*').eq('landlord_id', user.id).order('period_month',{ascending:false});
    if(r.error) return dbErr('rent_records', r.error);
    cache.rent_records = r.data || [];

  } else {
    let r = await sb.from('tenants').select('*').eq('profile_id', user.id).eq('status','active');
    if(r.error) return dbErr('tenants', r.error);
    cache.tenants = r.data || [];

    let uids = cache.tenants.map(x=>x.unit_id).filter(Boolean);
    if(uids.length){
      r = await sb.from('units').select('*').in('id', uids);
      if(r.error) return dbErr('units', r.error);
      cache.units = r.data || [];

      let pids = cache.units.map(x=>x.property_id).filter(Boolean);
      if(pids.length){
        r = await sb.from('properties').select('*').in('id', pids);
        if(r.error) return dbErr('properties', r.error);
        cache.properties = r.data || [];
      }
    }

    let tids = cache.tenants.map(x=>x.id);
    if(tids.length){
      for(let t of ['payments','maintenance_requests','receipts']){
        r = await sb.from(t).select('*').in('tenant_id', tids).order(t==='payments'?'payment_date':t==='receipts'?'issued_at':'created_at', {ascending:false});
        if(r.error) return dbErr(t, r.error);
        cache[t] = r.data || [];
      }

      r = await sb.from('rent_records').select('*').in('tenant_id', tids).order('period_month',{ascending:false});
      if(r.error) return dbErr('rent_records', r.error);
      cache.rent_records = r.data || [];
    }
  }
}

   NAVIGATION & LAYOUT ENGINE
===================================================== */

function buildNav(){
  $('who').textContent = (role==='landlord'?'Landlord: ':'Tenant: ') + (profile?.full_name || user.email);

  const items = role === 'landlord' ? [
    'dashboard:🏠 Dashboard', 'rent:💰 Rent', 'properties:🏘️ Properties',
    'units:🚪 Units', 'tenants:👥 Tenants', 'payments:💳 Payments',
    'maintenance:🔧 Maintenance', 'expenses:🧾 Expenses', 'receipts:🧾 Receipts',
    'reports:📊 Reports', 'guide:❓ Guide', 'profile:👤 Profile'
  ] : [
    'home:🏠 My Home', 'myRent:💰 My Rent', 'myPayments:💳 My Payments',
    'myMaintenance:🔧 Maintenance', 'myReceipts:🧾 My Receipts',
    'guide:❓ Guide', 'profile:👤 My Profile'
  ];

  $('nav').innerHTML = items.map(x => {
    let [a,b] = x.split(':');
    return `<button data-p="${a}">${b}</button>`;
  }).join('');

  document.querySelectorAll('#nav button').forEach(b => {
    b.onclick = () => show(b.dataset.p);
  });
}

async function show(id, reload=true){
  currentPage = id;
  if(reload) await refresh();

  $('main').innerHTML = role === 'landlord' ? landlord(id) : tenant(id);

  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.p === id);
  });

  attach();
  await loadNotifications();
  enhanceMaintenanceUploader();
}

function table(h, rows, fn){
  return `
    <div class="tablewrap">
      <table class="table">
        <thead>
          <tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${rows.length ? rows.map(fn).join('') : `<tr><td colspan="${h.length}">No records yet.</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

function page(t, s, form, rows){
  return `
    <section>
      <div class="title"><h1>${t}</h1><p>${s}</p></div>
      <div class="card">${form}</div>
      <div class="card"><h3>Records</h3>${rows}</div>
    </section>`;
}

    table(['Name','Location','Description',''], cache.properties, x=>`
      <tr>
