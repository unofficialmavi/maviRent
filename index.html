<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- =====================================================
     MAVRENT PWA V14.6 — PUSH NOTIFICATIONS + NEXT MONTH
===================================================== -->

<!-- MAVRENT V14.5 STABLE LOADING SCREEN -->
<div id="mavLoading" class="mav-loading">
  <div class="mav-loading-logo">M</div>
  <div class="mav-loading-name">Mav<span>Rent</span></div>
  <div class="mav-loading-text">Rental management platform</div>
  <div class="mav-spinner"></div>
</div>

<!-- ONLINE STATUS -->
<div id="connectionStatus" class="connection-status online">
  <span class="connection-dot"></span>
  <span id="connectionText">Online</span>
</div>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MavRent">

<title>MavRent V14.6</title>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#f4f5f7;
color:#17202a
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.auth{
min-height:100vh;
display:grid;
place-items:center;
padding:25px;
background:
radial-gradient(circle at 15% 15%,#34b4ff55,transparent 30%),
radial-gradient(circle at 85% 20%,#0062ff66,transparent 34%),
linear-gradient(135deg,#061b45,#0a4da2 48%,#03163d)
}

.login{
width:min(450px,100%);
padding:30px;
color:#fff;
border:1px solid #ffffff44;
border-radius:26px;
background:#ffffff18;
backdrop-filter:blur(22px);
box-shadow:0 28px 80px #00000055
}

.brand{font-size:32px;font-weight:900}
.brand span{color:#67c7ff}
.muted{color:#ffffffb8;font-size:13px}

.role{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin:22px 0
}

.role button,.secondary{
padding:13px;
border:1px solid #ffffff44;
background:#ffffff12;
color:#fff;
border-radius:12px
}

.role .sel{
background:#fff;
color:#0869d7
}

label{
display:block;
font-size:12px;
margin:12px 0 6px;
color:#ffffffd0
}

.login input{
width:100%;
padding:13px;
border:1px solid #ffffff4d;
border-radius:12px;
background:#ffffff12;
color:#fff;
outline:0
}

.login input::placeholder{color:#ffffff99}

.primary{
width:100%;
margin-top:12px;
padding:13px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#087cff,#00b8ff);
color:#fff;
font-weight:800
}

.secondary{
width:100%;
margin-top:10px;
font-weight:700
}

.link{
background:none;
border:0;
color:#bfe7ff;
margin-top:12px;
text-decoration:underline
}

.message,.notice{
padding:11px;
border-radius:10px;
font-size:13px;
margin-top:12px
}

.error{
background:#fff0f0;
color:#8f2222
}

.success{
background:#ecfdf3;
color:#08743f
}

header{
background:#111827;
color:#fff;
padding:15px;
position:sticky;
top:0;
z-index:20
}

.bar,nav,main{
max-width:1100px;
margin:auto
}

.bar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.small{font-size:22px}

.userbox{
font-size:12px;
display:flex;
gap:7px;
align-items:center
}

.logout,.notifyBtn{
background:#273244;
color:#fff;
border:0;
border-radius:99px;
padding:8px 10px
}

.notifyBtn{
position:relative;
font-size:17px
}

.notifyCount{
position:absolute;
right:-5px;
top:-6px;
background:#ef4444;
border-radius:50%;
font-size:10px;
min-width:18px;
height:18px;
display:grid;
place-items:center;
border:2px solid #111827
}

nav{
display:flex;
gap:6px;
overflow:auto;
margin-top:12px
}

nav button{
border:0;
background:#273244;
color:#dbe1e8;
border-radius:99px;
padding:9px 15px;
white-space:nowrap;
font-weight:600;
transition:all 0.2s ease
}

nav button.active{
background:#fff;
color:#111827
}

/* =====================================================
   MORE NAVIGATION DRAWER
===================================================== */
.nav-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,0.5);
z-index:150;
opacity:0;
pointer-events:none;
transition:opacity 0.25s ease
}

.nav-backdrop.active{
opacity:1;
pointer-events:auto
}

.nav-drawer{
position:fixed;
top:0;
right:0;
bottom:0;
width:min(320px,85vw);
background:#111827;
color:#fff;
z-index:160;
transform:translateX(100%);
transition:transform 0.3s cubic-bezier(0.16,1,0.3,1);
display:flex;
flex-direction:column;
box-shadow:-10px 0 30px rgba(0,0,0,0.5)
}

.nav-drawer.active{
transform:translateX(0)
}

.drawer-head{
padding:20px;
border-bottom:1px solid #ffffff18;
display:flex;
justify-content:space-between;
align-items:center
}

.drawer-head h3{
margin:0;
font-size:18px
}

.drawer-close{
background:none;
border:0;
color:#dbe1e8;
font-size:22px;
padding:4px 8px
}

.drawer-content{
padding:15px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:8px
}

.drawer-content button{
border:0;
background:#273244;
color:#dbe1e8;
border-radius:12px;
padding:14px 16px;
text-align:left;
font-weight:600;
display:flex;
align-items:center;
gap:10px
}

.drawer-content button.active{
background:#fff;
color:#111827
}

main{
padding:20px 14px 50px
}

.title{margin-bottom:15px}

.title h1{
margin:0;
font-size:25px
}

.title p{
margin:5px 0;
color:#6b7280
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.card{
background:#fff;
border:1px solid #e3e6ea;
border-radius:14px;
padding:16px;
margin-bottom:14px
}

.big{
font-size:22px;
font-weight:800;
margin-top:6px
}

.green{color:#13844b}
.orange{color:#b86b00}
.red{color:#c93636}
.blue{color:#1769d1}

.grid,.formgrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.full{grid-column:1/-1}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.btn{
border:1px solid #d9dde3;
background:#fff;
color:#17202a;
border-radius:10px;
padding:11px;
text-align:left;
font-weight:700
}

.danger{
background:#fff0f0;
color:#a72828
}

.successBtn{
background:#ecfdf3;
color:#08743f
}

.warningBtn{
background:#fff8e6;
color:#966100
}

#app input,
#app select,
#app textarea{
width:100%;
padding:13px 14px;
border:1px solid #d9dde3;
border-radius:12px;
background:#fff;
color:#17202a!important;
caret-color:#17202a;
outline:0
}

#app input:focus,
#app select:focus,
#app textarea:focus{
border-color:#087cff;
box-shadow:0 0 0 3px #087cff1f
}

.tablewrap{overflow:auto}

.table{
width:100%;
border-collapse:collapse;
font-size:13px
}

.table th,.table td{
padding:10px 7px;
border-bottom:1px solid #eceef1;
text-align:left;
vertical-align:top;
white-space:nowrap
}

.wrap{
white-space:normal!important;
min-width:200px
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:20px;
background:#eef1f5;
font-size:11px
}

.badge.pending{
background:#fff4d6;
color:#956300
}

.badge.confirmed,
.badge.completed,
.badge.paid{
background:#dcfce7;
color:#166534
}

.badge.rejected,
.badge.cancelled,
.badge.overdue{
background:#fee2e2;
color:#991b1b
}

.badge.partial{
background:#fef3c7;
color:#92400e
}

.badge.in_progress{
background:#dbeafe;
color:#1d4ed8
}

.empty,.loading{
text-align:center;
padding:30px;
color:#737b87
}

.code{
font-family:monospace;
font-weight:800;
letter-spacing:.5px
}

.profileHero{
display:flex;
align-items:center;
gap:15px;
margin-bottom:16px
}

.avatar{
width:68px;
height:68px;
border-radius:50%;
display:grid;
place-items:center;
background:linear-gradient(135deg,#087cff,#00b8ff);
color:#fff;
font-size:25px;
font-weight:900
}

.profileId{
background:#eef2ff;
border-radius:10px;
padding:10px;
font-family:monospace;
font-weight:800
}

/* =====================================================
   NOTIFICATIONS
===================================================== */

.notificationPanel{
position:fixed;
right:20px;
top:75px;
width:min(390px,calc(100vw - 30px));
max-height:75vh;
overflow:auto;
background:#fff;
border:1px solid #e2e5e9;
border-radius:16px;
box-shadow:0 20px 60px #0003;
z-index:100
}

.notificationHead{
padding:15px;
border-bottom:1px solid #eceef1;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.notificationItem{
padding:14px;
border-bottom:1px solid #eceef1;
cursor:pointer
}

.notificationItem:hover{
background:#f8fafc
}

.notificationItem.unread{
background:#eff6ff
}

.notificationTitle{
font-weight:800
}

.notificationMessage{
font-size:12px;
color:#5f6875;
margin-top:4px
}

.notificationDate{
font-size:10px;
color:#9299a3;
margin-top:7px
}

.notificationType{
font-size:10px;
margin-top:6px;
color:#1769d1;
font-weight:700
}

.mediaPreview{
max-width:280px;
max-height:220px;
border-radius:10px;
margin-top:8px
}

.mediaBox{
padding:10px;
border:1px solid #e5e7eb;
border-radius:10px;
background:#f8fafc;
margin-top:8px
}

.maintCard{
border:1px solid #e5e7eb;
border-radius:14px;
padding:14px;
margin-bottom:12px
}

.maintTop{
display:flex;
justify-content:space-between;
gap:10px
}

.maintMeta{
font-size:12px;
color:#667085;
line-height:1.6
}

.maintActions{
margin-top:12px;
padding-top:12px;
border-top:1px solid #eef0f3
}

.maintActionsGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.progressLine{
display:flex;
gap:6px;
flex-wrap:wrap;
margin:10px 0
}

.progressStep{
padding:5px 9px;
border-radius:999px;
background:#eef1f5;
font-size:11px
}

.progressStep.done{
background:#dcfce7;
color:#166534
}

.progressStep.current{
background:#dbeafe;
color:#1d4ed8
}

.rentHero{
background:
linear-gradient(135deg,#071b41,#0869d7 55%,#00b8ff);
color:#fff;
border:0
}

.rentHero .muted{
color:#ffffffc9
}

.rentBalance{
font-size:32px;
font-weight:900;
margin-top:7px
}

.rentMiniGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px
}

.rentMini{
background:#ffffff18;
border:1px solid #ffffff30;
border-radius:12px;
padding:12px
}

.rentMini small{
display:block;
color:#ffffffb8
}

.rentMini strong{
display:block;
margin-top:4px
}

.monthCard{
border:1px solid #e5e7eb;
border-radius:14px;
padding:15px;
margin-bottom:12px;
background:#fff
}

.monthTop{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px
}

.monthName{
font-weight:900;
font-size:17px
}

.amountGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:12px
}

.amountBox{
padding:11px;
border-radius:10px;
background:#f8fafc
}

.amountBox small{
display:block;
color:#667085
}

.amountBox strong{
display:block;
margin-top:4px
}

.rentActionRow{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px
}

.rentActionRow button{
border:1px solid #d9dde3;
background:#fff;
border-radius:99px;
padding:9px 12px;
font-weight:700
}

.guideBtn{margin-top:0!important;background:#111827!important;color:#fff!important;text-align:center!important}
.alertStrip{border-radius:14px;padding:13px 14px;margin-bottom:12px;border:1px solid #e5e7eb;background:#fff}
.alertStrip.danger{background:#fff1f2;color:#991b1b;border-color:#fecdd3}
.alertStrip.warning{background:#fffbeb;color:#92400e;border-color:#fde68a}
.alertStrip.info{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.alertStrip.success{background:#ecfdf3;color:#166534;border-color:#bbf7d0}
.alertTitle{font-weight:900;margin-bottom:4px}
.rentStatus{font-weight:900}
.rentStatus.paid{color:#166534}.rentStatus.partial{color:#92400e}.rentStatus.overdue{color:#991b1b}.rentStatus.pending{color:#92400e}
.rentDueDate{font-size:12px;color:#667085;margin-top:5px}
.guideGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.guideStep{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:15px}
.guideStep b{display:block;margin-bottom:6px}
.reminderList{display:grid;gap:8px}
.reminderItem{padding:11px;border-radius:11px;background:#f8fafc;border:1px solid #e5e7eb;font-size:13px}
.reminderItem strong{display:block;margin-bottom:3px}
.payInputHint{font-size:12px;color:#667085;margin-top:5px}

@media(max-width:700px){
.guideGrid{grid-template-columns:1fr}
.stats,.grid,.formgrid{grid-template-columns:1fr}
.stats{grid-template-columns:1fr 1fr}
.full{grid-column:auto}
.title h1{font-size:22px}
.actions{grid-template-columns:1fr}
.userbox span{display:none}
.notificationPanel{right:10px}
.maintTop{display:block}
.maintActionsGrid{grid-template-columns:1fr}
.rentMiniGrid{grid-template-columns:1fr}
.amountGrid{grid-template-columns:1fr}
}

/* =====================================================
   MAVRENT V14.1 MOBILE UI
===================================================== */

.mav-loading{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 20% 20%,#34b4ff44,transparent 30%),
    linear-gradient(135deg,#061b45,#0869d7 55%,#03163d);
  color:#fff;
  transition:opacity .35s ease,visibility .35s ease;
}

.mav-loading.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

@keyframes mavBootTimeout{
  to{opacity:0;visibility:hidden;pointer-events:none}
}
.mav-loading{animation:mavBootTimeout 1s linear 2.5s forwards}

.mav-loading-logo{
  width:82px;
  height:82px;
  border-radius:24px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#087cff,#00b8ff);
  box-shadow:0 20px 50px #0005;
  font-size:42px;
  font-weight:900;
}

.mav-loading-name{
  margin-top:18px;
  font-size:32px;
  font-weight:900;
}

.mav-loading-name span{
  color:#67c7ff;
}

.mav-loading-text{
  margin-top:5px;
  color:#ffffffaa;
  font-size:13px;
}

.mav-spinner{
  width:25px;
  height:25px;
  margin-top:25px;
  border:3px solid #ffffff40;
  border-top-color:#fff;
  border-radius:50%;
  animation:mavspin .8s linear infinite;
}

@keyframes mavspin{
  to{transform:rotate(360deg)}
}

.connection-status{
  position:fixed;
  right:12px;
  bottom:14px;
  z-index:90;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  border-radius:999px;
  background:#ffffff;
  border:1px solid #e5e7eb;
  box-shadow:0 5px 20px #0002;
  font-size:11px;
  font-weight:800;
  transition:.25s;
}

.connection-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#16a34a;
}

.connection-status.offline{
  color:#991b1b;
}

.connection-status.offline .connection-dot{
  background:#ef4444;
}

@media(max-width:700px){
  body{
    padding-bottom:70px;
  }
  header{
    padding:11px 10px;
  }
  .bar{
    min-height:42px;
  }
  .brand.small{
    font-size:21px;
  }
  .userbox{
    gap:5px;
  }
  .logout{
    padding:8px;
    font-size:0;
  }
  .logout::after{
    content:"↪";
    font-size:18px;
  }
  nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:80;
    height:64px;
    margin:0;
    padding:6px 5px calc(6px + env(safe-area-inset-bottom));
    background:#111827;
    border-top:1px solid #ffffff18;
    display:flex;
    justify-content:space-around;
    gap:2px;
    overflow:hidden;
  }
  nav button{
    flex:1;
    min-width:0;
    padding:6px 3px;
    border-radius:9px;
    background:transparent;
    color:#aeb7c5;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    white-space:normal;
  }
  nav button.active{
    background:#fff;
    color:#111827;
  }
  main{
    padding:15px 10px 35px;
  }
  .card{
    border-radius:16px;
    padding:14px;
  }
  .title{
    margin-bottom:12px;
  }
  .title h1{
    font-size:21px;
  }
  .stats{
    gap:8px;
  }
  .stats .card{
    padding:12px;
    margin-bottom:0;
  }
  .stats .big{
    font-size:17px;
    overflow-wrap:anywhere;
  }
  #app input,
  #app select,
  #app textarea{
    min-height:48px;
    font-size:16px;
  }
  .primary,
  .secondary,
  .btn{
    min-height:46px;
  }
  .tablewrap{
    margin:0 -5px;
  }
  .notificationPanel{
    top:62px;
    right:8px;
    width:calc(100vw - 16px);
    max-height:70vh;
  }
  .connection-status{
    bottom:76px;
    right:8px;
    opacity:.9;
  }
  .rentBalance{
    font-size:28px;
  }
  .rentActionRow button{
    min-height:44px;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="auth" class="auth">
<div class="login">

<div class="brand">
Mav<span>Rent</span>
</div>

<div class="muted">
Rental management platform
</div>

<div class="role">
<button id="landlordRole" class="sel" type="button" onclick="chooseRole('landlord')">
🏢 Landlord
</button>

<button id="tenantRole" type="button" onclick="chooseRole('tenant')">
👤 Tenant
</button>
</div>

<form id="loginForm">
<label>Email</label>
<input id="email" type="email" required placeholder="you@example.com">

<label>Password</label>
<input id="password" type="password" required placeholder="Enter password">

<button class="primary">Login</button>
</form>

<button class="secondary" onclick="signup()">Create account</button>
<button class="link" onclick="resetPassword()">Forgot password?</button>

<div id="authMsg" class="message hidden"></div>

</div>
</div>


<!-- =====================================================
     APPLICATION
===================================================== -->

<div id="app" class="hidden">

<header>
<div class="bar">
  <div class="brand small">Mav<span>Rent</span></div>

  <div class="userbox">
    <span id="who"></span>
    <button class="notifyBtn" onclick="toggleNotifications()" title="Notifications">
      🔔
      <span id="notifyCount" class="notifyCount hidden">0</span>
    </button>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</div>

<nav id="nav"></nav>
</header>

<main id="main"></main>

</div>


<!-- =====================================================
     MORE NAVIGATION DRAWER
===================================================== -->

<div id="navBackdrop" class="nav-backdrop" onclick="closeNavDrawer()"></div>

<div id="navDrawer" class="nav-drawer">
  <div class="drawer-head">
    <h3>More Options</h3>
    <button class="drawer-close" onclick="closeNavDrawer()">✕</button>
  </div>
  <div id="drawerContent" class="drawer-content"></div>
</div>


<!-- =====================================================
     NOTIFICATION PANEL
===================================================== -->

<div id="notificationPanel" class="notificationPanel hidden">
<div class="notificationHead">
  <h3 style="margin:0">🔔 Notifications</h3>
  <button class="btn" onclick="markAllNotificationsRead()">Mark all read</button>
</div>

<div id="notificationList"></div>
</div>


<script>

/* =====================================================
   STARTUP SAFETY
===================================================== */
window.addEventListener('load',()=>{
  const loader=document.getElementById('mavLoading');
  if(loader){
    setTimeout(()=>loader.classList.add('hide'),700);

let mavrentSWRegistration = null;

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

async function registerMavRentServiceWorker(){
  if(!('serviceWorker' in navigator)) return null;
  try{
    mavrentSWRegistration = await navigator.serviceWorker.register('./sw.js?v=14.6',{scope:'./'});
    await navigator.serviceWorker.ready;
    console.log('MavRent service worker ready:', mavrentSWRegistration.scope);
    return mavrentSWRegistration;
  }catch(error){
    console.error('MavRent service worker registration failed:', error);
    return null;
  }
}

if('serviceWorker' in navigator){

async function subscribeToPushNotifications() {
  const statusEl = $('pushStatus');
  if (statusEl) statusEl.textContent = 'Requesting permission...';
  
  if (!('PushManager' in window)) {
    alert('Push notifications are not supported in this browser.');
    if (statusEl) statusEl.textContent = 'Not supported in browser';
    return;
  }

  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();

    if (!sub) {
      const convertedKey = urlBase64ToUint8Array(MAVRENT_VAPID_PUBLIC_KEY);
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: convertedKey
      });
    }

    if (sb && user) {
      await sb.from('push_subscriptions').upsert({
        user_id: user.id,
        subscription: sub,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
    }

    if (statusEl) statusEl.textContent = 'Active & Subscribed';
    alert('Background push notifications enabled successfully!');
  } catch (err) {
    console.error('Push Subscription Error:', err);
    if (statusEl) statusEl.textContent = 'Failed to enable';
    alert('Failed to enable push notifications: ' + err.message);
  }
}

function ensureSupabase(){
  if(sb)return Promise.resolve(sb);

  supabaseReadyPromise=new Promise((resolve,reject)=>{
    let tries=0;
    const timer=setInterval(()=>{

      tries++;

let scheduleMaintenanceRunning=false;
async function ensureRentSchedules(){
  if(scheduleMaintenanceRunning||!user||role!=='landlord'||!navigator.onLine)return;
  scheduleMaintenanceRunning=true;
  try{
    for(const t of cache.tenants){
      const rows=cache.rent_records.filter(x=>x.tenant_id===t.id);
      if(!rows.length) continue;
      const last=rows.slice().sort((a,b)=>String(b.period_month).localeCompare(String(a.period_month)))[0];
      const monthsAhead=Math.round((new Date(last.period_month+'T00:00:00')-new Date(monthStart(today())+'T00:00:00'))/(30.44*86400000));
    }
  }catch(e){console.warn('Background rent schedule update:',e)}
  finally{scheduleMaintenanceRunning=false;}
}

async function loadApp(){
  if(!user||loading) return;
  loading=true;

  profile=await loadProfile();
  role=profile?.role||user.user_metadata?.role||role;

  if(!['landlord','tenant'].includes(role)) role='tenant';

  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');

  buildNav();
  await refresh();
  await loadNotifications();

  show(role==='landlord'?'dashboard':'home',false);
  startRealtime();

  loading=false;
  setTimeout(()=>ensureRentSchedules(),250);
}

/* =====================================================
   REFRESH DATA
===================================================== */

async function refresh(){
  cache={
    properties:[], units:[], tenants:[], registeredTenants:[],
    payments:[], maintenance_requests:[], expenses:[], receipts:[], rent_records:[]
  };

  if(role==='landlord'){
    let r=await sb.from('profiles').select('id,full_name,email,phone,role,tenant_code,created_at')
      .eq('role','tenant').order('created_at',{ascending:false});
    if(r.error) return dbErr('profiles',r.error);
    cache.registeredTenants=r.data||[];

    r=await sb.from('properties').select('*').eq('landlord_id',user.id).order('created_at',{ascending:false});
    if(r.error) return dbErr('properties',r.error);
    cache.properties=r.data||[];

    let ids=cache.properties.map(x=>x.id);
    if(ids.length){
      r=await sb.from('units').select('*').in('property_id',ids);
      if(r.error) return dbErr('units',r.error);
      cache.units=r.data||[];
    }

    for(let t of ['tenants','payments','maintenance_requests','expenses','receipts']){
      r=await sb.from(t).select('*').eq('landlord_id',user.id)
        .order(t==='receipts'?'issued_at':'created_at',{ascending:false});
      if(r.error && t==='receipts') r=await sb.from(t).select('*').eq('landlord_id',user.id);
      if(r.error) return dbErr(t,r.error);
      cache[t]=r.data||[];
    }

    r=await sb.from('rent_records').select('*').eq('landlord_id',user.id).order('period_month',{ascending:false});
    if(r.error) return dbErr('rent_records',r.error);
    cache.rent_records=r.data||[];

  }else{
    let r=await sb.from('tenants').select('*').eq('profile_id',user.id).eq('status','active');
    if(r.error) return dbErr('tenants',r.error);
    cache.tenants=r.data||[];

    let uids=cache.tenants.map(x=>x.unit_id).filter(Boolean);
    if(uids.length){
      r=await sb.from('units').select('*').in('id',uids);
      if(r.error) return dbErr('units',r.error);
      cache.units=r.data||[];

      let pids=cache.units.map(x=>x.property_id).filter(Boolean);
      if(pids.length){
        r=await sb.from('properties').select('*').in('id',pids);
        if(r.error) return dbErr('properties',r.error);
        cache.properties=r.data||[];
      }
    }

    let tids=cache.tenants.map(x=>x.id);
    if(tids.length){
      for(let t of ['payments','maintenance_requests','receipts']){
        r=await sb.from(t).select('*').in('tenant_id',tids)
          .order(t==='payments'?'payment_date':t==='receipts'?'issued_at':'created_at',{ascending:false});
        if(r.error) return dbErr(t,r.error);
        cache[t]=r.data||[];
      }

      r=await sb.from('rent_records').select('*').in('tenant_id',tids).order('period_month',{ascending:false});
      if(r.error) return dbErr('rent_records',r.error);
      cache.rent_records=r.data||[];
    }
  }
}

async function loadNotifications(){
  const { data } = await sb.from('notifications')
    .select('*')
    .eq('user_id', user.id)
    .order('created_at', { ascending: false });
  notifications = data || [];
  updateNotifyBadge();
}

function updateNotifyBadge(){
  const unread = notifications.filter(n => !n.is_read).length;
  const badge = $('notifyCount');
  if(badge){
    badge.textContent = unread;
    badge.classList.toggle('hidden', unread === 0);
  }
}

function toggleNotifications(){
  const panel = $('notificationPanel');
  panel.classList.toggle('hidden');
  if(!panel.classList.contains('hidden')){
    renderNotificationList();
  }
}

function renderNotificationList(){
  const list = $('notificationList');
  if(!notifications.length){
    list.innerHTML = '<div class="empty">No notifications yet</div>';
    return;
  }
  list.innerHTML = notifications.map(n => `
    <div class="notificationItem ${n.is_read ? '' : 'unread'}" onclick="markRead('${n.id}')">
      <div class="notificationTitle">${esc(n.title || 'Notification')}</div>
      <div class="notificationMessage">${esc(n.message)}</div>
      <div class="notificationDate">${new Date(n.created_at).toLocaleString()}</div>
    </div>
  `).join('');
}

async function markRead(id){
  await sb.from('notifications').update({ is_read: true }).eq('id', id);
  loadNotifications();
}

async function markAllNotificationsRead(){
  await sb.from('notifications').update({ is_read: true }).eq('user_id', user.id);
  loadNotifications();
}

function toggleNavDrawer(){
  const drawer=$('navDrawer');
  const backdrop=$('navBackdrop');
  if(!drawer||!backdrop) return;
  drawer.classList.toggle('active');
  backdrop.classList.toggle('active');
}

function closeNavDrawer(){
  const drawer=$('navDrawer');
  const backdrop=$('navBackdrop');
  if(drawer) drawer.classList.remove('active');
  if(backdrop) backdrop.classList.remove('active');
}

function buildNav(){
  $('who').textContent = (role==='landlord'?'Landlord: ':'Tenant: ') + (profile?.full_name||user.email);

  let primaryItems = role==='landlord'
    ? ['dashboard:🏠 Dashboard', 'rent:💰 Rent', 'payments:💳 Payments', 'tenants:👥 Tenants']
    : ['home:🏠 My Home', 'myRent:💰 My Rent', 'myPayments:💳 My Payments', 'myMaintenance:🔧 Maintenance'];

  let secondaryItems = role==='landlord'
    ? ['properties:🏘️ Properties', 'units:🚪 Units', 'maintenance:🔧 Maintenance', 'expenses:🧾 Expenses', 'receipts:🧾 Receipts', 'reports:📊 Reports', 'profile:👤 Profile']
    : ['myReceipts:🧾 My Receipts', 'profile:👤 Profile'];

  let navHtml = primaryItems.map(item => {
    let [key, label] = item.split(':');
    return `<button id="nav-${key}" onclick="show('${key}')">${label}</button>`;
  }).join('');

  navHtml += `<button onclick="toggleNavDrawer()">⚙️ More</button>`;
  $('nav').innerHTML = navHtml;

  let drawerHtml = secondaryItems.map(item => {
    let [key, label] = item.split(':');
    return `<button id="drawer-${key}" onclick="show('${key}'); closeNavDrawer();">${label}</button>`;
  }).join('');

  $('drawerContent').innerHTML = drawerHtml;
}

function show(tabKey, updateHistory=true){
  activeTab = tabKey;
  document.querySelectorAll('nav button, .drawer-content button').forEach(btn => btn.classList.remove('active'));
  
  const activeNavBtn = $(`nav-${tabKey}`);
  if(activeNavBtn) activeNavBtn.classList.add('active');

  const activeDrawerBtn = $(`drawer-${tabKey}`);
  if(activeDrawerBtn) activeDrawerBtn.classList.add('active');

  renderCurrentView();
}
