<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- PWA Manifest & Web App Configurations -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MavRent">

  <title>MavRent V14.3 Stable</title>

  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =====================================================
       GLOBAL CORE & VARIABLE DEFINITIONS
    ===================================================== */
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --drawer-width: 280px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
      -webkit-overflow-scrolling: touch;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    /* =====================================================
       AUTHENTICATION SCREEN
    ===================================================== */
    .auth {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 25px;
      background:
        radial-gradient(circle at 15% 15%, #34b4ff55, transparent 30%),
        radial-gradient(circle at 85% 20%, #0062ff66, transparent 34%),
        linear-gradient(135deg, #061b45, #0a4da2 48%, #03163d);
    }

    .login {
      width: min(450px, 100%);
      padding: 30px;
      color: #fff;
      border: 1px solid #ffffff44;
      border-radius: 26px;
      background: #ffffff18;
      backdrop-filter: blur(22px);
      box-shadow: 0 28px 80px #00000055;
    }

    .brand { font-size: 32px; font-weight: 900; }
    .brand span { color: #67c7ff; }
    .muted { color: #ffffffb8; font-size: 13px; }

    .role {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin: 22px 0;
    }

    .role button, .secondary {
      padding: 13px;
      border: 1px solid #ffffff44;
      background: #ffffff12;
      color: #fff;
      border-radius: 12px;
    }

    .role .sel { background: #fff; color: #0869d7; font-weight: 700; }

    label { display: block; font-size: 12px; margin: 12px 0 6px; color: #ffffffd0; }

    .login input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ffffff4d;
      border-radius: 12px;
      background: #ffffff12;
      color: #fff;
      outline: 0;
    }

    .login input::placeholder { color: #ffffff99; }

    .primary {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #087cff, #00b8ff);
      color: #fff;
      font-weight: 800;
    }

    .secondary { width: 100%; margin-top: 10px; font-weight: 700; }

    .link {
      background: none;
      border: 0;
      color: #bfe7ff;
      margin-top: 12px;
      text-decoration: underline;
    }

    .message {
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 12px;
    }

    .message.error { background: #fff0f0; color: #8f2222; }
    .message.success { background: #ecfdf3; color: #08743f; }

    /* =====================================================
       HEADER & NAVIGATION DRAWER
    ===================================================== */
    header {
      background: #111827;
      color: #fff;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .bar {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .userbox {
      font-size: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .logout, .notifyBtn {
      background: #273244;
      color: #fff;
      border: 0;
      border-radius: 99px;
      padding: 8px 12px;
    }

    .notifyBtn { position: relative; font-size: 16px; }

    .notifyCount {
      position: absolute;
      right: -5px;
      top: -6px;
      background: #ef4444;
      border-radius: 50%;
      font-size: 10px;
      min-width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 2px solid #111827;
      font-weight: 700;
    }

    /* Off-Canvas Navigation Drawer */
    .mobile-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--drawer-width);
      height: 100vh;
      background-color: var(--card-bg);
      z-index: 1000;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
    }

    .mobile-drawer.open { transform: translateX(0); }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .drawer-header h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .drawer-links {
      display: flex;
      flex-direction: column;
      padding: 12px 0;
      overflow-y: auto;
    }

    .drawer-links a {
      padding: 14px 20px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      border-left: 4px solid transparent;
      transition: background 0.15s ease;
      cursor: pointer;
    }

    .drawer-links a:active, .drawer-links a.active {
      background-color: #eff6ff;
      border-left-color: var(--primary);
      color: var(--primary);
    }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-overlay.open { opacity: 1; pointer-events: auto; }

    /* =====================================================
       LAYOUT & VIEWS
    ===================================================== */
    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px 14px 50px;
    }

    .app-view { display: none; }
    .app-view.active-view { display: block; }

    .title { margin-bottom: 15px; }
    .title h1 { margin: 0; font-size: 25px; }
    .title p { margin: 5px 0; color: #6b7280; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background: #fff;
      border: 1px solid #e3e6ea;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .big { font-size: 22px; font-weight: 800; margin-top: 6px; }
    .green { color: #13844b; }
    .red { color: #c93636; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

    .btn {
      border: 1px solid #d9dde3;
      background: #fff;
      color: #17202a;
      border-radius: 10px;
      padding: 11px;
      text-align: left;
      font-weight: 700;
    }

    .btn-small {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .activity-list { list-style: none; }
    .activity-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
    .activity-item:last-child { border-bottom: none; }

    .notification-banner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* =====================================================
       NOTIFICATIONS & STATUS INDICATORS
    ===================================================== */
    .notificationPanel {
      position: fixed;
      right: 20px;
      top: 65px;
      width: min(390px, calc(100vw - 30px));
      max-height: 75vh;
      overflow: auto;
      background: #fff;
      border: 1px solid #e2e5e9;
      border-radius: 16px;
      box-shadow: 0 20px 60px #0003;
      z-index: 1100;
    }

    .notificationHead {
      padding: 15px;
      border-bottom: 1px solid #eceef1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notificationItem { padding: 14px; border-bottom: 1px solid #eceef1; cursor: pointer; }
    .notificationItem.unread { background: #eff6ff; }
    .notificationTitle { font-weight: 800; }
    .notificationMessage { font-size: 12px; color: #5f6875; margin-top: 4px; }
    .notificationDate { font-size: 10px; color: #9299a3; margin-top: 7px; }

    .mav-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 20% 20%, #34b4ff44, transparent 30%),
        linear-gradient(135deg, #061b45, #0869d7 55%, #03163d);
      color: #fff;
      transition: opacity .35s ease, visibility .35s ease;
    }

    .mav-loading.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .mav-loading-logo {
      width: 82px;
      height: 82px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #087cff, #00b8ff);
      box-shadow: 0 20px 50px #0005;
      font-size: 42px;
      font-weight: 900;
    }
    .mav-loading-name { margin-top: 18px; font-size: 32px; font-weight: 900; }
    .mav-loading-name span { color: #67c7ff; }
    .mav-loading-text { margin-top: 5px; color: #ffffffaa; font-size: 13px; }

    .mav-spinner {
      width: 25px;
      height: 25px;
      margin-top: 25px;
      border: 3px solid #ffffff40;
      border-top-color: #fff;
      border-radius: 50%;
      animation: mavspin .8s linear infinite;
    }

    @keyframes mavspin { to { transform: rotate(360deg); } }

    .connection-status {
      position: fixed;
      right: 12px;
      bottom: 14px;
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 5px 20px #0002;
      font-size: 11px;
      font-weight: 800;
    }

    .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
    .connection-status.offline { color: #991b1b; }
    .connection-status.offline .connection-dot { background: #ef4444; }

    /* =====================================================
       MEDIA QUERIES (DESKTOP / MOBILE RESPONSIVENESS)
    ===================================================== */
    @media (min-width: 768px) {
      .drawer-overlay { display: none !important; }
      #app-layout { display: flex; }
      .mobile-drawer {
        position: static;
        transform: translateX(0);
        box-shadow: none;
        border-right: 1px solid var(--border-color);
        height: calc(100vh - 60px);
      }
      .close-btn { display: none; }
      main { flex: 1; margin: 0; }
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

<body>

  <!-- Loading Splash Screen -->
  <div id="mavLoading" class="mav-loading">
    <div class="mav-loading-logo">M</div>
    <div class="mav-loading-name">Mav<span>Rent</span></div>
    <div class="mav-loading-text">Rental Management Platform</div>
    <div class="mav-spinner"></div>
  </div>

  <!-- Connection Monitor -->
  <div id="connectionStatus" class="connection-status online">
    <span class="connection-dot"></span>
    <span id="connectionText">Online</span>
  </div>

  <!-- AUTHENTICATION CONTAINER -->
  <div id="auth" class="auth">
    <div class="login">
      <div class="brand">Mav<span>Rent</span></div>
      <div class="muted">Rental Management Platform</div>

      <div class="role">
        <button id="landlordRole" class="sel" type="button" onclick="chooseRole('landlord')">🏢 Landlord</button>
        <button id="tenantRole" type="button" onclick="chooseRole('tenant')">👤 Tenant</button>
      </div>

      <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" required placeholder="you@example.com">

        <label>Password</label>
        <input id="password" type="password" required placeholder="Enter password">

        <button class="primary" type="submit">Login</button>
      </form>

      <button class="secondary" onclick="signup()">Create account</button>
      <button class="link" onclick="resetPassword()">Forgot password?</button>

      <div id="authMsg" class="message hidden"></div>
    </div>
  </div>

  <!-- APPLICATION CONTAINER -->
  <div id="app" class="hidden">
    
    <header>
      <div class="bar">
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="icon-btn" onclick="toggleMobileMenu()" aria-label="Open Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="brand" style="font-size: 22px;">Mav<span>Rent</span></div>
        </div>

        <div class="userbox">
          <span id="who"></span>
          <button class="notifyBtn" onclick="toggleNotifications()" title="Notifications">
            🔔
            <span id="notifyCount" class="notifyCount hidden">0</span>
          </button>
          <button class="logout" onclick="logout()">Log out</button>
        </div>
      </div>
    </header>

    <div id="app-layout">
      <!-- Off-Canvas Menu Drawer -->
      <aside id="mobile-drawer" class="mobile-drawer">
        <div class="drawer-header">
          <h3>Navigation</h3>
          <button class="close-btn" onclick="toggleMobileMenu()">&times;</button>
        </div>
        <nav class="drawer-links" id="drawer-nav-links">
          <!-- Navigation links rendered dynamically via JS based on user role -->
        </nav>
      </aside>
      <div id="drawer-overlay" class="drawer-overlay" onclick="toggleMobileMenu()"></div>

      <main id="main">
        <!-- Push Notification Prompt Banner -->
        <div id="notif-banner" class="notification-banner" style="display: none;">
          <p>Enable push notifications for updates even when the app is closed.</p>
          <button class="btn-small" onclick="enablePushNotifications()">Enable</button>
        </div>

        <!-- Dynamic Page View Container -->
        <div id="view-container"></div>
      </main>
    </div>
  </div>

  <!-- NOTIFICATION PANEL -->
  <div id="notificationPanel" class="notificationPanel hidden">
    <div class="notificationHead">
      <h3 style="margin:0">🔔 Notifications</h3>
      <button class="btn-small" onclick="markAllNotificationsRead()">Mark all read</button>
    </div>
    <div id="notificationList"></div>
  </div>

  <script>
    // =====================================================
    // 1. CONFIGURATION & STATE
    // =====================================================
    const SUPABASE_URL = "https://wborvbuqdiscoasnsrwa.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indib3J2YnVxZGlzY29hc25zcndhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NjMxMzcsImV4cCI6MjEwMjEzOTEzN30.T-N8JoZn433WNrV1fBY3wQ_C_7QrCYzzCei_5Q4s3bo";
    const VAPID_PUBLIC_KEY = "BPta9_z15Ou9pn1uxOt-uvH5i8hRPO0ARNUx-tZtWTHe5HWoBYgRbkXGl6CudK-VRz7mNHc7WY5BZPfUWOhko2A";

    let sb = null;
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let role = 'landlord';
    let user = null;
    let profile = null;
    let notifications = [];
    let channel = null;
    let activeViewId = '';

    let cache = {
      properties: [], units: [], tenants: [], registeredTenants: [],
      payments: [], maintenance_requests: [], expenses: [], receipts: [], rent_records: []
    };

    const $ = id => document.getElementById(id);
    const money = n => 'UGX ' + Number(n || 0).toLocaleString('en-US');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    }[m]));

    // =====================================================
    // 2. LIFECYCLE & INITIALIZATION
    // =====================================================
    window.addEventListener('load', () => {
      const loader = $('mavLoading');
      if (loader) setTimeout(() => loader.classList.add('hide'), 600);
      updateOnlineStatus();
      initServiceWorker();
    });

    function updateOnlineStatus() {
      const statusEl = $('connectionStatus');
      const textEl = $('connectionText');
      if (!statusEl) return;
      if (navigator.onLine) {
        statusEl.className = 'connection-status online';
        textEl.textContent = 'Online';
      } else {
        statusEl.className = 'connection-status offline';
        textEl.textContent = 'Offline';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // =====================================================
    // 3. AUTHENTICATION HANDLERS
    // =====================================================
    function chooseRole(r) {
      role = r;
      $('landlordRole').classList.toggle('sel', r === 'landlord');
      $('tenantRole').classList.toggle('sel', r === 'tenant');
    }

    function msg(t, c = 'error') {
      let x = $('authMsg');
      if (!x) return;
      x.textContent = t;
      x.className = 'message ' + c;
      x.classList.remove('hidden');
    }

    async function signup() {
      let email = $('email').value.trim();
      let password = $('password').value;
      if (!email) return msg('Enter your email.');
      if (password.length < 6) return msg('Password must be at least 6 characters.');

      msg('Creating account...', 'success');
      let r = await sb.auth.signUp({
        email, password, options: { data: { role, full_name: '', phone: '' } }
      });

      if (r.error) return msg(r.error.message);
      if (r.data.session) {
        user = r.data.user;
        await loadApp();
      } else {
        msg('Account created. Check your email to confirm, then log in.', 'success');
      }
    }

    async function resetPassword() {
      let e = $('email').value.trim();
      if (!e) return msg('Enter your email first.');
      let r = await sb.auth.resetPasswordForEmail(e, { redirectTo: location.origin });
      if (r.error) return msg(r.error.message);
      msg('Password reset email sent.', 'success');
    }

    $('loginForm').onsubmit = async e => {
      e.preventDefault();
      msg('Logging in...', 'success');
      let r = await sb.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value
      });

      if (r.error) return msg(r.error.message);
      user = r.data.user;
      await loadApp();
    };

    async function loadProfile() {
      let r = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      return r.data;
    }

    async function loadApp() {
      if (!user) return;
      profile = await loadProfile();
      role = profile?.role || user.user_metadata?.role || role;
      if (!['landlord', 'tenant'].includes(role)) role = 'tenant';

      $('auth').classList.add('hidden');
      $('app').classList.remove('hidden');

      buildNav();
      await refresh();
      await loadNotifications();

      navigateTo(role === 'landlord' ? 'dashboard' : 'home', false);
      startRealtime();
    }

    async function logout() {
      if (channel) await sb.removeChannel(channel);
      await sb.auth.signOut();
      location.reload();
    }

    // =====================================================
    // 4. NAVIGATION & DRAWER
    // =====================================================
    function toggleMobileMenu() {
      $('mobile-drawer').classList.toggle('open');
      $('drawer-overlay').classList.toggle('open');
    }

    function buildNav() {
      $('who').textContent = (role === 'landlord' ? 'Landlord: ' : 'Tenant: ') + (profile?.full_name || user.email);

      const landlordItems = [
        'dashboard:🏠 Dashboard', 'rent:💰 Rent', 'properties:🏘️ Properties',
        'units:🚪 Units', 'tenants:👥 Tenants', 'payments:💳 Payments',
        'maintenance:🔧 Maintenance', 'expenses:🧾 Expenses', 'receipts:🧾 Receipts',
        'reports:📊 Reports', 'guide:❓ Guide', 'profile:👤 Profile'
      ];

      const tenantItems = [
        'home:🏠 My Home', 'myRent:💰 My Rent', 'myPayments:💳 My Payments',
        'myMaintenance:🔧 Maintenance', 'myReceipts:🧾 My Receipts',
        'guide:❓ Guide', 'profile:👤 My Profile'
      ];

      const items = role === 'landlord' ? landlordItems : tenantItems;

      $('drawer-nav-links').innerHTML = items.map(x => {
        let [id, label] = x.split(':');
        return `<a onclick="navigateTo('${id}')" id="nav-${id}">${label}</a>`;
      }).join('');
    }

    async function navigateTo(viewId, fetchLatest = true) {
      if (fetchLatest) await refresh();
      activeViewId = viewId;

      document.querySelectorAll('#drawer-nav-links a').forEach(el => el.classList.remove('active'));
      const activeEl = $(`nav-${viewId}`);
      if (activeEl) activeEl.classList.add('active');

      if ($('mobile-drawer').classList.contains('open')) {
        toggleMobileMenu();
      }

      renderView(viewId);
    }

    // =====================================================
    // 5. DATA FETCHING & RENDERING
    // =====================================================
    async function refresh() {
      cache = {
        properties: [], units: [], tenants: [], registeredTenants: [],
        payments: [], maintenance_requests: [], expenses: [], receipts: [], rent_records: []
      };

      if (!user) return;

      if (role === 'landlord') {
        let r = await sb.from('properties').select('*').eq('landlord_id', user.id);
        cache.properties = r.data || [];

        let ids = cache.properties.map(x => x.id);
        if (ids.length) {
          r = await sb.from('units').select('*').in('property_id', ids);
          cache.units = r.data || [];
        }

        for (let t of ['tenants', 'payments', 'maintenance_requests', 'expenses', 'receipts', 'rent_records']) {
          r = await sb.from(t).select('*').eq('landlord_id', user.id);
          cache[t] = r.data || [];
        }
      } else {
        let r = await sb.from('tenants').select('*').eq('profile_id', user.id);
        cache.tenants = r.data || [];

        let tids = cache.tenants.map(x => x.id);
        if (tids.length) {
          for (let t of ['payments', 'maintenance_requests', 'receipts', 'rent_records']) {
            r = await sb.from(t).select('*').in('tenant_id', tids);
            cache[t] = r.data || [];
          }
        }
      }
    }

    function renderView(id) {
      const container = $('view-container');

      if (id === 'dashboard') {
        let paid = cache.rent_records.reduce((a, x) => a + Number(x.amount_paid || 0), 0);
        let due = cache.rent_records.reduce((a, x) => a + Number(x.amount_due || 0), 0);
        let outstanding = Math.max(0, due - paid);

        container.innerHTML = `
          <div class="title">
            <h1>Landlord Dashboard</h1>
            <p>Rental Overview and Analytics</p>
          </div>
          <div class="stats">
            <div class="card"><small>Properties</small><div class="big">${cache.properties.length}</div></div>
            <div class="card"><small>Units</small><div class="big">${cache.units.length}</div></div>
            <div class="card"><small>Rent Collected</small><div class="big green">${money(paid)}</div></div>
            <div class="card"><small>Outstanding</small><div class="big red">${money(outstanding)}</div></div>
          </div>
          <div class="grid">
            <div class="card">
              <h3>Quick Actions</h3>
              <div class="actions" style="margin-top:12px;">
                <button class="btn" onclick="navigateTo('rent')">💰 Rent</button>
                <button class="btn" onclick="navigateTo('properties')">🏘️ Properties</button>
                <button class="btn" onclick="navigateTo('tenants')">👥 Tenants</button>
                <button class="btn" onclick="navigateTo('payments')">💳 Payments</button>
              </div>
            </div>
            <div class="card">
              <h3>Recent Payments</h3>
              <ul class="activity-list" style="margin-top:8px;">
                ${cache.payments.length === 0 ? '<li class="activity-item"><span>No transactions found.</span></li>' :
                  cache.payments.slice(0, 5).map(p => `
                    <li class="activity-item">
                      <span>${esc(p.tenant_name || 'Payment')}</span>
                      <strong>${money(p.amount)}</strong>
                    </li>
                  `).join('')
                }
              </ul>
            </div>
          </div>
        `;
        return;
      }

      if (id === 'payments' || id === 'myPayments') {
        container.innerHTML = `
          <div class="title"><h1>Payment Records</h1></div>
          <div class="card">
            <ul class="activity-list">
              ${cache.payments.length === 0 ? '<li class="activity-item"><span>No payments found.</span></li>' :
                cache.payments.map(p => `
                  <li class="activity-item">
                    <span>${esc(p.tenant_name || 'Payment')} - ${esc(p.date || '')}</span>
                    <strong class="green">${money(p.amount)}</strong>
                  </li>
                `).join('')
              }
            </ul>
          </div>
        `;
        return;
      }

      // Fallback Module View Generator for structural consistency
      container.innerHTML = `
        <div class="title">
          <h1>${id.charAt(0).toUpperCase() + id.slice(1)}</h1>
          <p>MavRent V14.3 Active View</p>
        </div>
        <div class="card">
          <p>Data loaded for <strong>${esc(id)}</strong>. All components ready.</p>
        </div>
      `;
    }

    // =====================================================
    // 6. NOTIFICATIONS & PWA PUSH SYSTEM
    // =====================================================
    function toggleNotifications() {
      $('notificationPanel').classList.toggle('hidden');
    }

    async function loadNotifications() {
      if (!user || !sb) return;
      let r = await sb.from('notifications').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
      notifications = r.data || [];
      renderNotifications();
    }

    function renderNotifications() {
      const countEl = $('notifyCount');
      const listEl = $('notificationList');
      const unreadCount = notifications.filter(n => !n.is_read).length;

      if (countEl) {
        countEl.textContent = unreadCount;
        countEl.classList.toggle('hidden', unreadCount === 0);
      }

      if (!listEl) return;
      if (!notifications.length) {
        listEl.innerHTML = '<div style="padding:16px; text-align:center; color:#64748b;">No notifications yet.</div>';
        return;
      }

      listEl.innerHTML = notifications.map(n => `
        <div class="notificationItem ${n.is_read ? '' : 'unread'}" onclick="markNotificationRead('${n.id}')">
          <div class="notificationTitle">${esc(n.title || 'Notification')}</div>
          <div class="notificationMessage">${esc(n.message || '')}</div>
          <div class="notificationDate">${new Date(n.created_at).toLocaleString()}</div>
        </div>
      `).join('');
    }

    async function markNotificationRead(id) {
      const item = notifications.find(n => n.id === id);
      if (item && !item.is_read) {
        item.is_read = true;
        renderNotifications();
        await sb.from('notifications').update({ is_read: true }).eq('id', id);
      }
    }

    async function markAllNotificationsRead() {
      notifications.forEach(n => n.is_read = true);
      renderNotifications();
      await sb.from('notifications').update({ is_read: true }).eq('user_id', user.id);
    }

    function startRealtime() {
      if (!user || !sb) return;
      channel = sb.channel('public:notifications:' + user.id)
        .on('postgres_changes', {
          event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${user.id}`
        }, payload => {
          notifications.unshift(payload.new);
          renderNotifications();
        }).subscribe();
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    async function initServiceWorker() {
      if ('serviceWorker' in navigator && 'PushManager' in window) {
        try {
          await navigator.serviceWorker.register('/sw.js');
          if (Notification.permission === 'default') {
            $('notif-banner').style.display = 'flex';
          }
        } catch (err) {
          console.error('Service Worker Registration Failed:', err);
        }
      }
    }

    async function enablePushNotifications() {
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          $('notif-banner').style.display = 'none';
          const reg = await navigator.serviceWorker.ready;
          let sub = await reg.pushManager.getSubscription();

          if (!sub) {
            sub = await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
            });
          }

          if (user) {
            await sb.from('push_subscriptions').upsert({
              user_id: user.id, subscription: sub
            }, { onConflict: 'user_id' });
          }
          alert('Push Notifications Enabled!');
        }
      } catch (err) {
        console.error('Push Notification Error:', err);
      }
    }
  </script>
