<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">

<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">

<title>MavRent V15</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#f4f5f7;
color:#17202a;
-webkit-font-smoothing:antialiased
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.mav-loading{
position:fixed;
inset:0;
z-index:99999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:
radial-gradient(circle at 20% 20%,#34b4ff44,transparent 30%),
linear-gradient(135deg,#061b45,#0869d7 55%,#03163d);
color:#fff;
transition:opacity .35s ease,visibility .35s ease
}

.mav-loading.hide{
opacity:0;
visibility:hidden;
pointer-events:none
}

.mav-loading-logo{
width:82px;
height:82px;
border-radius:24px;
display:grid;
place-items:center;
background:linear-gradient(135deg,#087cff,#00b8ff);
box-shadow:0 20px 50px #0005;
font-size:42px;
font-weight:900
}

.mav-loading-name{
margin-top:18px;
font-size:32px;
font-weight:900
}

.mav-loading-name span{color:#67c7ff}

.mav-loading-text{
margin-top:5px;
color:#ffffffaa;
font-size:13px
}

.mav-loading-status{
margin-top:22px;
font-size:11px;
color:#ffffff99
}

.mav-spinner{
width:25px;
height:25px;
margin-top:18px;
border:3px solid #ffffff40;
border-top-color:#fff;
border-radius:50%;
animation:mavspin .8s linear infinite
}

@keyframes mavspin{
to{transform:rotate(360deg)}
}

.connection-status{
position:fixed;
right:12px;
bottom:14px;
z-index:90;
display:flex;
align-items:center;
gap:7px;
padding:7px 11px;
border-radius:999px;
background:#fff;
border:1px solid #e5e7eb;
box-shadow:0 5px 20px #0002;
font-size:11px;
font-weight:800
}

.connection-dot{
width:8px;
height:8px;
border-radius:50%;
background:#16a34a
}

.connection-status.offline{color:#991b1b}

.connection-status.offline .connection-dot{
background:#ef4444
}

/* AUTH */

.auth{
min-height:100vh;
display:grid;
place-items:center;
padding:25px;
background:
radial-gradient(circle at 15% 15%,#34b4ff55,transparent 30%),
radial-gradient(circle at 85% 20%,#0062ff66,transparent 34%),
linear-gradient(135deg,#061b45,#0a4da2 48%,#03163d)
}

.login{
width:min(450px,100%);
padding:30px;
color:#fff;
border:1px solid #ffffff44;
border-radius:26px;
background:#ffffff18;
backdrop-filter:blur(22px);
box-shadow:0 28px 80px #00000055
}

.brand{
font-size:32px;
font-weight:900
}

.brand span{color:#67c7ff}

.muted{
color:#ffffffb8;
font-size:13px
}

.role{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin:22px 0
}

.role button,.secondary{
padding:13px;
border:1px solid #ffffff44;
background:#ffffff12;
color:#fff;
border-radius:12px
}

.role .sel{
background:#fff;
color:#0869d7
}

label{
display:block;
font-size:12px;
margin:12px 0 6px;
color:#ffffffd0
}

.login input{
width:100%;
padding:13px;
border:1px solid #ffffff4d;
border-radius:12px;
background:#ffffff12;
color:#fff;
outline:0
}

.login input::placeholder{color:#ffffff99}

.primary{
width:100%;
margin-top:12px;
padding:13px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#087cff,#00b8ff);
color:#fff;
font-weight:800
}

.primary:disabled{
opacity:.55;
cursor:not-allowed
}

.secondary{
width:100%;
margin-top:10px;
font-weight:700
}

.link{
background:none;
border:0;
color:#bfe7ff;
margin-top:12px;
text-decoration:underline
}

.message,.notice{
padding:11px;
border-radius:10px;
font-size:13px;
margin-top:12px
}

.error{
background:#fff0f0;
color:#8f2222
}

.success{
background:#ecfdf3;
color:#08743f
}

.warning{
background:#fff8e6;
color:#8a5a00
}

/* APP */

header{
background:#111827;
color:#fff;
padding:15px;
position:sticky;
top:0;
z-index:20
}

.bar,nav,main{
max-width:1100px;
margin:auto

.bar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.small{font-size:22px}

.userbox{

gap:7px;
align-items:center
}

.logout,.notifyBtn{
background:#273244;
color:#fff;
border:0;
border-radius:99px;

.notifyBtn{
position:relative;

.notifyCount{

top:-6px;

/* NAVIGATION */

.navWrap{

nav{

nav button{

background:#273244;

.moreMenu{

.moreMenu button{

border:0;
background:#fff;
color:#17202a;
padding:12px;
border-radius:9px;
font-weight:700
}

.moreMenu button:hover{
background:#f1f5f9
}

.moreMenu button.active{
background:#e8f2ff;
color:#087cff
}

main{
padding:20px 14px 50px
}

.title{
margin-bottom:15px
}

.title h1{
margin:0;
font-size:25px
}

.title p{
margin:5px 0;
color:#6b7280
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.card{
background:#fff;
border:1px solid #e3e6ea;
border-radius:14px;
padding:16px;
margin-bottom:14px
}

.big{
font-size:22px;
font-weight:800;
margin-top:6px
}

.green{color:#13844b}
.orange{color:#b86b00}
.red{color:#c93636}
.blue{color:#1769d1}

.grid,.formgrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.full{grid-column:1/-1}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px

.btn{

background:#fff;
color:#17202a;
border-radius:10px;
padding:11px;
text-align:left;
font-weight:700
}

.btn:hover{
background:#f8fafc
}

.danger{
background:#fff0f0;
color:#a72828
}

.successBtn{
background:#ecfdf3;
color:#08743f
}

.warningBtn{
background:#fff8e6;
color:#966100
}

#app input,
#app select,
#app textarea{
width:100%;
padding:13px 14px;
border:1px solid #d9dde3;
border-radius:12px;
background:#fff;
color:#17202a!important;
caret-color:#17202a;

.tablewrap{
overflow:auto

.table{
width:100%;
border-collapse:collapse;
font-size:13px
}

.table th,.table td{
padding:10px 7px;
border-bottom:1px solid #eceef1;
text-align:left;
vertical-align:top;
white-space:nowrap
}

.wrap{
white-space:normal!important;

}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:20px;
background:#eef1f5;
font-size:11px

.badge.pending{
background:#fff4d6;
color:#956300

.badge.confirmed,
.badge.completed,
.badge.paid,
.badge.active,
.badge.vacant{

color:#166534

.badge.rejected,

.badge.in_progress,

.empty,.loading{

.code{
font-family:monospace;
font-weight:800;
letter-spacing:.5px

/* RENT */

.rentHero{
background:
linear-gradient(135deg,#071b41,#0869d7 55%,#00b8ff);
color:#fff;
border:0
}

.rentHero .muted{
color:#ffffffc9
}

.rentBalance{
font-size:32px;
font-weight:900;
margin-top:7px
}

.rentMiniGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px
}

.rentMini{
background:#ffffff18;
border:1px solid #ffffff30;

.rentMini small{

}

.rentMini strong{

margin-top:4px

.monthCard{

padding:15px;
margin-bottom:12px;
background:#fff

.monthTop{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px
}

.monthName{
font-weight:900;
font-size:17px
}

.amountGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:12px
}

.amountBox{
padding:11px;
border-radius:10px;
background:#f8fafc
}

.amountBox small{
display:block;
color:#667085
}

.amountBox strong{
display:block;
margin-top:4px
}

.rentActionRow{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px
}

.rentActionRow button{
border:1px solid #d9dde3;
background:#fff;
border-radius:99px;
padding:9px 12px;
font-weight:700
}

.alertCard{
border-left:4px solid #f59e0b;
background:#fffaf0
}

.dangerCard{
border-left:4px solid #ef4444;
background:#fff5f5
}

.infoCard{
border-left:4px solid #087cff;
background:#f3f8ff
}

/* GUIDE */

.guideGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.guideItem{
border:1px solid #e5e7eb;
border-radius:14px;
padding:16px;
background:#fff
}

.guideIcon{
font-size:28px
}

.guideItem h3{
margin:8px 0 5px
}

.guideItem p{
color:#667085;
font-size:13px;
line-height:1.55
}

.step{
display:flex;
gap:12px;
margin:14px 0
}

.stepNum{
min-width:32px;
height:32px;
border-radius:50%;
background:#087cff;
color:#fff;
display:grid;
place-items:center;
font-weight:900
}

/* PROFILE */

.profileHero{
display:flex;
align-items:center;
gap:15px;
margin-bottom:16px
}

.avatar{
width:68px;
height:68px;
border-radius:50%;
display:grid;
place-items:center;
background:linear-gradient(135deg,#087cff,#00b8ff);
color:#fff;
font-size:25px;
font-weight:900
}

.profileId{
background:#eef2ff;
border-radius:10px;
padding:10px;
font-family:monospace;
font-weight:800
}

/* NOTIFICATIONS */

.notificationPanel{
position:fixed;
right:20px;
top:75px;
width:min(390px,calc(100vw - 30px));
max-height:75vh;
overflow:auto;
background:#fff;
border:1px solid #e2e5e9;
border-radius:16px;
box-shadow:0 20px 60px #0003;
z-index:100
}

.notificationHead{
padding:15px;
border-bottom:1px solid #eceef1;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.notificationItem{
padding:14px;
border-bottom:1px solid #eceef1
}

.notificationItem.unread{
background:#eff6ff
}

.notificationTitle{
font-weight:800
}

.notificationMessage{
font-size:12px;
color:#5f6875;
margin-top:4px
}

.notificationDate{
font-size:10px;
color:#9299a3;
margin-top:7px
}

/* MAINTENANCE */

.mediaPreview{
max-width:280px;
max-height:220px;
border-radius:10px;
margin-top:8px
}

.mediaBox{
padding:10px;
border:1px solid #e5e7eb;
border-radius:10px;
background:#f8fafc;
margin-top:8px
}

.maintCard{
border:1px solid #e5e7eb;
border-radius:14px;
padding:14px;
margin-bottom:12px
}

.maintTop{
display:flex;
justify-content:space-between;
gap:10px
}

.maintMeta{
font-size:12px;
color:#667085;
line-height:1.6
}

.maintActions{
margin-top:12px;
padding-top:12px;
border-top:1px solid #eef0f3
}

.maintActionsGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

/* UNIT MANAGEMENT */

.autoUnitBox{
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:12px;
padding:13px;
margin-top:10px
}

.unitCountPreview{
font-size:12px;
color:#667085;
margin-top:7px
}

.propertySummary{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap
}

.statPill{
padding:7px 10px;
border-radius:999px;
background:#eef2ff;
font-size:11px;
font-weight:800
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:#0008;
z-index:500;
display:grid;
place-items:center;
padding:18px
}

.modalBox{
width:min(500px,100%);
max-height:90vh;
overflow:auto;
background:#fff;
border-radius:18px;
padding:20px;
box-shadow:0 30px 90px #0005
}

.modalHead{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.closeBtn{
border:0;
background:#f1f5f9;

height:38px;

.userbox{

}

.userbox span{

.logout{

font-size:0
}

nav{

.stats{

<body>

<!-- =====================================================
     LOADING
===================================================== -->

<div id="mavLoading" class="mav-loading">
<div class="mav-loading-logo">M</div>
<div class="mav-loading-name">Mav<span>Rent</span></div>
<div class="mav-loading-text">Rental management platform</div>
<div class="mav-spinner"></div>
<div id="loadingStatus" class="mav-loading-status">Starting MavRent...</div>
</div>

<div id="connectionStatus" class="connection-status">
<span class="connection-dot"></span>
<span id="connectionText">Online</span>
</div>

<!-- =====================================================
     AUTH
===================================================== -->

<div id="auth" class="auth">
<div class="login">
<div class="brand">Mav<span>Rent</span></div>
<div class="muted">Rental management platform</div>

<div class="role">
<button id="landlordRole" class="sel" type="button" onclick="chooseRole('landlord')">🏢 Landlord</button>
<button id="tenantRole" type="button" onclick="chooseRole('tenant')">👤 Tenant</button>
</div>

<form id="loginForm">
<label>Email</label>
<input id="email" type="email" required autocomplete="email" placeholder="you@example.com">

<label>Password</label>
<input id="password" type="password" required autocomplete="current-password" placeholder="Enter password">

<button id="loginBtn" class="primary" type="submit">Login</button>
</form>

<button class="secondary" type="button" onclick="signup()">Create account</button>
<button class="link" type="button" onclick="resetPassword()">Forgot password?</button>

<div id="authMsg" class="message hidden"></div>
</div>
</div>

<!-- =====================================================
     APPLICATION
===================================================== -->

<div id="app" class="hidden">
<header>
<div class="bar">
<div class="brand small">Mav<span>Rent</span></div>
<div class="userbox">
<span id="who"></span>
<button class="notifyBtn" type="button" onclick="toggleNotifications()" title="Notifications">
🔔 <span id="notifyCount" class="notifyCount hidden">0</span>
</button>
<button class="logout" type="button" onclick="logout()">Log out</button>
</div>
</div>

<div class="navWrap">
<nav id="nav"></nav>
<div id="moreMenu" class="moreMenu hidden"></div>
</div>
</header>

<main id="main"></main>
</div>

<!-- =====================================================
     NOTIFICATIONS
===================================================== -->

<div id="notificationPanel" class="notificationPanel hidden">
<div class="notificationHead">
<h3 style="margin:0">🔔 Notifications</h3>
<button class="btn" type="button" onclick="markAllNotificationsRead()">Mark all read</button>
</div>
<div id="notificationList"></div>
</div>

<!-- =====================================================
     MODAL
===================================================== -->

<div id="modal" class="modal hidden">
<div class="modalBox">
<div class="modalHead">
<h2 id="modalTitle" style="margin:0">MavRent</h2>
<button class="closeBtn" onclick="closeModal()">×</button>
</div>
<div id="modalBody"></div>
</div>
</div>

<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const SUPABASE_URL = 'https://wborvbuqdiscoasnsrwa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1mthstK0eNmIFL1PHmBDLg_-5YJYScn';
const MEDIA_BUCKET = 'maintenance-media';

const sb = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   GLOBAL STATE
===================================================== */

let role='landlord';
let user=null;
let profile=null;
let notifications=[];
let channel=null;
let busy=false;
let currentPage='dashboard';
let moreOpen=false;

let cache={
properties:[],
units:[],
tenants:[],
registeredTenants:[],
payments:[],
maintenance_requests:[],

const money=n => 'UGX '+Number(n||0).toLocaleString('en-US');

const today=() => new Date().toISOString().slice(0,10);

const esc=s => String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function shortId(id){
return id ? 'MVR-'+String(id).replace(/-/g,'').slice(0,8).toUpperCase() : '—';
}

function monthLabel(date){
if(!date)return '—';
return new Date(date+'T00:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
}

function monthStart(date){
const d=new Date((date||today())+'T00:00:00');
return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10);
}

function addMonths(date,n){
const d=new Date((date||today())+'T00:00:00');
d.setDate(1);
d.setMonth(d.getMonth()+Number(n));
return d.toISOString().slice(0,10);
}

function rentBalance(r){
return Math.max(0, Number(r.amount_due||0) - Number(r.amount_paid||0));
}

function getRentStatus(r){
const due=Number(r.amount_due||0);
const paid=Number(r.amount_paid||0);

if(paid>=due&&due>0) return 'paid';
if(paid>0&&paid<due) return 'partial';
if(r.due_date && r.due_date<today() && paid<due) return 'overdue';

return 'pending';
}

function rentStatusClass(status){
return String(status||'pending').toLowerCase().replace(/\s+/g,'_');
}

/* =====================================================
   SERVICE WORKER & PUSH NOTIFICATIONS
===================================================== */

function registerServiceWorker(){
if(!('serviceWorker' in navigator)) return;

window.addEventListener('load', async ()=>{
try {
const reg = await navigator.serviceWorker.register('./sw.js');
console.log('MavRent SW:', reg.scope);
setupPushNotifications(reg);
} catch(err) {
console.warn('MavRent service worker error:', err);
}
},{once:true});
}

async function setupPushNotifications(reg){
if(!('Notification' in window)) return;

if(Notification.permission === 'default'){
const perm = await Notification.requestPermission();
if(perm !== 'granted') return;
}

if(Notification.permission === 'granted' && reg.pushManager){
try {
let sub = await reg.pushManager.getSubscription();
if(!sub){
sub = await reg.pushManager.subscribe({
userVisibleOnly: true
});
}
if(sub && user){
await sb.from('push_subscriptions').upsert({
user_id: user.id,
subscription: JSON.stringify(sub),
updated_at: new Date().toISOString()
});
}
} catch(e) {
console.warn('Push subscription failed:', e);
}
}
}

registerServiceWorker();

/* =====================================================
   DATABASE ERROR

function dbErr(name,error){
console.error(name,error);
throw new Error(`${name}: ${error?.message||error}`);
}


/* =====================================================
   REFRESH DATABASE
===================================================== */

async function refresh(){
const fresh={
properties:[], units:[], tenants:[], registeredTenants:[],
payments:[], maintenance_requests:[], expenses:[], receipts:[], rent_records:[]
};

if(role==='landlord'){
let r = await sb.from('profiles')
.select('id,full_name,email,phone,role,tenant_code,created_at')
.eq('role','tenant')
.order('created_at',{ascending:false});
if(r.error) return dbErr('Tenant profiles', r.error);
fresh.registeredTenants = r.data||[];

r = await sb.from('properties')
.select('*')
.eq('landlord_id',user.id)
.order('created_at',{ascending:false});
if(r.error) return dbErr('Properties', r.error);
fresh.properties = r.data||[];

const propertyIds = fresh.properties.map(x=>x.id);
if(propertyIds.length){
r = await sb.from('units').select('*').in('property_id', propertyIds);
if(r.error) return dbErr('Units', r.error);
fresh.units = r.data||[];
}

for(const tableName of ['tenants','payments','maintenance_requests','expenses','receipts']){
r = await sb.from(tableName).select('*').eq('landlord_id', user.id);
if(r.error) return dbErr(tableName, r.error);
fresh[tableName] = r.data||[];
}

r = await sb.from('rent_records')
.select('*')
.eq('landlord_id', user.id)
.order('period_month', {ascending:false});
if(r.error) return dbErr('Rent records', r.error);
fresh.rent_records = r.data||[];

}else{
let r = await sb.from('tenants')
.select('*')
.eq('profile_id', user.id)
.eq('status', 'active');
if(r.error) return dbErr('Tenant account', r.error);
fresh.tenants = r.data||[];

const tenantIds = fresh.tenants.map(x=>x.id);
const unitIds = fresh.tenants.map(x=>x.unit_id).filter(Boolean);

if(unitIds.length){
r = await sb.from('units').select('*').in('id', unitIds);
if(r.error) return dbErr('Units', r.error);
fresh.units = r.data||[];

const propertyIds = fresh.units.map(x=>x.property_id).filter(Boolean);
if(propertyIds.length){
r = await sb.from('properties').select('*').in('id', propertyIds);
if(r.error) return dbErr('Properties', r.error);
fresh.properties = r.data||[];
}
}

if(tenantIds.length){
for(const tableName of ['payments','maintenance_requests','receipts']){
r = await sb.from(tableName).select('*').in('tenant_id', tenantIds);
if(r.error) return dbErr(tableName, r.error);
fresh[tableName] = r.data||[];
}

r = await sb.from('rent_records')
.select('*')
.in('tenant_id', tenantIds)
.order('period_month', {ascending:false});
if(r.error) return dbErr('Rent records', r.error);
fresh.rent_records = r.data||[];
}
}

cache = fresh;
await ensureCurrentRentRecords();
}


/* =====================================================
   AUTOMATIC RENT GENERATION (RESTRICTED TO NEXT MONTH)
===================================================== */

async function ensureCurrentRentRecords(){
if(!user || !cache.tenants.length) return;

const existing = cache.rent_records;
// Target month limit set strictly to next month (T+1) instead of 2 years ahead
const targetMonthLimit = addMonths(monthStart(today()), 1);

for(const tenant of cache.tenants){
const unit = cache.units.find(u=>u.id===tenant.unit_id);
const rentAmount = Number(tenant.rent_amount || unit?.monthly_rent || 0);

if(!rentAmount) continue;

const startMonth = monthStart(tenant.move_in_date || tenant.created_at || today());
let month = startMonth;
let safety = 0;

while(month <= targetMonthLimit && safety < 12){
safety++;
const exists = existing.some(r => r.tenant_id===tenant.id && monthStart(r.period_month)===month);

if(!exists){
await createRentRecord(tenant, unit, month, rentAmount);
}

month = addMonths(month, 1);
}
}

if(role==='landlord'){
const r = await sb.from('rent_records')
.select('*')
.eq('landlord_id', user.id)
.order('period_month', {ascending:false});
if(!r.error) cache.rent_records = r.data||[];
}else{
const ids = cache.tenants.map(x=>x.id);
if(ids.length){
const r = await sb.from('rent_records')
.select('*')
.in('tenant_id', ids)
.order('period_month', {ascending:false});
if(!r.error) cache.rent_records = r.data||[];
}
}
}


/* =====================================================
   CREATE RENT RECORD
===================================================== */

async function createRentRecord(tenant, unit, periodMonth, amount){
const dueDay = Math.min(28, Math.max(1, Number(tenant.rent_due_day||5)));
const d = new Date(periodMonth+'T00:00:00');
d.setDate(dueDay);

const dueDate = d.toISOString().slice(0,10);

const payload={
landlord_id: tenant.landlord_id || user.id,
tenant_id: tenant.id,
unit_id: tenant.unit_id || null,
period_month: periodMonth,
due_date: dueDate,
amount_due: amount,
amount_paid: 0,
status: 'pending'
};

const r = await sb.from('rent_records').insert(payload);

if(r.error){
if(!String(r.error.message||'').toLowerCase().includes('duplicate')){
console.warn('Rent generation:', r.error.message);
}
}
}
