<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>MavRent v3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f5f7;color:#17202a}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}

/* ===== BLUE GLASS LOGIN ===== */
.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:28px 18px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 15%,rgba(52,180,255,.30),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(0,98,255,.35),transparent 34%),
    radial-gradient(circle at 50% 100%,rgba(0,55,180,.45),transparent 45%),
    linear-gradient(135deg,#061b45 0%,#0a4da2 48%,#03163d 100%);
}
.auth:before,.auth:after{
  content:"";position:absolute;border-radius:50%;filter:blur(8px);pointer-events:none
}
.auth:before{width:360px;height:360px;background:rgba(31,170,255,.20);left:-130px;bottom:-110px}
.auth:after{width:420px;height:420px;background:rgba(56,104,255,.18);right:-160px;top:-130px}

.login{
  width:min(450px,100%);
  padding:30px;
  position:relative;
  z-index:1;
  color:#fff;
  border:1px solid rgba(255,255,255,.28);
  border-radius:26px;
  background:linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.07));
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:0 28px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);
}
.brand{font-size:32px;font-weight:900;letter-spacing:-1px}.brand span{color:#67c7ff}
.muted,.label{color:rgba(255,255,255,.72);font-size:13px}
.role{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:22px 0}
.role button{
  padding:13px;border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.08);color:#fff;border-radius:13px;
  transition:.2s
}
.role button:hover{background:rgba(255,255,255,.15)}
.role .sel{
  background:rgba(255,255,255,.88);color:#0869d7;
  box-shadow:0 8px 24px rgba(0,110,255,.22)
}
label{display:block;font-size:12px;color:rgba(255,255,255,.82);margin:12px 0 6px}
input,select,textarea{
  width:100%;padding:13px 14px;border:1px solid rgba(255,255,255,.30);
  border-radius:12px;background:rgba(255,255,255,.10);color:#fff;
  outline:none
}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.58)}
input:focus,select:focus,textarea:focus{
  border-color:#69c9ff;box-shadow:0 0 0 3px rgba(48,170,255,.16)
}
select option{color:#17202a;background:#fff}
textarea{min-height:80px;resize:vertical}
.primary{
  width:100%;margin-top:14px;padding:13px;border:1px solid rgba(255,255,255,.35);
  border-radius:12px;background:linear-gradient(135deg,#087cff,#00b8ff);
  color:#fff;font-weight:800;box-shadow:0 10px 28px rgba(0,132,255,.30)
}
.secondary{
  width:100%;margin-top:10px;padding:13px;font-weight:700;
  border:1px solid rgba(255,255,255,.35);border-radius:12px;
  background:rgba(255,255,255,.08);color:#fff
}
.message{margin-top:12px;padding:11px;border-radius:10px;font-size:12px}
.error{background:rgba(255,70,70,.16);color:#ffd5d5;border:1px solid rgba(255,130,130,.25)}
.success{background:rgba(70,255,160,.14);color:#d8ffeb;border:1px solid rgba(100,255,180,.22)}
.auth-links{text-align:center;margin-top:14px;font-size:12px}.link{border:0;background:none;text-decoration:underline;font-weight:700;color:#8bd6ff}
header{background:#111827;color:#fff;padding:15px;position:sticky;top:0;z-index:5}.bar,nav,main{max-width:1100px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand.small{font-size:22px}.userbox{font-size:12px}.logout{margin-left:8px;background:#273244;color:#fff;border:0;border-radius:8px;padding:8px 10px}nav{display:flex;gap:6px;overflow:auto;margin-top:12px}nav button{border:0;background:#273244;color:#dbe1e8;border-radius:9px;padding:9px 11px;white-space:nowrap}nav button.active{background:#fff;color:#111827}
main{padding:20px 14px 50px}.title{margin-bottom:15px}.title h1{margin:0;font-size:25px}.title p{margin:5px 0;color:#6b7280}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e3e6ea;border-radius:14px;padding:16px;margin-bottom:14px}.big{font-size:22px;font-weight:800;margin-top:6px}.green{color:#13844b}.red{color:#c93636}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:1px solid #d9dde3;background:#fff;border-radius:10px;padding:12px;text-align:left;font-weight:700}.danger{background:#fff0f0;color:#a72828;border-color:#f0cccc}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px 7px;border-bottom:1px solid #eceef1;text-align:left;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef1f5;font-size:11px}.notice{padding:11px;border-radius:10px;background:#eef2ff;color:#273244;font-size:13px;margin-bottom:14px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.userbox{font-size:10px}}
</style>
</head>
<body>

<div id="auth" class="auth"><div class="login">
<div class="brand">Mav<span>Rent</span></div><div class="muted">Rental management platform</div>
<div class="role"><button id="landlordRole" class="sel" onclick="chooseRole('landlord')">🏢 Landlord</button><button id="tenantRole" onclick="chooseRole('tenant')">👤 Tenant</button></div>
<form id="loginForm"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"><label>Password</label><input id="password" type="password" required><button class="primary">Login</button></form>
<button class="secondary" onclick="signup()">Create account</button><div class="auth-links"><button class="link" onclick="resetPassword()">Forgot password?</button></div><div id="authMsg" class="message hidden"></div>
</div></div>

<div id="app" class="hidden"><header><div class="bar"><div class="brand small">Mav<span>Rent</span></div><div class="userbox"><span id="who"></span><button class="logout" onclick="logout()">Log out</button></div></div><nav id="nav"></nav></header><main id="main"></main></div>

<script>
const SUPABASE_URL='https://wborvbuqdiscoasnsrwa.supabase.co';
const SUPABASE_KEY='sb_publishable_1mthstK0eNmIFL1PHmBDLg_-5YJYScn';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let role='landlord',user=null,profile=null,appLoading=false,cache={properties:[],units:[],tenants:[],payments:[],maintenance_requests:[],expenses:[],receipts:[]};

const $=id=>document.getElementById(id);
const money=n=>'UGX '+Number(n||0).toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function msg(t,type='error'){const x=$('authMsg');x.textContent=t;x.className='message '+type}
function chooseRole(r){role=r;$('landlordRole').classList.toggle('sel',r==='landlord');$('tenantRole').classList.toggle('sel',r==='tenant')}
async function signup(){
 const email=$('email').value.trim(),password=$('password').value;
 if(!email||password.length<6)return msg('Enter an email and a password of at least 6 characters.');
 msg('Creating account...','success');
 const {data,error}=await sb.auth.signUp({email,password,options:{data:{role,full_name:'',phone:''}}});
 if(error)return msg(error.message);
 if(data.session){user=data.user;await loadApp()}else msg('Account created. Check your email, confirm it, then log in.','success');
}
async function resetPassword(){
 const email=$('email').value.trim();if(!email)return msg('Enter your email first.');
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
 if(error)return msg(error.message);msg('Password reset email sent. Check your inbox.','success');
}
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('Logging in...','success');const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message);user=data.user;await loadApp()};
async function loadApp(){
 if(!user||appLoading)return;
 appLoading=true;
 const p=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
 if(p.error)return msg(p.error.message);
 profile=p.data;
 role=profile?.role||user.user_metadata?.role||role;
 $('auth').classList.add('hidden');$('app').classList.remove('hidden');await refresh();buildNav();show(role==='landlord'?'dashboard':'home');appLoading=false;
}
async function logout(){await sb.auth.signOut();user=null;profile=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('loginForm').reset()}
async function refresh(){
 if(!user)return;
 cache={properties:[],units:[],tenants:[],payments:[],maintenance_requests:[],expenses:[],receipts:[]};

 if(role==='landlord'){
   const p=await sb.from('properties').select('*').eq('landlord_id',user.id).order('created_at',{ascending:false});
   if(p.error)return showDbError('properties',p.error);
   cache.properties=p.data||[];

   const propertyIds=cache.properties.map(x=>x.id);
   if(propertyIds.length){
     const u=await sb.from('units').select('*').in('property_id',propertyIds).order('created_at',{ascending:false});
     if(u.error)return showDbError('units',u.error);
     cache.units=u.data||[];
   }

   for(const [table,column] of [
     ['tenants','landlord_id'],
     ['payments','landlord_id'],
     ['maintenance_requests','landlord_id'],
     ['expenses','landlord_id'],
     ['receipts','landlord_id']
   ]){
     let r=await sb.from(table).select('*').eq(column,user.id).order('created_at',{ascending:false});
     if(r.error)r=await sb.from(table).select('*').eq(column,user.id);
     if(r.error)return showDbError(table,r.error);
     cache[table]=r.data||[];
   }
 }else{
   const t=await sb.from('tenants').select('*').eq('profile_id',user.id);
   if(t.error)return showDbError('tenants',t.error);
   cache.tenants=t.data||[];

   const tenantIds=cache.tenants.map(x=>x.id);
   const unitIds=[...new Set(cache.tenants.map(x=>x.unit_id).filter(Boolean))];

   if(unitIds.length){
     const u=await sb.from('units').select('*').in('id',unitIds);
     if(u.error)return showDbError('units',u.error);
     cache.units=u.data||[];

     const propertyIds=[...new Set(cache.units.map(x=>x.property_id).filter(Boolean))];
     if(propertyIds.length){
       const p=await sb.from('properties').select('*').in('id',propertyIds);
       if(p.error)return showDbError('properties',p.error);
       cache.properties=p.data||[];
     }
   }

   if(tenantIds.length){
     const payment=await sb.from('payments').select('*').in('tenant_id',tenantIds);
     if(payment.error)return showDbError('payments',payment.error);
     cache.payments=payment.data||[];

     const maint=await sb.from('maintenance_requests').select('*').in('tenant_id',tenantIds);
     if(maint.error)return showDbError('maintenance_requests',maint.error);
     cache.maintenance_requests=maint.data||[];

     const receipts=await sb.from('receipts').select('*').in('tenant_id',tenantIds);
     if(receipts.error)return showDbError('receipts',receipts.error);
     cache.receipts=receipts.data||[];
   }
 }
}
function showDbError(table,error){
 console.error('MavRent database error:',table,error);
 const text=error?.message||String(error);
 if($('main')){
   $('main').insertAdjacentHTML('afterbegin',`<div class="notice" style="background:#fff0f0;color:#8f2222">Database error in <b>${esc(table)}</b>: ${esc(text)}</div>`);
 }else{
   msg(`Database error in ${table}: ${text}`);
 }
}
function buildNav(){
 $('who').textContent=(role==='landlord'?'Landlord: ':'Tenant: ')+(user?.email||'');
 $('nav').innerHTML=role==='landlord'?`
 <button data-p="dashboard">🏠 Dashboard</button><button data-p="properties">🏘️ Properties</button><button data-p="units">🚪 Units</button><button data-p="tenants">👥 Tenants</button><button data-p="payments">💰 Payments</button><button data-p="maintenance">🔧 Maintenance</button><button data-p="expenses">🧾 Expenses</button><button data-p="receipts">🧾 Receipts</button><button data-p="reports">📊 Reports</button>`
 :`<button data-p="home">🏠 My Home</button><button data-p="myPayments">💰 My Payments</button><button data-p="myMaintenance">🔧 Maintenance</button><button data-p="myReceipts">🧾 My Receipts</button><button data-p="myProfile">👤 My Profile</button>`;
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));
}
async function show(id){await refresh();$('main').innerHTML=role==='landlord'?landlord(id):tenant(id);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===id));attach();window.scrollTo(0,0)}
function cardStats(){
 const collected=cache.payments.reduce((a,x)=>a+ +x.amount,0),expenses=cache.expenses.reduce((a,x)=>a+ +x.amount,0);
 const scheduled=cache.tenants.reduce((a,x)=>a+ +x.rent_amount,0),occupied=cache.units.filter(x=>x.status==='occupied').length;
 return `<div class="stats"><div class="card"><div class="label">Properties</div><div class="big">${cache.properties.length}</div></div><div class="card"><div class="label">Units</div><div class="big">${cache.units.length}</div></div><div class="card"><div class="label">Collected</div><div class="big green">${money(collected)}</div></div><div class="card"><div class="label">Expenses</div><div class="big red">${money(expenses)}</div></div></div><div class="notice">Occupancy: ${cache.units.length?Math.round(occupied/cache.units.length*100):0}% · Scheduled rent: ${money(scheduled)}</div>`;
}
function landlord(id){
 if(id==='dashboard')return `<section><div class="title"><h1>Landlord Dashboard</h1><p>Manage your complete rental business.</p></div>${cardStats()}<div class="grid"><div class="card"><h3>Quick actions</h3><div class="actions"><button class="btn" onclick="show('properties')">＋ Property</button><button class="btn" onclick="show('units')">＋ Unit</button><button class="btn" onclick="show('tenants')">＋ Tenant assignment</button><button class="btn" onclick="show('payments')">＋ Payment</button><button class="btn" onclick="show('maintenance')">🔧 Maintenance</button><button class="btn" onclick="show('expenses')">🧾 Expense</button></div></div><div class="card"><h3>Account</h3><p>${esc(user.email)}</p><p class="label">Role: Landlord</p></div></div></section>`;
 if(id==='properties')return page('Properties','Create and manage rental properties.',`<form id="propertyForm" class="formgrid"><input id="pname" placeholder="Property name" required><input id="ploc" placeholder="Location"><textarea id="pdesc" class="full" placeholder="Description"></textarea><button class="primary full">Save property</button></form>`,table(['Name','Location','Description',''],cache.properties,x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.location)}</td><td>${esc(x.description)}</td><td><button class="btn danger" onclick="del('properties','${x.id}','properties')">Delete</button></td></tr>`));
 if(id==='units')return page('Units','Every unit belongs to one of your properties.',`<form id="unitForm" class="formgrid"><select id="uproperty" required>${cache.properties.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input id="unum" placeholder="Unit number" required><input id="urent" type="number" placeholder="Monthly rent" required><input id="udep" type="number" placeholder="Deposit"><select id="ustatus"><option value="vacant">Vacant</option><option value="occupied">Occupied</option><option value="maintenance">Maintenance</option></select><button class="primary full">Save unit</button></form>`,table(['Unit','Property','Rent','Deposit','Status',''],cache.units,x=>`<tr><td>${esc(x.unit_number)}</td><td>${esc(cache.properties.find(p=>p.id===x.property_id)?.name||'')}</td><td>${money(x.monthly_rent)}</td><td>${money(x.deposit_amount)}</td><td>${esc(x.status)}</td><td><button class="btn danger" onclick="del('units','${x.id}','units')">Delete</button></td></tr>`));
 if(id==='tenants')return page('Tenants','Assign an existing registered account to a unit. The tenant must first create a MavRent account.',`<form id="tenantForm" class="formgrid"><input id="tprofile" placeholder="Tenant profile UUID" required><select id="tunit" required>${cache.units.map(x=>`<option value="${x.id}">${esc(x.unit_number)} — ${money(x.monthly_rent)}</option>`).join('')}</select><input id="trent" type="number" placeholder="Rent amount" required><input id="tdeposit" type="number" placeholder="Deposit"><input id="tdue" type="number" min="1" max="28" value="1" placeholder="Due day"><input id="tmove" type="date"><button class="primary full">Assign tenant</button></form>`,table(['Tenant ID','Unit','Rent','Due day','Status',''],cache.tenants,x=>`<tr><td>${esc(x.profile_id)}</td><td>${esc(cache.units.find(u=>u.id===x.unit_id)?.unit_number||'')}</td><td>${money(x.rent_amount)}</td><td>${x.rent_due_day}</td><td>${x.status}</td><td><button class="btn danger" onclick="del('tenants','${x.id}','tenants')">Delete</button></td></tr>`));
 if(id==='payments')return page('Payments','Record rent received.',`<form id="paymentForm" class="formgrid"><select id="ptenant" required>${cache.tenants.map(t=>`<option value="${t.id}">${esc(t.profile_id)} — ${esc(cache.units.find(u=>u.id===t.unit_id)?.unit_number||'')}</option>`).join('')}</select><input id="pamount" type="number" min="1" placeholder="Amount (UGX)" required><input id="pdate" type="date" value="${new Date().toISOString().slice(0,10)}"><select id="pmethod"><option value="mtn_mobile_money">MTN Mobile Money</option><option value="airtel_money">Airtel Money</option><option value="bank">Bank</option><option value="cash">Cash</option></select><input id="pref" placeholder="Transaction reference"><textarea id="pnotes" class="full" placeholder="Notes"></textarea><button class="primary full">Save payment</button></form>`,table(['Date','Tenant','Amount','Method','Reference'],cache.payments,x=>`<tr><td>${x.payment_date}</td><td>${esc(x.tenant_id)}</td><td>${money(x.amount)}</td><td>${esc(x.payment_method)}</td><td>${esc(x.transaction_reference)}</td></tr>`));
 if(id==='maintenance')return page('Maintenance','Track repairs and tenant requests.',`<form id="maintForm" class="formgrid"><select id="mtenant" required>${cache.tenants.map(t=>`<option value="${t.id}">${esc(t.profile_id)}</option>`).join('')}</select><select id="munit" required>${cache.units.map(u=>`<option value="${u.id}">${esc(u.unit_number)}</option>`).join('')}</select><input id="mtitle" placeholder="Problem title" required><input id="mcost" type="number" placeholder="Repair cost"><textarea id="mdesc" class="full" placeholder="Description"></textarea><select id="mstatus"><option value="pending">Pending</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><input id="mnotes" placeholder="Landlord notes"><button class="primary full">Save request</button></form>`,table(['Title','Unit','Status','Cost','Date'],cache.maintenance_requests,x=>`<tr><td>${esc(x.title)}</td><td>${esc(cache.units.find(u=>u.id===x.unit_id)?.unit_number||'')}</td><td>${esc(x.status)}</td><td>${money(x.repair_cost)}</td><td>${new Date(x.created_at).toLocaleDateString()}</td></tr>`));
 if(id==='expenses')return page('Expenses','Record property and business expenses.',`<form id="expenseForm" class="formgrid"><select id="eprop"><option value="">No property</option>${cache.properties.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><select id="eunit"><option value="">No unit</option>${cache.units.map(x=>`<option value="${x.id}">${esc(x.unit_number)}</option>`).join('')}</select><input id="eamount" type="number" min="0" placeholder="Amount" required><input id="ecat" placeholder="Category" required><input id="edate" type="date" value="${new Date().toISOString().slice(0,10)}"><textarea id="edesc" class="full" placeholder="Description"></textarea><button class="primary full">Save expense</button></form>`,table(['Date','Category','Amount','Description'],cache.expenses,x=>`<tr><td>${x.expense_date}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.description)}</td></tr>`));
 if(id==='receipts')return page('Receipts','Create and view payment receipts.',`<form id="receiptForm" class="formgrid"><select id="rpayment" required>${cache.payments.map(p=>`<option value="${p.id}">${p.payment_date} — ${money(p.amount)}</option>`).join('')}</select><input id="rnumber" placeholder="Receipt number" required><button class="primary full">Issue receipt</button></form>`,table(['Receipt number','Payment','Issued'],cache.receipts,x=>`<tr><td>${esc(x.receipt_number)}</td><td>${esc(x.payment_id)}</td><td>${new Date(x.issued_at).toLocaleString()}</td></tr>`));
 const scheduled=cache.tenants.reduce((a,x)=>a+ +x.rent_amount,0),collected=cache.payments.reduce((a,x)=>a+ +x.amount,0),expenses=cache.expenses.reduce((a,x)=>a+ +x.amount,0);
 return `<section><div class="title"><h1>Reports</h1><p>Private financial overview.</p></div><div class="stats"><div class="card"><div class="label">Scheduled rent</div><div class="big">${money(scheduled)}</div></div><div class="card"><div class="label">Collected</div><div class="big green">${money(collected)}</div></div><div class="card"><div class="label">Outstanding</div><div class="big red">${money(Math.max(0,scheduled-collected))}</div></div><div class="card"><div class="label">Net before other costs</div><div class="big">${money(collected-expenses)}</div></div></div></section>`;
}
function page(title,sub,form,tbl){return `<section><div class="title"><h1>${title}</h1><p>${sub}</p></div><div class="card"><h3>Add / Save</h3>${form}</div><div class="card"><h3>Records</h3>${tbl}</div></section>`}
function table(head,rows,fn){return `<div class="tablewrap"><table class="table"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(fn).join('')||`<tr><td colspan="${head.length}">No records yet.</td></tr>`}</table></div>`}
function tenant(id){
 const t=cache.tenants[0];
 if(id==='home'){
   const unit=t?cache.units.find(u=>u.id===t.unit_id):null;
   const property=unit?cache.properties.find(p=>p.id===unit.property_id):null;
   return `<section><div class="title"><h1>My Home 👋</h1><p>Your private tenancy information.</p></div>
   <div class="notice">🔒 Other tenants and landlord financial information are hidden.</div>
   ${t?`<div class="stats">
   <div class="card"><div class="label">Property</div><div class="big">${esc(property?.name||'—')}</div></div>
   <div class="card"><div class="label">Unit</div><div class="big">${esc(unit?.unit_number||'—')}</div></div>
   <div class="card"><div class="label">Monthly rent</div><div class="big">${money(t.rent_amount)}</div></div>
   <div class="card"><div class="label">Due day</div><div class="big">${t.rent_due_day}</div></div></div>
   <div class="card"><p><b>Tenancy status:</b> <span class="badge">${esc(t.status)}</span></p>
   <p><b>Move-in:</b> ${esc(t.move_in_date||'Not set')}</p></div>`
   :'<div class="card">Your landlord has not assigned a unit to your account yet.</div>'}</section>`;
 }
 if(id==='myPayments')return page('My Payments','Your own payment history.','',
   table(['Date','Amount','Method','Reference'],cache.payments.filter(p=>p.tenant_id===t?.id),
   x=>`<tr><td>${esc(x.payment_date)}</td><td>${money(x.amount)}</td><td>${esc(x.payment_method)}</td><td>${esc(x.transaction_reference||'—')}</td></tr>`));
 if(id==='myMaintenance')return page('Report a Problem','Send a maintenance request to your landlord.',
   `<form id="tenantMaintForm" class="formgrid"><input id="ttitle" placeholder="Problem title" required><textarea id="tdesc" class="full" placeholder="Describe the problem" required><\/textarea><button class="primary full">Submit request</button></form>`,
   table(['Title','Status','Date'],cache.maintenance_requests.filter(m=>m.tenant_id===t?.id),
   x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.status)}</td><td>${x.created_at?new Date(x.created_at).toLocaleDateString():'—'}</td></tr>`));
 if(id==='myReceipts')return page('My Receipts','Receipts issued for your payments.','',
   table(['Receipt number','Payment','Issued'],cache.receipts.filter(r=>r.tenant_id===t?.id),
   x=>`<tr><td>${esc(x.receipt_number)}</td><td>${money(cache.payments.find(p=>p.id===x.payment_id)?.amount||0)}</td><td>${x.issued_at?new Date(x.issued_at).toLocaleString():'—'}</td></tr>`));
 return `<section><div class="title"><h1>My Profile</h1><p>Your account information.</p></div><div class="card">
 <p><b>Email:</b> ${esc(user.email)}</p><p><b>Role:</b> Tenant</p><p><b>Profile ID:</b> ${esc(user.id)}</p>
 <p class="label">Give your Profile ID to your landlord so they can assign your tenant account.</p></div></section>`;
}
function attach(){
 let f=$('propertyForm');if(f)f.onsubmit=async e=>{e.preventDefault();const r=await sb.from('properties').insert({landlord_id:user.id,name:$('pname').value,location:$('ploc').value,description:$('pdesc').value});if(r.error)return alert(r.error.message);show('properties')};
 f=$('unitForm');if(f)f.onsubmit=async e=>{e.preventDefault();const r=await sb.from('units').insert({property_id:$('uproperty').value,unit_number:$('unum').value,monthly_rent:+$('urent').value,deposit_amount:+$('udep').value||0,status:$('ustatus').value});if(r.error)return alert(r.error.message);show('units')};
 f=$('tenantForm');if(f)f.onsubmit=async e=>{e.preventDefault();const unit=cache.units.find(x=>x.id===$('tunit').value);const r=await sb.from('tenants').insert({profile_id:$('tprofile').value.trim(),unit_id:$('tunit').value,landlord_id:user.id,rent_amount:+$('trent').value,deposit_amount:+$('tdeposit').value||0,rent_due_day:+$('tdue').value,move_in_date:$('tmove').value||null,status:'active'});if(r.error)return alert(r.error.message);if(unit)await sb.from('units').update({status:'occupied'}).eq('id',unit.id);show('tenants')};
 f=$('paymentForm');if(f)f.onsubmit=async e=>{e.preventDefault();const r=await sb.from('payments').insert({tenant_id:$('ptenant').value,landlord_id:user.id,amount:+$('pamount').value,payment_date:$('pdate').value,payment_method:$('pmethod').value,transaction_reference:$('pref').value||null,notes:$('pnotes').value||null});if(r.error)return alert(r.error.message);show('payments')};
 f=$('maintForm');if(f)f.onsubmit=async e=>{e.preventDefault();const r=await sb.from('maintenance_requests').insert({tenant_id:$('mtenant').value,landlord_id:user.id,unit_id:$('munit').value,title:$('mtitle').value,description:$('mdesc').value,status:$('mstatus').value,repair_cost:+$('mcost').value||0,landlord_notes:$('mnotes').value||null});if(r.error)return alert(r.error.message);show('maintenance')};
 f=$('expenseForm');if(f)f.onsubmit=async e=>{e.preventDefault();const r=await sb.from('expenses').insert({landlord_id:user.id,property_id:$('eprop').value||null,unit_id:$('eunit').value||null,amount:+$('eamount').value,category:$('ecat').value,description:$('edesc').value,expense_date:$('edate').value});if(r.error)return alert(r.error.message);show('expenses')};
 f=$('receiptForm');if(f)f.onsubmit=async e=>{e.preventDefault();const p=cache.payments.find(x=>x.id===$('rpayment').value);if(!p)return alert('Select a payment.');const r=await sb.from('receipts').insert({payment_id:p.id,tenant_id:p.tenant_id,landlord_id:user.id,receipt_number:$('rnumber').value.trim()});if(r.error)return alert(r.error.message);show('receipts')};
 f=$('tenantMaintForm');if(f)f.onsubmit=async e=>{e.preventDefault();if(!tSafe())return;const t=cache.tenants[0];const r=await sb.from('maintenance_requests').insert({tenant_id:t.id,landlord_id:t.landlord_id,unit_id:t.unit_id,title:$('ttitle').value,description:$('tdesc').value,status:'pending',repair_cost:0});if(r.error)return alert(r.error.message);show('myMaintenance')};
}
function tSafe(){return cache.tenants.length>0}
async function del(table,id,page){if(!confirm('Delete this record?'))return;const r=await sb.from(table).delete().eq('id',id);if(r.error)return alert(r.error.message);show(page)}
sb.auth.onAuthStateChange((event,session)=>{if(session&&!user){user=session.user;loadApp()}});
(async()=>{const {data}=await sb.auth.getSession();if(data.session){user=data.session.user;await loadApp()}})();
</script>
</body>
</html>
