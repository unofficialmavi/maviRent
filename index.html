/* =====================================================
   STARTUP SAFETY
   Never allow the loading screen to trap the user if a
   network library or later feature fails to initialize.
===================================================== */
window.addEventListener('load',()=>{
  const loader=document.getElementById('mavLoading');
  if(loader){
    setTimeout(()=>loader.classList.add('hide'),700);
  }
});

/* =====================================================
   PWA SERVICE WORKER
===================================================== */

if(
'serviceWorker' in navigator
){

window.addEventListener(
'load',
()=>{

navigator.serviceWorker
.register('./sw.js')
.then(
registration=>{
console.log(
'MavRent service worker registered:',
registration.scope
);
}
)
.catch(
error=>{
console.error(
'MavRent service worker registration failed:',
error
);
}
);

}
);

}

new Date().toISOString().slice(0,10);

const esc=s =>
String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

function shortId(id){
return id
?'MVR-'+String(id)
.replace(/-/g,'')
.slice(0,8)
.toUpperCase()
:'—';

function monthLabel(date){

if(!date)return '—';

let d=new Date(
date+'T00:00:00'
);

return d.toLocaleDateString(
'en-US',
{
month:'long',
year:'numeric'
}
);

}

function monthStart(date){

let d=new Date(
date+'T00:00:00'
);

return new Date(
d.getFullYear(),
d.getMonth(),
1
)
.toISOString()
.slice(0,10);

}

function addMonths(date,n){

let d=new Date(
date+'T00:00:00'
);

d.setMonth(
d.getMonth()+n
);

return new Date(
d.getFullYear(),
d.getMonth(),
1
)
.toISOString()
.slice(0,10);

}

function rentBalance(r){

return Math.max(
0,
Number(r.amount_due||0)-
Number(r.amount_paid||0)
);

}

function rentStatusClass(status){

return String(
status||'pending'
)
.toLowerCase()

/* =====================================================
   BACKGROUND RENT SCHEDULE MAINTENANCE
   Runs after the UI is ready so it does not freeze login.
===================================================== */
let scheduleMaintenanceRunning=false;
async function ensureRentSchedules(){
  if(scheduleMaintenanceRunning||!user||role!=='landlord'||!navigator.onLine)return;
  scheduleMaintenanceRunning=true;
  try{
    for(const t of cache.tenants){
      const rows=rentRecordsForTenant(t.id);
      if(!rows.length){await generateRentForTenant(t.id,12);continue;}
      const last=rows.slice().sort((a,b)=>String(b.period_month).localeCompare(String(a.period_month)))[0];
      const monthsAhead=Math.round((new Date(last.period_month+'T00:00:00')-new Date(monthStart(today())+'T00:00:00'))/(30.44*86400000));
      if(monthsAhead<6)await generateRentForTenant(t.id,12);
    }
    await loadNotifications();
  }catch(e){console.warn('Background rent schedule update:',e)}
  finally{scheduleMaintenanceRunning=false;}
}

return;

loading=true;

await loadProfile();

profile?.role||
user.user_metadata?.role||
role;

!['landlord','tenant']

)
role='tenant';

'hidden'

);

await loadNotifications();

:'home',

startRealtime();

loading=false;

// Prepare missing rent months after the first screen is visible.
setTimeout(()=>ensureRentSchedules(),250);
setTimeout(()=>requestRentNotifications(),900);

}

);

/* RENT RECORDS */

r=

.from('rent_records')

r.error
);

r.data||[];


/* TENANT */

}else{

await sb

.select('*')
.eq(
'profile_id',
user.id
)

'status',
'active'
);

if(r.error)
return dbErr(
'tenants',
r.error
);

cache.tenants=

let uids=
cache.tenants

x=>x.unit_id
)

if(uids.length){

r=
await sb
.from('units')
.select('*')
.in(
'id',
uids
);

if(r.error)
return dbErr(
'units',
r.error
);

cache.units=
r.data||[];


let pids=
cache.units
.map(
x=>x.property_id
)
.filter(Boolean);

if(pids.length){

r=
await sb
.from('properties')
.select('*')
.in(
'id',
pids
);

if(r.error)
return dbErr(

r.error
);

cache.properties=
r.data||[];

}

}


let tids=
cache.tenants.map(
x=>x.id
);

if(tids.length){

for(
let t of [
'payments',
'maintenance_requests',

]
){

await sb
.from(t)

{ascending:false}

function tenantName(t){
  const p=cache.registeredTenants.find(x=>x.id===t?.profile_id);
  return p?.full_name||p?.email||'Tenant';
}

function unitForTenant(t){return cache.units.find(u=>u.id===t?.unit_id);}
function propertyForUnit(u){return cache.properties.find(p=>p.id===u?.property_id);}

function localDate(d){
  const x=new Date(d+'T00:00:00');
  return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

function dueDateFor(period,day){
  const d=new Date(period+'T00:00:00');
  const y=d.getFullYear(),m=d.getMonth();
  const last=new Date(y,m+1,0).getDate();
  const safe=Math.min(Math.max(Number(day||1),1),last);
  return new Date(y,m,safe).toISOString().slice(0,10);
}

function rentComputedStatus(r,now=today()){
  const due=Number(r.amount_due||0), paid=Number(r.amount_paid||0), bal=Math.max(0,due-paid);
  if(bal<=0 && due>0)return 'paid';
  if(paid>0 && bal>0)return new Date((r.due_date||now)+'T23:59:59')<new Date(now+'T00:00:00')?'overdue':'partial';
  if(r.due_date && r.due_date<now)return 'overdue';
  return 'pending';
}

function rentSort(a,b){return String(a.period_month).localeCompare(String(b.period_month));}

function rentRecordsForTenant(tenantId){
  return cache.rent_records.filter(r=>r.tenant_id===tenantId).sort(rentSort);
}

function outstandingRecords(tenantId){
  return rentRecordsForTenant(tenantId).filter(r=>rentBalance(r)>0);
}

function nextDueRecord(tenantId){
  return outstandingRecords(tenantId).slice().sort((a,b)=>String(a.due_date||a.period_month).localeCompare(String(b.due_date||b.period_month)))[0] || null;
}

function firstUnpaidRecord(tenantId){
  return rentRecordsForTenant(tenantId).find(r=>rentBalance(r)>0);
}

function daysUntil(date){
  if(!date)return null;
  return Math.round((new Date(date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
}

function reminderForRecord(r, prefix='Rent'){
  if(!r || rentBalance(r)<=0)return null;
  const d=daysUntil(r.due_date);
  const month=monthLabel(r.period_month);
  const bal=money(rentBalance(r));
  if(d<0)return {type:'danger',title:`${prefix} overdue`,text:`${month} still has ${bal} unpaid. It was due ${localDate(r.due_date)}. Pay the oldest unpaid month before moving to the next.`};
  if(d===0)return {type:'danger',title:`${prefix} due today`,text:`${month} has ${bal} remaining. Payment is due today.`};
  if(d===1)return {type:'warning',title:`${prefix} due tomorrow`,text:`${month} has ${bal} remaining. Your due date is tomorrow, ${localDate(r.due_date)}.`};
  if(d===3)return {type:'warning',title:`${prefix} reminder — 3 days`,text:`${month} has ${bal} remaining. Prepare your payment for ${localDate(r.due_date)}.`};
  if(d===7)return {type:'info',title:`${prefix} reminder — 7 days`,text:`${month} has ${bal} remaining and is due ${localDate(r.due_date)}.`};
  if(d===14)return {type:'info',title:`${prefix} advance reminder — 14 days`,text:`${month} has ${bal} remaining. Your next due date is ${localDate(r.due_date)}.`};
  return null;
}

function reminderItemsForTenant(tenantId){
  const rows=rentRecordsForTenant(tenantId), out=[];
  const first=firstUnpaidRecord(tenantId);
  if(!first)return out;
  const old=reminderForRecord(first,'Previous rent');
  if(old)out.push(old);
  const next=rows.filter(r=>rentBalance(r)>0).sort((a,b)=>String(a.due_date||'9999').localeCompare(String(b.due_date||'9999')))[0];
  if(next && next.id!==first.id){
    const n=reminderForRecord(next,'Next rent');
    if(n && !out.some(x=>x.title===n.title))out.push(n);
  }
  return out;
}

function reminderItemsForLandlord(){
  const out=[];
  cache.tenants.forEach(t=>{
    const first=firstUnpaidRecord(t.id);
    if(!first)return;
    const item=reminderForRecord(first,tenantName(t));
    if(item)out.push(item);
  });
  return out;
}

function reminderHtml(items){
  if(!items.length)return `<div class="alertStrip success"><div class="alertTitle">✓ Rent is up to date</div>No urgent rent reminders right now.</div>`;
  return items.map(x=>`<div class="alertStrip ${x.type}"><div class="alertTitle">${esc(x.title)}</div>${esc(x.text)}</div>`).join('');
}

async function generateRentForTenant(tenantId,months=12){
 const t=cache.tenants.find(x=>x.id===tenantId); if(!t)return {ok:false,error:'Tenant not found'};
 const unit=unitForTenant(t); const monthly=Number(t.rent_amount||unit?.monthly_rent||0); if(monthly<=0)return {ok:false,error:'Tenant has no rent amount'};
 const existing=new Set(rentRecordsForTenant(tenantId).map(r=>String(r.period_month)));
 let base=monthStart(t.move_in_date||today());
 let start=base;
 if(cache.rent_records.length){
   const last=rentRecordsForTenant(tenantId).sort((a,b)=>String(b.period_month).localeCompare(String(a.period_month)))[0];
   if(last)start=addMonths(last.period_month,1);
 }
 const rows=[];
 for(let i=0;i<months;i++){
   const period=addMonths(start,i); if(existing.has(period))continue;
   const due=dueDateFor(period,t.rent_due_day||1);
   rows.push({landlord_id:user.id,tenant_id:tenantId,unit_id:t.unit_id||unit?.id||null,period_month:period,amount_due:monthly,amount_paid:0,due_date:due,status:due<today()?'overdue':'pending'});
 }
 if(!rows.length)return {ok:true,count:0};
 const r=await sb.from('rent_records').insert(rows).select('*');
 if(r.error)return {ok:false,error:r.error};
 cache.rent_records.push(...(r.data||[]));
 return {ok:true,count:(r.data||[]).length};
}

 alert('Payment submitted. The landlord can now confirm it.');
 await refresh(); await show('myRent',false);
}

async function applyPaymentToRent(payment){
 let amount=Number(payment.amount||0); if(amount<=0)return;
 const records=rentRecordsForTenant(payment.tenant_id).filter(r=>rentBalance(r)>0);
 for(const r of records){
   if(amount<=0)break;
   const part=Math.min(amount,rentBalance(r));
   const nr=await sb.from('rent_records').update({amount_paid:Number(r.amount_paid||0)+part,status:rentComputedStatus({...r,amount_paid:Number(r.amount_paid||0)+part})}).eq('id',r.id).select('*').single();
   if(nr.error)throw nr.error;
   Object.assign(r,nr.data); amount-=part;
 }
}

async function confirmPayment(id){
 const p=cache.payments.find(x=>x.id===id); if(!p)return;
 if(p.status==='confirmed')return;
 const up=await sb.from('payments').update({status:'confirmed'}).eq('id',id).select('*').single();
 if(up.error)return alert(up.error.message);
 try{await applyPaymentToRent(up.data);}catch(e){await sb.from('payments').update({status:'pending'}).eq('id',id);return alert('Payment confirmed but rent allocation failed: '+(e.message||e));}
 await refresh(); await show('payments',false);
}

async function rejectPayment(id){
 const r=await sb.from('payments').update({status:'rejected'}).eq('id',id).select('*').single();
 if(r.error)return alert(r.error.message); await refresh(); await show('payments',false);
}

async function assignTenant(e){
 e.preventDefault();
 const profileId=$('tprofile').value,unitId=$('tunit').value,rent=Number($('trent').value||0),deposit=Number($('tdeposit').value||0),due=Number($('tdue').value||1),move=$('tmove').value||today(),advance=Number($('tadvance')?.value||3);

 if(r.error)return alert(r.error.message);
 await sb.from('units').update({status:'occupied'}).eq('id',unitId);
 cache.tenants.push(r.data);

let lastBrowserReminderKey='';
function maybeBrowserRentReminder(){
  if(!('Notification' in window) || Notification.permission!=='granted')return;
  const items=role==='landlord'?reminderItemsForLandlord():reminderItemsForTenant(cache.tenants[0]?.id);
  if(!items.length)return;
  const key=today()+'|'+role+'|'+items.map(x=>x.title).join('|');
  if(key===lastBrowserReminderKey)return;
  lastBrowserReminderKey=key;
  const first=items[0];
  try{new Notification('MavRent — Rent Reminder',{body:first.title+'\n'+first.text,icon:'./icon-180.png',tag:'mavrent-rent-reminder'});}catch(e){console.warn('Browser notification unavailable',e);}
}
function requestRentNotifications(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default')Notification.requestPermission().then(()=>maybeBrowserRentReminder());
  else maybeBrowserRentReminder();
}

async function loadNotifications(){
 const items=role==='landlord'?reminderItemsForLandlord():reminderItemsForTenant(cache.tenants[0]?.id);
 notifications=items;

 const list=$('notificationList');if(list)list.innerHTML=items.length?items.map((x,i)=>`<div class="notificationItem unread"><div class="notificationTitle">${esc(x.title)}</div><div class="notificationMessage">${esc(x.text)}</div><div class="notificationType">Rent reminder</div></div>`).join(''):'<div class="empty">No new rent reminders.</div>'; maybeBrowserRentReminder();
}

async function submitTenantMaintenance(e){
 e.preventDefault();

  const r=await sb.from('maintenance_requests').insert({landlord_id:t.landlord_id||user.id,tenant_id:t.id,title:$('tsubject').value.trim(),subject:$('tsubject').value.trim(),description:$('tdesc').value.trim(),priority:$('tpriority').value,status:'pending',media_url}).select('*').single();if(r.error)throw r.error;
  e.target.reset();alert('Maintenance request submitted.');await refresh();show('myMaintenance',false);
 }catch(err){alert(err.message||err);}finally{if(btn){btn.disabled=false;btn.textContent='Submit request';}}
}

function hideMavLoading(){

  const loader=$('mavLoading');

  if(!loader)return;

  setTimeout(()=>{
    loader.classList.add('hide');
  },500);

}

function updateConnectionStatus(){

  const box=$('connectionStatus');
  const text=$('connectionText');

  if(!box||!text)return;

  if(navigator.onLine){

    box.classList.remove('offline');
    box.classList.add('online');
    text.textContent='Online';

  }else{

    box.classList.remove('online');
    box.classList.add('offline');
    text.textContent='Offline';

  }

}

window.addEventListener(
  'online',
  updateConnectionStatus
);

window.addEventListener(
  'offline',
  updateConnectionStatus
);

updateConnectionStatus();

/* Hide loading screen after app initializes */

/* FAIL-SAFE LOADING SCREEN
   Hide as soon as the document is usable. A hard timeout prevents
   a slow network/service-worker error from ever trapping the app. */
function forceHideMavLoading(){
  const loader=$('mavLoading');
  if(loader) loader.classList.add('hide');
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',()=>{
    setTimeout(forceHideMavLoading,150);
  },{once:true});
}else{
  setTimeout(forceHideMavLoading,150);
}

setTimeout(forceHideMavLoading,3000);

===================================================== */

function previewMaintenanceMedia(){

  const input=$('tmedia');

  if(!input||!input.files.length)return;

  const file=input.files[0];

  let old=$('maintenanceMediaPreview');

  if(old)old.remove();

  const box=document.createElement('div');

  box.id='maintenanceMediaPreview';
  box.className='mediaBox';

  const title=document.createElement('strong');

  title.textContent='Selected attachment';

  box.appendChild(title);

  const br=document.createElement('br');

  box.appendChild(br);

  if(file.type.startsWith('video/')){

    const video=document.createElement('video');

    video.className='mediaPreview';
    video.controls=true;
    video.src=URL.createObjectURL(file);

    box.appendChild(video);

  }else{

    const img=document.createElement('img');

    img.className='mediaPreview';
    img.src=URL.createObjectURL(file);

    box.appendChild(img);

  }

  const info=document.createElement('div');

  info.style.fontSize='11px';
  info.style.marginTop='6px';
  info.style.color='#667085';

  info.textContent=
    file.name+
    ' • '+
    Math.round(file.size/1024/1024*10)/10+
    ' MB';

  box.appendChild(info);

  const form=$('tenantMaintForm');

  if(form)
    form.querySelector(
      '#submitTenantMaintenanceBtn'
    ).before(box);

}

document.addEventListener(
