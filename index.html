<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">

<title>MavRent v5</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#f4f5f7;
color:#17202a;
}

button,input,select,textarea{
font:inherit
}

button{
cursor:pointer
}

.hidden{
display:none!important
}

/* ================= AUTH ================= */

.auth{
min-height:100vh;
display:grid;
place-items:center;
padding:28px 18px;
position:relative;
overflow:hidden;

background:
radial-gradient(circle at 15% 15%,rgba(52,180,255,.30),transparent 30%),
radial-gradient(circle at 85% 20%,rgba(0,98,255,.35),transparent 34%),
radial-gradient(circle at 50% 100%,rgba(0,55,180,.45),transparent 45%),
linear-gradient(135deg,#061b45 0%,#0a4da2 48%,#03163d 100%);
}

.auth:before,
.auth:after{
content:"";
position:absolute;
border-radius:50%;
filter:blur(8px);
pointer-events:none;
}

.auth:before{
width:360px;
height:360px;
background:rgba(31,170,255,.20);
left:-130px;
bottom:-110px;
}

.auth:after{
width:420px;
height:420px;
background:rgba(56,104,255,.18);
right:-160px;
top:-130px;
}

.login{
width:min(450px,100%);
padding:30px;
position:relative;
z-index:1;
color:#fff;

border:1px solid rgba(255,255,255,.28);
border-radius:26px;

background:linear-gradient(
145deg,
rgba(255,255,255,.20),
rgba(255,255,255,.07)
);

backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);

box-shadow:
0 28px 80px rgba(0,0,0,.35),
inset 0 1px 0 rgba(255,255,255,.25);
}

.brand{
font-size:32px;
font-weight:900;
letter-spacing:-1px;
}

.brand span{
color:#67c7ff;
}

.muted,
.label{
color:rgba(255,255,255,.72);
font-size:13px;
}

.role{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin:22px 0;
}

.role button{
padding:13px;
border:1px solid rgba(255,255,255,.24);
background:rgba(255,255,255,.08);
color:#fff;
border-radius:13px;
}

.role .sel{
background:rgba(255,255,255,.88);
color:#0869d7;
}

label{
display:block;
font-size:12px;
color:rgba(255,255,255,.82);
margin:12px 0 6px;
}

.login input,
.login select,
.login textarea{
width:100%;
padding:13px 14px;
border:1px solid rgba(255,255,255,.30);
border-radius:12px;
background:rgba(255,255,255,.10);
color:#fff;
outline:none;
}

.login input::placeholder,
.login textarea::placeholder{
color:rgba(255,255,255,.58);
}

.login select option{
color:#17202a;
background:#fff;
}

textarea{
min-height:80px;
resize:vertical;
}

.primary{
width:100%;
margin-top:14px;
padding:13px;
border:1px solid rgba(255,255,255,.35);
border-radius:12px;
background:linear-gradient(135deg,#087cff,#00b8ff);
color:#fff;
font-weight:800;
box-shadow:0 10px 28px rgba(0,132,255,.30);
}

.secondary{
width:100%;
margin-top:10px;
padding:13px;
font-weight:700;
border:1px solid rgba(255,255,255,.35);
border-radius:12px;
background:rgba(255,255,255,.08);
color:#fff;
}

.message{
margin-top:12px;
padding:11px;
border-radius:10px;
font-size:12px;
}

.error{
background:rgba(255,70,70,.16);
color:#ffd5d5;
}

.success{
background:rgba(70,255,160,.14);
color:#d8ffeb;
}

.auth-links{
text-align:center;
margin-top:14px;
font-size:12px;
}

.link{
border:0;
background:none;
text-decoration:underline;
font-weight:700;
color:#8bd6ff;
}

/* ================= HEADER ================= */

header{
background:#111827;
color:#fff;
padding:15px;
position:sticky;
top:0;
z-index:20;
}

.bar,
nav,
main{
max-width:1100px;
margin:auto;
}

.bar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.brand.small{
font-size:22px;
}

.userbox{
font-size:12px;
display:flex;
align-items:center;
gap:7px;
}

.logout{
margin-left:8px;
background:#273244;
color:#fff;
border:0;
border-radius:8px;
padding:8px 10px;
}

.notifyBtn{
position:relative;
background:#273244;
color:#fff;
border:0;
border-radius:9px;
padding:8px 11px;
font-size:17px;
}

.notifyCount{
position:absolute;
right:-5px;
top:-6px;
background:#ef4444;
color:#fff;
font-size:10px;
font-weight:800;
min-width:18px;
height:18px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
border:2px solid #111827;
}

/* ================= NAV ================= */

nav{
display:flex;
gap:6px;
overflow:auto;
margin-top:12px;
}

nav button{
border:0;
background:#273244;
color:#dbe1e8;
border-radius:9px;
padding:9px 11px;
white-space:nowrap;
}

nav button.active{
background:#fff;
color:#111827;
}

/* ================= MAIN ================= */

main{
padding:20px 14px 50px;
}

.title{
margin-bottom:15px;
}

.title h1{
margin:0;
font-size:25px;
}

.title p{
margin:5px 0;
color:#6b7280;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.card{
background:#fff;
border:1px solid #e3e6ea;
border-radius:14px;
padding:16px;
margin-bottom:14px;
}

.big{
font-size:22px;
font-weight:800;
margin-top:6px;
}

.green{
color:#13844b;
}

.red{
color:#c93636;
}

.orange{
color:#b86b00;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

.btn{
border:1px solid #d9dde3;
background:#fff;
color:#17202a;
border-radius:10px;
padding:12px;
text-align:left;
font-weight:700;
}

.danger{
background:#fff0f0;
color:#a72828;
border-color:#f0cccc;
}

.successBtn{
background:#ecfdf3;
color:#08743f;
border-color:#b7e7ca;
}

.warningBtn{
background:#fff8e6;
color:#966100;
border-color:#f2d79b;
}

.formgrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.full{
grid-column:1/-1;
}

#app input,
#app select,
#app textarea{
width:100%;
padding:13px 14px;
border:1px solid #d9dde3;
border-radius:12px;
background:#fff;
color:#17202a!important;
caret-color:#17202a!important;
outline:none;
}

#app input,
#app textarea,
#app select{
-webkit-text-fill-color:#17202a;
}

#app input::placeholder,
#app textarea::placeholder{
color:#8a929d!important;
opacity:1!important;
}

#app input:focus,
#app select:focus,
#app textarea:focus{
border-color:#087cff;
box-shadow:0 0 0 3px rgba(8,124,255,.12);
}

#app select option{
color:#17202a!important;
background:#fff!important;
}

.tablewrap{
overflow:auto;
}

.table{
width:100%;
border-collapse:collapse;
font-size:13px;
}

.table th,
.table td{
padding:10px 7px;
border-bottom:1px solid #eceef1;
text-align:left;
white-space:nowrap;
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:20px;
background:#eef1f5;
font-size:11px;
}

.badge.pending{
background:#fff4d6;
color:#956300;
}

.badge.confirmed{
background:#dcfce7;
color:#166534;
}

.badge.rejected{
background:#fee2e2;
color:#991b1b;
}

.notice{
padding:11px;
border-radius:10px;
background:#eef2ff;
color:#273244;
font-size:13px;
margin-bottom:14px;
}

.loading{
text-align:center;
padding:40px;
color:#6b7280;
}

/* ================= NOTIFICATIONS ================= */

.notificationPanel{
position:fixed;
right:20px;
top:75px;
width:min(390px,calc(100vw - 30px));
max-height:75vh;
overflow:auto;
background:#fff;
border:1px solid #e2e5e9;
border-radius:16px;
box-shadow:0 20px 60px rgba(0,0,0,.22);
z-index:100;
}

.notificationHead{
padding:15px;
border-bottom:1px solid #eceef1;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
background:#fff;
z-index:2;
}

.notificationHead h3{
margin:0;
}

.notificationItem{
padding:14px;
border-bottom:1px solid #eceef1;
cursor:pointer;
}

.notificationItem:hover{
background:#f8fafc;
}

.notificationItem.unread{
background:#eff6ff;
}

.notificationTitle{
font-weight:800;
font-size:14px;
}

.notificationMessage{
font-size:12px;
color:#5f6875;
margin-top:4px;
line-height:1.45;
}

.notificationDate{
font-size:10px;
color:#9299a3;
margin-top:7px;
}

.empty{
padding:25px;
text-align:center;
color:#737b87;
font-size:13px;
}

/* ================= PAYMENT BOX ================= */

.paymentStatusBox{
border-radius:12px;
padding:12px;
margin-bottom:12px;
background:#f8fafc;
}

.paymentPending{
border-left:4px solid #e5a400;
}

.paymentConfirmed{
border-left:4px solid #16a34a;
}

.paymentRejected{
border-left:4px solid #dc2626;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

.stats{
grid-template-columns:1fr 1fr;
}

.grid,
.formgrid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.title h1{
font-size:22px;
}

.card{
padding:14px;
}

.userbox span{
display:none;
}

.notificationPanel{
right:10px;
top:70px;
}

}
</style>

</head>

<body>

<!-- ======================================================
     LOGIN
======================================================= -->

<div id="auth" class="auth">

<div class="login">

<div class="brand">
Mav<span>Rent</span>
</div>

<div class="muted">
Rental management platform
</div>

<div class="role">

<button
id="landlordRole"
class="sel"
onclick="chooseRole('landlord')">

🏢 Landlord

</button>

<button
id="tenantRole"
onclick="chooseRole('tenant')">

👤 Tenant

</button>

</div>

<form id="loginForm">

<label>Email</label>

<input
id="email"
type="email"
required
placeholder="you@example.com">

<label>Password</label>

<input
id="password"
type="password"
required
placeholder="Enter password">

<button
class="primary"
type="submit">

Login

</button>

</form>

<button
class="secondary"
onclick="signup()">

Create account

</button>

<div class="auth-links">

<button
class="link"
onclick="resetPassword()">

Forgot password?

</button>

</div>

<div
id="authMsg"
class="message hidden">
</div>

</div>

</div>


<!-- ======================================================
     APPLICATION
======================================================= -->

<div id="app" class="hidden">

<header>

<div class="bar">

<div class="brand small">
Mav<span>Rent</span>
</div>

<div class="userbox">

<span id="who"></span>

<button
class="notifyBtn"
onclick="toggleNotifications()"
title="Notifications">

🔔

<span
id="notifyCount"
class="notifyCount hidden">

0

</span>

</button>

<button
class="logout"
onclick="logout()">

Log out

</button>

</div>

</div>

<nav id="nav"></nav>

</header>

<main id="main"></main>

</div>


<!-- ======================================================
     NOTIFICATION PANEL
======================================================= -->

<div
id="notificationPanel"
class="notificationPanel hidden">

<div class="notificationHead">

<h3>🔔 Notifications</h3>

<button
class="btn"
onclick="markAllNotificationsRead()">

Mark all read

</button>

</div>

<div id="notificationList">

<div class="empty">
Loading notifications...
</div>

</div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
'https://wborvbuqdiscoasnsrwa.supabase.co';

const SUPABASE_KEY =
'sb_publishable_1mthstK0eNmIFL1PHmBDLg_-5YJYScn';

const sb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   GLOBAL STATE
========================================================= */

let role='landlord';

let user=null;

let profile=null;

let appLoading=false;

let notifications=[];

let cache={

properties:[],

units:[],

tenants:[],

registeredTenants:[],

payments:[],

maintenance_requests:[],

expenses:[],

receipts:[]

};


/* =========================================================
   HELPERS
========================================================= */

const $=id=>document.getElementById(id);

const money=n=>
'UGX '+Number(n||0).toLocaleString('en-US');

const esc=s=>
String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);


function msg(text,type='error'){

const x=$('authMsg');

x.textContent=text;

x.className='message '+type;

}


/* =========================================================
   ROLE
========================================================= */

function chooseRole(r){

role=r;

$('landlordRole')
.classList
.toggle(
'sel',
r==='landlord'
);

$('tenantRole')
.classList
.toggle(
'sel',
r==='tenant'
);

}


/* =========================================================
   SIGN UP
========================================================= */

async function signup(){

const email=$('email').value.trim();

const password=$('password').value;

if(!email){

return msg(
'Enter your email.'
);

}

if(password.length<6){

return msg(
'Password must be at least 6 characters.'
);

}

msg(
'Creating your MavRent account...',
'success'
);

const {data,error}=await sb.auth.signUp({

email,

password,

options:{
data:{
role:role,
full_name:'',
phone:''
}
}

});

if(error){

return msg(error.message);

}

if(data.session){

user=data.user;

await loadApp();

}else{

msg(
'Account created successfully. Check your email, confirm your account, then log in.',
'success'
);

}

}


/* =========================================================
   RESET PASSWORD
========================================================= */

async function resetPassword(){

const email=$('email').value.trim();

if(!email){

return msg(
'Enter your email first.'
);

}

const {error}=
await sb.auth.resetPasswordForEmail(
email,
{
redirectTo:window.location.origin
}
);

if(error){

return msg(error.message);

}

msg(
'Password reset email sent. Check your inbox.',
'success'
);

}


/* =========================================================
   LOGIN
========================================================= */

$('loginForm').onsubmit=async e=>{

e.preventDefault();

msg(
'Logging in...',
'success'
);

const {
data,
error
}=await sb.auth.signInWithPassword({

email:$('email').value.trim(),

password:$('password').value

});

if(error){

return msg(error.message);

}

user=data.user;

await loadApp();

};


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){

if(!user)return null;

const result=
await sb
.from('profiles')
.select('*')
.eq('id',user.id)
.maybeSingle();

if(result.error){

console.error(
'Profile error:',
result.error
);

return null;

}

return result.data;

}


/* =========================================================
   LOAD APP
========================================================= */

async function loadApp(){

if(!user || appLoading)return;

appLoading=true;

$('authMsg').className=
'message hidden';

profile=await loadProfile();

role=
profile?.role ||
user.user_metadata?.role ||
role;

if(
role!=='landlord' &&
role!=='tenant'
){

role='tenant';

}

$('auth')
.classList
.add('hidden');

$('app')
.classList
.remove('hidden');

$('main').innerHTML=
`
<div class="loading">
Loading your MavRent account...
</div>
`;

await refresh();

buildNav();

await loadNotifications();

show(
role==='landlord'
?'dashboard'
:'home'
);

appLoading=false;

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

await sb.auth.signOut();

user=null;

profile=null;

notifications=[];

$('app')
.classList
.add('hidden');

$('auth')
.classList
.remove('hidden');

$('loginForm').reset();

chooseRole('landlord');

$('notificationPanel')
.classList
.add('hidden');

}


/* =========================================================
   REFRESH
========================================================= */

async function refresh(){

if(!user)return;

cache={

properties:[],

units:[],

tenants:[],

registeredTenants:[],

payments:[],

maintenance_requests:[],

expenses:[],

receipts:[]

};


/* ================= LANDLORD ================= */

if(role==='landlord'){

/* REGISTERED TENANT ACCOUNTS */

const registered=
await sb
.from('profiles')
.select(
'id,full_name,email,role'
)
.eq('role','tenant')
.order(
'created_at',
{ascending:false}
);

if(registered.error){

console.error(
'Registered tenants:',
registered.error
);

}else{

cache.registeredTenants=
registered.data||[];

}


/* PROPERTIES */

const p=
await sb
.from('properties')
.select('*')
.eq(
'landlord_id',
user.id
)
.order(
'created_at',
{ascending:false}
);

if(p.error){

return showDbError(
'properties',
p.error
);

}

cache.properties=p.data||[];


/* UNITS */

const propertyIds=
cache.properties.map(
x=>x.id
);

if(propertyIds.length){

const u=
await sb
.from('units')
.select('*')
.in(
'property_id',
propertyIds
)
.order(
'created_at',
{ascending:false}
);

if(u.error){

return showDbError(
'units',
u.error
);

}

cache.units=u.data||[];

}


/* OTHER TABLES */

for(
const [table,column]
of [

['tenants','landlord_id'],

['payments','landlord_id'],

['maintenance_requests','landlord_id'],

['expenses','landlord_id'],

['receipts','landlord_id']

]){

const r=
await sb
.from(table)
.select('*')
.eq(
column,
user.id
)
.order(
'created_at',
{ascending:false}
);

if(r.error){

return showDbError(
table,
r.error
);

}

cache[table]=
r.data||[];

}

}


/* ================= TENANT ================= */

else{

const t=
await sb
.from('tenants')
.select('*')
.eq(
'profile_id',
user.id
);

if(t.error){

return showDbError(
'tenants',
t.error
);

}

cache.tenants=
t.data||[];


const tenantIds=
cache.tenants.map(
x=>x.id
);

const unitIds=[
...new Set(
cache.tenants
.map(x=>x.unit_id)
.filter(Boolean)
)
];


if(unitIds.length){

const u=
await sb
.from('units')
.select('*')
.in(
'id',
unitIds
);

if(u.error){

return showDbError(
'units',
u.error
);

}

cache.units=
u.data||[];


const propertyIds=[
...new Set(
cache.units
.map(x=>x.property_id)
.filter(Boolean)
)
];


if(propertyIds.length){

const p=
await sb
.from('properties')
.select('*')
.in(
'id',
propertyIds
);

if(p.error){

return showDbError(
'properties',
p.error
);

}

cache.properties=
p.data||[];

}

}


if(tenantIds.length){

const payment=
await sb
.from('payments')
.select('*')
.in(
'tenant_id',
tenantIds
)
.order(
'payment_date',
{ascending:false}
);

if(payment.error){

return showDbError(
'payments',
payment.error
);

}

cache.payments=
payment.data||[];


const maint=
await sb
.from('maintenance_requests')
.select('*')
.in(
'tenant_id',
tenantIds
)
.order(
'created_at',
{ascending:false}
);

if(maint.error){

return showDbError(
'maintenance_requests',
maint.error
);

}

cache.maintenance_requests=
maint.data||[];


const receipts=
await sb
.from('receipts')
.select('*')
.in(
'tenant_id',
tenantIds
)
.order(
'issued_at',
{ascending:false}
);

if(receipts.error){

return showDbError(
'receipts',
receipts.error
);

}

cache.receipts=
receipts.data||[];

}

}

}


/* =========================================================
   DATABASE ERROR
========================================================= */

function showDbError(table,error){

console.error(
'MavRent database error:',
table,
error
);

const text=
error?.message||
String(error);

if($('main')){

$('main').innerHTML=`

<div class="card">

<h2>
Database error
</h2>

<div
class="notice"
style="background:#fff0f0;color:#8f2222">

<b>${esc(table)}</b>

<br><br>

${esc(text)}

</div>

<p>
Check the Supabase table and RLS policy for this section.
</p>

</div>

`;

}

}


/* =========================================================
   NAVIGATION
========================================================= */

function buildNav(){

$('who').textContent=
(
role==='landlord'
?'Landlord: '
:'Tenant: '
)
+

async function loadNotifications(){

if(!user)return;

const r=
await sb
.from('notifications')
.select('*')
.eq(
'user_id',
user.id
)
.order(
'created_at',
{ascending:false}
)
.limit(50);

if(r.error){

console.error(
'Notification error:',
r.error
);

return;

}

notifications=
r.data||[];

updateNotificationCount();

renderNotifications();

}


function updateNotificationCount(){

const unread=
notifications.filter(
n=>!n.is_read
).length;

const count=$('notifyCount');

if(!count)return;

count.textContent=
unread>99
?'99+'
:String(unread);

count.classList.toggle(
'hidden',
unread===0
);

}


function renderNotifications(){

const box=
$('notificationList');

if(!box)return;

if(!notifications.length){

box.innerHTML=
`
<div class="empty">
No notifications yet.
</div>
`;

return;

}

box.innerHTML=
notifications.map(
n=>`

<div
class="notificationItem ${n.is_read?'':'unread'}"
onclick="openNotification('${n.id}','${n.related_id||''}')">

<div class="notificationTitle">

${esc(n.title)}

</div>

<div class="notificationMessage">

${esc(n.message)}

</div>

<div class="notificationDate">

${new Date(n.created_at)
.toLocaleString()}

</div>

</div>

`
).join('');

}


function toggleNotifications(){

const panel=
$('notificationPanel');

panel.classList.toggle(
'hidden'
);

if(
!panel.classList.contains('hidden')
){

loadNotifications();

}

}


async function openNotification(
notificationId,
relatedId
){

await sb
.from('notifications')
.update({
is_read:true
})
.eq(
'id',
notificationId
)
.eq(
'user_id',
user.id
);

await loadNotifications();

const n=
notifications.find(
x=>x.id===notificationId
);

if(!n)return;

if(
n.type==='payment' &&
role==='landlord'
){

$('notificationPanel')
.classList
.add('hidden');

show('payments');

}

if(
n.type==='payment_confirmed' ||
n.type==='payment_rejected'
){

$('notificationPanel')
.classList
.add('hidden');

show('myPayments');

}

if(
n.type==='maintenance'
){

$('notificationPanel')
.classList
.add('hidden');

if(role==='landlord'){
show('maintenance');
}else{
show('myMaintenance');
}

}

if(
n.type==='tenant_assigned'
){

$('notificationPanel')
.classList
.add('hidden');

show('home');

}

if(
n.type==='receipt'
){

$('notificationPanel')
.classList
.add('hidden');

show('myReceipts');

}

}


async function markAllNotificationsRead(){

if(!user)return;

const r=
await sb
.from('notifications')
.update({
is_read:true
})
.eq(
'user_id',
user.id
)
.eq(
'is_read',
false
);

if(r.error){

return alert(
'Could not update notifications: '+
r.error.message
);

}

await loadNotifications();

}

function table(

rows,
fn

return`

<thead>

<tr>

${head.map(
h=>`<th>${h}</th>`
).join('')}

</tr>

</thead>

rows.map(fn).join('')
||
`
<tr>

</tbody>

</table>

</div>

`;

}

/* =========================================================

========================================================= */

async function confirmPayment(id){

if(
!confirm(
'Confirm this rent payment?'
)
)return;

const payment=
cache.payments.find(
p=>p.id===id
);

if(!payment)return;

const r=
await sb
.from('payments')
.update({

status:'confirmed',

confirmed_at:
new Date().toISOString(),

confirmed_by:user.id

})
.eq(
'id',
id
)
.eq(
'landlord_id',
user.id
);

if(r.error){

return alert(
'Payment confirmation error: '+
r.error.message
);

}

alert(
'Payment confirmed successfully.'
);

await loadNotifications();

show('payments');

}


/* =========================================================
   REJECT PAYMENT
========================================================= */

async function rejectPayment(id){

const reason=
prompt(
'Enter the reason for rejecting this payment:'
);

if(reason===null)return;

const cleanReason=
reason.trim();

if(!cleanReason){

return alert(
'Please provide a rejection reason.'
);

}

const r=
await sb
.from('payments')
.update({

status:'rejected',

rejection_reason:
cleanReason,

confirmed_at:
null,

confirmed_by:null

})
.eq(
'id',
id
)
.eq(
'landlord_id',
user.id
);

if(r.error){

return alert(
'Payment rejection error: '+
r.error.message
);

}

alert(
'Payment rejected.'
);

await loadNotifications();

show('payments');

}

/* =========================================================
   REALTIME NOTIFICATIONS
========================================================= */

function startNotificationRealtime(){

if(!user)return;

sb
.channel(
'mavrent-notifications-'+user.id
)
.on(
'postgres_changes',
{
event:'*',
schema:'public',
table:'notifications',
filter:
'user_id=eq.'+
user.id
},
payload=>{

loadNotifications();

}
)
.subscribe();

}


/* =========================================================
   AUTH STATE
========================================================= */

sb.auth.onAuthStateChange(
(event,session)=>{

if(
session &&
!user
){

user=session.user;

loadApp();

}

}
);


/* =========================================================
   START
========================================================= */

(async()=>{

const {
data,
error
}=
await sb.auth.getSession();

if(error){

console.error(error);

return;

}

if(data.session){

user=
data.session.user;

await loadApp();

startNotificationRealtime();

}

})();
