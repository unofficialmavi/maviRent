<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#f4f5f7;
color:#17202a;
-webkit-font-smoothing:antialiased
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.mav-loading{
position:fixed;
inset:0;
z-index:99999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:
radial-gradient(circle at 20% 20%,#34b4ff44,transparent 30%),
linear-gradient(135deg,#061b45,#0869d7 55%,#03163d);
color:#fff;
transition:opacity .35s ease,visibility .35s ease
}

.mav-loading.hide{
opacity:0;
visibility:hidden;
pointer-events:none
}

.mav-loading-logo{
width:82px;
height:82px;
border-radius:24px;
display:grid;
place-items:center;
background:linear-gradient(135deg,#087cff,#00b8ff);
box-shadow:0 20px 50px #0005;
font-size:42px;
font-weight:900
}

.mav-loading-name{
margin-top:18px;
font-size:32px;
font-weight:900
}

.mav-loading-name span{color:#67c7ff}

.mav-loading-text{
margin-top:5px;
color:#ffffffaa;
font-size:13px
}

.mav-loading-status{
margin-top:22px;
font-size:11px;
color:#ffffff99
}

.mav-spinner{
width:25px;
height:25px;
margin-top:18px;
border:3px solid #ffffff40;
border-top-color:#fff;
border-radius:50%;
animation:mavspin .8s linear infinite
}

@keyframes mavspin{
to{transform:rotate(360deg)}
}

.connection-status{

bottom:14px;
z-index:90;

align-items:center;

.connection-dot{

height:8px;

.connection-status.offline{color:#991b1b}

.connection-status.offline .connection-dot{
background:#ef4444

<script>
/* =====================================================
   CONFIGURATION
===================================================== */

const SUPABASE_URL =
'https://wborvbuqdiscoasnsrwa.supabase.co';

const SUPABASE_KEY =
'sb_publishable_1mthstK0eNmIFL1PHmBDLg_-5YJYScn';

const MEDIA_BUCKET =
'maintenance-media';

const sb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   GLOBAL STATE
===================================================== */

let role='landlord';
let user=null;
let profile=null;
let notifications=[];
let channel=null;
let busy=false;
let currentPage='dashboard';

let cache={
properties:[],
units:[],
tenants:[],
registeredTenants:[],
payments:[],
maintenance_requests:[],
expenses:[],
receipts:[],
rent_records:[]
};


/* =====================================================
   HELPERS
===================================================== */

const $=id=>document.getElementById(id);

const money=n =>
'UGX '+Number(n||0).toLocaleString('en-US');

const today=() =>
new Date().toISOString().slice(0,10);

const esc=s =>
String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

function shortId(id){
return id
?'MVR-'+String(id)
.replace(/-/g,'')
.slice(0,8)
.toUpperCase()
:'—';
}

function monthLabel(date){

if(!date)return '—';

return new Date(
date+'T00:00:00'
).toLocaleDateString(
'en-US',
{
month:'long',
year:'numeric'
}
);

}

function monthStart(date){

const d=new Date(
(date||today())+'T00:00:00'
);

return new Date(
d.getFullYear(),
d.getMonth(),
1
)
.toISOString()
.slice(0,10);

}

function addMonths(date,n){

const d=new Date(
(date||today())+'T00:00:00'
);

d.setDate(1);
d.setMonth(d.getMonth()+Number(n));

return d.toISOString().slice(0,10);

}

function rentBalance(r){

return Math.max(
0,
Number(r.amount_due||0)-
Number(r.amount_paid||0)
);

}

function getRentStatus(r){

const due=Number(r.amount_due||0);
const paid=Number(r.amount_paid||0);

if(paid>=due&&due>0)
return 'paid';

if(paid>0&&paid<due)
return 'partial';

const dueDate=r.due_date;

if(
dueDate &&
dueDate<today() &&
paid<due
)
return 'overdue';

return 'pending';
}

function rentStatusClass(status){

return String(
status||'pending'
)
.toLowerCase()
.replace(/\s+/g,'_');

}

function msg(text,type='error'){

const box=$('authMsg');

if(!box)return;

box.textContent=text;
box.className='message '+type;

}

function setLoadingStatus(text){

const x=$('loadingStatus');

if(x)x.textContent=text;

}

function hideLoader(){

const loader=$('mavLoading');

if(!loader)return;

loader.classList.add('hide');

}

function showLoader(){

const loader=$('mavLoading');

if(loader)
loader.classList.remove('hide');

}


/* =====================================================
   CONNECTION
===================================================== */

function updateConnectionStatus(){

const box=$('connectionStatus');
const text=$('connectionText');

if(!box||!text)return;

if(navigator.onLine){

box.classList.remove('offline');
text.textContent='Online';

}else{

box.classList.add('offline');
text.textContent='Offline';

}

}

window.addEventListener(
'online',
updateConnectionStatus
);

window.addEventListener(
'offline',
updateConnectionStatus
);

updateConnectionStatus();


/* =====================================================
   SERVICE WORKER
===================================================== */

/* =====================================================
   REFRESH DATABASE
===================================================== */

async function refresh(){

const fresh={
properties:[],
units:[],
tenants:[],
registeredTenants:[],
payments:[],
maintenance_requests:[],
expenses:[],
receipts:[],
rent_records:[]
};

if(role==='landlord'){

let r=
await sb
.from('profiles')
.select(
'id,full_name,email,phone,role,tenant_code,created_at'
)
.eq('role','tenant')
.order(
'created_at',
{ascending:false}
);

if(r.error)
return dbErr('Tenant profiles',r.error);

fresh.registeredTenants=r.data||[];


r=
await sb
.from('properties')
.select('*')
.eq('landlord_id',user.id)
.order('created_at',{ascending:false});

if(r.error)
return dbErr('Properties',r.error);

fresh.properties=r.data||[];


const propertyIds=
fresh.properties.map(x=>x.id);

if(propertyIds.length){

r=
await sb
.from('units')
.select('*')
.in('property_id',propertyIds);

if(r.error)
return dbErr('Units',r.error);

fresh.units=r.data||[];

}


for(const tableName of [
'tenants',
'payments',
'maintenance_requests',
'expenses',
'receipts'
]){

r=
await sb
.from(tableName)
.select('*')
.eq('landlord_id',user.id);

if(r.error){

if(tableName==='receipts'){

r=
await sb
.from(tableName)
.select('*')
.eq('landlord_id',user.id);

}

if(r.error)
return dbErr(tableName,r.error);

}

fresh[tableName]=r.data||[];

}


r=
await sb
.from('rent_records')
.select('*')
.eq('landlord_id',user.id)
.order(
'period_month',
{ascending:false}
);

if(r.error)
return dbErr('Rent records',r.error);

fresh.rent_records=r.data||[];


}else{

let r=
await sb
.from('tenants')
.select('*')
.eq('profile_id',user.id)
.eq('status','active');

if(r.error)
return dbErr('Tenant account',r.error);

fresh.tenants=r.data||[];


const tenantIds=
fresh.tenants.map(x=>x.id);

const unitIds=
fresh.tenants
.map(x=>x.unit_id)
.filter(Boolean);

if(unitIds.length){

r=
await sb
.from('units')
.select('*')
.in('id',unitIds);

if(r.error)
return dbErr('Units',r.error);

fresh.units=r.data||[];

const propertyIds=
fresh.units
.map(x=>x.property_id)
.filter(Boolean);

if(propertyIds.length){

r=
await sb
.from('properties')
.select('*')
.in('id',propertyIds);

if(r.error)
return dbErr('Properties',r.error);

fresh.properties=r.data||[];

}

}


if(tenantIds.length){

for(const tableName of [
'payments',
'maintenance_requests',
'receipts'
]){

r=
await sb
.from(tableName)
.select('*')
.in('tenant_id',tenantIds);

if(r.error)
return dbErr(tableName,r.error);

fresh[tableName]=r.data||[];

}


r=
await sb
.from('rent_records')
.select('*')
.in('tenant_id',tenantIds)
.order(
'period_month',
{ascending:false}
);

if(r.error)
return dbErr('Rent records',r.error);

fresh.rent_records=r.data||[];

}

}

cache=fresh;


/*
   Automatically make sure the current month exists
   for active tenants.
*/

await ensureCurrentRentRecords();

}


/* =====================================================
   AUTOMATIC RENT GENERATION
===================================================== */

async function ensureCurrentRentRecords(){

if(!user||!cache.tenants.length)
return;

const existing=
cache.rent_records;

for(const tenant of cache.tenants){

const unit=
cache.units.find(
u=>u.id===tenant.unit_id
);

const rentAmount=
Number(
tenant.rent_amount||
unit?.monthly_rent||
0
);

if(!rentAmount)
continue;


/*
   Start from the tenant's move-in month where possible.
*/

const startMonth=
monthStart(
tenant.move_in_date||
tenant.created_at||
today()
);

let month=
startMonth;

const currentMonth=
monthStart(today());

let safety=0;

while(
month<=currentMonth &&
safety<36
){

safety++;

const exists=
existing.some(
r=>
r.tenant_id===tenant.id &&
monthStart(r.period_month)===month
);

if(!exists){

await createRentRecord(
tenant,
unit,
month,
rentAmount
);

}

month=addMonths(month,1);

}

}


/*
   Reload only rent records after generation.
*/

if(role==='landlord'){

const r=
await sb
.from('rent_records')
.select('*')
.eq('landlord_id',user.id)
.order(
'period_month',
{ascending:false}
);

if(!r.error)
cache.rent_records=r.data||[];

}else{

const ids=
cache.tenants.map(x=>x.id);

if(ids.length){

const r=
await sb
.from('rent_records')
.select('*')
.in('tenant_id',ids)
.order(
'period_month',
{ascending:false}
);

if(!r.error)
cache.rent_records=r.data||[];

}

}

}


/* =====================================================
   CREATE RENT RECORD
===================================================== */

async function createRentRecord(
tenant,
unit,
periodMonth,
amount
){

const dueDay=
Math.min(
28,
Math.max(
1,
Number(
tenant.rent_due_day||
5
)
)
);

const d=
new Date(
periodMonth+'T00:00:00'
);

d.setDate(dueDay);

const dueDate=
d.toISOString().slice(0,10);

const payload={
landlord_id:
tenant.landlord_id||
user.id,

tenant_id:
tenant.id,

unit_id:
tenant.unit_id||null,

period_month:
periodMonth,

due_date:
dueDate,

amount_due:
amount,

amount_paid:
0,

status:
'pending'
};

const r=
await sb
.from('rent_records')
.insert(payload);

if(r.error){

/*
   If the record already exists because another
   session created it, do not freeze the application.
*/

if(
!String(r.error.message||'')
.toLowerCase()
.includes('duplicate')
){

console.warn(
'Rent generation:',
r.error.message
);

}

}

}

/* =====================================================
   RENT REMINDERS
===================================================== */

function getPreviousUnpaidRecords(){

const result=[];

for(const tenant of cache.tenants){

const records=
cache.rent_records
.filter(
r=>r.tenant_id===tenant.id
)
.sort(
(a,b)=>
String(a.period_month)
.localeCompare(String(b.period_month))
);

for(let i=0;i<records.length;i++){

const r=records[i];

if(getRentStatus(r)==='paid')
continue;

const next=records[i+1];

if(next){

result.push({
tenant,
record:r,
next
});

}

}

}

return result;

}


function rentReminderSummary(){

const overdue=
cache.rent_records.filter(
r=>getRentStatus(r)==='overdue'
);

const partial=
cache.rent_records.filter(
r=>getRentStatus(r)==='partial'
);

const upcoming=
cache.rent_records.filter(
r=>{
if(!r.due_date)return false;

const diff=
Math.ceil(
(
new Date(r.due_date)-
new Date(today())
)/86400000
);

return diff>=0&&diff<=5;
}
);

return`

<p>
🔴 Overdue:
<b>${overdue.length}</b>
</p>

<p>
🟡 Partial:
<b>${partial.length}</b>
</p>

<p>
🔔 Due within 5 days:
<b>${upcoming.length}</b>
</p>

`;

}

function renderLandlordRentWarnings(){

const warnings=[];

for(const tenant of cache.tenants){

const records=
cache.rent_records
.filter(r=>r.tenant_id===tenant.id)
.sort(
(a,b)=>
String(b.period_month)
.localeCompare(String(a.period_month))
);

if(!records.length)continue;

const latest=records[0];

if(getRentStatus(latest)!=='paid'){

const p=
cache.registeredTenants.find(
x=>x.id===tenant.profile_id
);

warnings.push(`

<div class="card ${
getRentStatus(latest)==='overdue'
?'dangerCard'
:'alertCard'
}">

<h3>
⚠️ ${esc(p?.full_name||'Tenant')}
</h3>

<p>
${monthLabel(latest.period_month)}
has a balance of
<b>${money(rentBalance(latest))}</b>.
</p>

<p>
Do not treat the next month as paid until the previous
balance has been cleared or separately recorded.
</p>

</div>

`);

}

}

return warnings.join('');

}

function renderTenantRentWarnings(records){

const warnings=[];

for(let i=0;i<records.length-1;i++){

const current=records[i];
const previous=records[i+1];

if(
rentBalance(previous)>0 &&
getRentStatus(previous)!=='paid'
){

warnings.push(`

<div class="card dangerCard">

<h3>⚠️ Previous rent still unpaid</h3>

<p>
${esc(monthLabel(previous.period_month))}
has a remaining balance of
<b>${money(rentBalance(previous))}</b>.
</p>

<p>
Please clear the previous balance before considering
the next rental period fully settled.
</p>

</div>

`);

break;

}

}

if(records[0]){

const diff=
Math.ceil(
(
new Date(records[0].due_date)-
new Date(today())
)/86400000
);

if(
diff>=0&&
diff<=5&&
rentBalance(records[0])>0
){

warnings.push(`

<div class="card alertCard">

<h3>🔔 Rent reminder</h3>

<p>
Your next/current rent is due
<b>${esc(records[0].due_date)}</b>.
</p>

<p>
Remaining:
<b>${money(rentBalance(records[0]))}</b>
</p>

</div>

`);

}

}

return warnings.join('');

}

/* =====================================================
   AUTOMATIC REMINDER CHECK
===================================================== */

function checkRentReminders(){

if(!user||!cache.rent_records.length)
return;

const todayDate=
new Date(today());

for(const record of cache.rent_records){

const balance=
rentBalance(record);

if(balance<=0)continue;

if(!record.due_date)continue;

const due=
new Date(record.due_date);

const days=
Math.ceil(
(due-todayDate)/86400000
);

if(days===0){

addLocalNotification(
'Rent due today',
`${monthLabel(record.period_month)} has a balance of ${money(balance)}.`
);

}

if(days===1){

addLocalNotification(
'Rent due tomorrow',
`${monthLabel(record.period_month)} is due tomorrow.`
);

}

if(days===3){

addLocalNotification(
'Rent reminder',
`${monthLabel(record.period_month)} is due in 3 days.`
);

}

if(days<0){

addLocalNotification(
'Overdue rent',
`${monthLabel(record.period_month)} is overdue by ${money(balance)}.`
);

}

}

}

renderPage(currentPage);

}catch(e){

console.warn(
'Realtime refresh:',
e
);

}
}
)
.subscribe();

}


/* =====================================================
   CLOSE NOTIFICATION PANEL
===================================================== */

document.addEventListener(
'click',
e=>{

const panel=
$('notificationPanel');

const button=
e.target.closest('.notifyBtn');

if(
panel &&
!panel.classList.contains('hidden') &&
!panel.contains(e.target) &&
!button
){

panel.classList.add('hidden');

}

});


/* =====================================================
   AUTH STATE
===================================================== */

sb.auth.onAuthStateChange(
async(event,session)=>{

if(
session?.user &&
!user
){

user=session.user;

await loadApp();

}

});


/* =====================================================
   STARTUP
===================================================== */

window.addEventListener(
'load',
async()=>{

/*
   Always remove the loading screen.
   This prevents MavRent being trapped forever
   on the M / MavRent / Online screen.
*/

setTimeout(
hideLoader,
1200
);

try{

setLoadingStatus(
'Checking your account...'
);

const r=
await sb.auth.getSession();

if(r.data.session){

user=r.data.session.user;

await loadApp();

}else{

hideLoader();

}

}catch(error){

console.error(
'Startup error:',
error
);

hideLoader();

}

});


/* =====================================================
   PERIODIC REMINDER CHECK
===================================================== */

setInterval(
()=>{

try{

checkRentReminders();

}catch(e){

console.warn(e);

}

},
60000
);

</script>

</body>
</html>
