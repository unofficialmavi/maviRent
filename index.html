<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MavRent - Property Management</title>
  
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="/icon-180.png" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Global Styles & Variables */
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --drawer-width: 280px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
      -webkit-overflow-scrolling: touch;
    }

    /* Mobile Navigation Header */
    .mobile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
    }

    .app-title {
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--primary);
    }

    /* Off-Canvas Slide-Out Mobile Menu (GPU Accelerated) */
    .mobile-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--drawer-width);
      height: 100vh;
      background-color: var(--card-bg);
      z-index: 1000;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
    }

    .mobile-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .drawer-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .drawer-links {
      display: flex;
      flex-direction: column;
      padding: 12px 0;
    }

    .drawer-links a {
      padding: 14px 20px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      border-left: 4px solid transparent;
      transition: background 0.15s ease;
    }

    .drawer-links a:active, .drawer-links a.active {
      background-color: #eff6ff;
      border-left-color: var(--primary);
      color: var(--primary);
    }

    /* Drawer Overlay Backdrop */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* Lightweight Dashboard Container */
    .dashboard-container {
      padding: 16px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Notification Banner Prompt */
    .notification-banner {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .notification-banner p {
      font-size: 0.9rem;
      color: #1e40af;
    }

    .btn-small {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Top Summary Metrics Cards */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .metric-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      text-align: left;
    }

    .metric-card span {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-card h2 {
      font-size: 1.4rem;
      margin-top: 4px;
      color: var(--text-main);
    }

    /* Recent Activity List */
    .section-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .activity-list {
      list-style: none;
    }

    .activity-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    /* Responsive Desktop Sidebar */
    @media (min-width: 768px) {
      .mobile-header { display: none; }
      .drawer-overlay { display: none !important; }
      
      body {
        display: flex;
      }

      .mobile-drawer {
        position: static;
        transform: translateX(0);
        box-shadow: none;
        border-right: 1px solid var(--border-color);
        height: 100vh;
      }

      .close-btn { display: none; }

      .dashboard-container {
        flex: 1;
        padding: 32px;
      }
    }
  </style>
</head>
<body>

  <header class="mobile-header">
    <button class="icon-btn" onclick="toggleMobileMenu()" aria-label="Open Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <span class="app-title">MavRent</span>
    <div style="width: 24px;"></div>
  </header>

  <aside id="mobile-drawer" class="mobile-drawer">
    <div class="drawer-header">
      <h3>MavRent</h3>
      <button class="close-btn" onclick="toggleMobileMenu()">&times;</button>
    </div>
    <nav class="drawer-links">
      <a href="#dashboard" class="active" onclick="toggleMobileMenu()">Dashboard</a>
      <a href="#properties" onclick="toggleMobileMenu()">Properties</a>
      <a href="#tenants" onclick="toggleMobileMenu()">Tenants</a>
      <a href="#payments" onclick="toggleMobileMenu()">Payments</a>
      <a href="#settings" onclick="toggleMobileMenu()">Settings</a>
    </nav>
  </aside>
  <div id="drawer-overlay" class="drawer-overlay" onclick="toggleMobileMenu()"></div>

  <main class="dashboard-container">
    
    <div id="notif-banner" class="notification-banner" style="display: none;">
      <p>Enable push notifications for payment updates even when the app is closed.</p>
      <button class="btn-small" onclick="enablePushNotifications()">Enable</button>
    </div>

    <section class="metrics-grid">
      <div class="metric-card">
        <span>Collected</span>
        <h2 id="total-collected">UGX 0</h2>
      </div>
      <div class="metric-card">
        <span>Occupied</span>
        <h2 id="occupied-count">0 Units</h2>
      </div>
      <div class="metric-card">
        <span>Pending</span>
        <h2 id="pending-count">0 Payments</h2>
      </div>
    </section>

    <section class="section-card">
      <div class="section-header">
        <h3>Recent Transactions</h3>
      </div>
      <ul class="activity-list" id="activity-list">
        <li class="activity-item">
          <span>Loading activity...</span>
        </li>
      </ul>
    </section>
  </main>

  <script>
    // ------------------------------------------------------------------
    // 1. SUPABASE & CONFIGURATION SETUP
    // ------------------------------------------------------------------
    const SUPABASE_URL = "https://wborvbuqdiscoasnsrwa.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indib3J2YnVxZGlzY29hc25zcndhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NjMxMzcsImV4cCI6MjEwMjEzOTEzN30.T-N8JoZn433WNrV1fBY3wQ_C_7QrCYzzCei_5Q4s3bo";
    const VAPID_PUBLIC_KEY = "BPta9_z15Ou9pn1uxOt-uvH5i8hRPO0ARNUx-tZtWTHe5HWoBYgRbkXGl6CudK-VRz7mNHc7WY5BZPfUWOhko2A";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ------------------------------------------------------------------
    // 2. MOBILE MENU DRAWER TOGGLE
    // ------------------------------------------------------------------
    function toggleMobileMenu() {
      const drawer = document.getElementById('mobile-drawer');
      const overlay = document.getElementById('drawer-overlay');
      drawer.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    // ------------------------------------------------------------------
    // 3. SERVICE WORKER & PUSH NOTIFICATIONS
    // ------------------------------------------------------------------
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    async function initServiceWorker() {
      if ('serviceWorker' in navigator && 'PushManager' in window) {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js');
          console.log('Service Worker registered:', reg);
          
          // Check permission state to show banner if needed
          if (Notification.permission === 'default') {
            document.getElementById('notif-banner').style.display = 'flex';
          }
        } catch (err) {
          console.error('Service Worker registration failed:', err);
        }
      }
    }

    async function enablePushNotifications() {
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          document.getElementById('notif-banner').style.display = 'none';
          
          const reg = await navigator.serviceWorker.ready;
          let sub = await reg.pushManager.getSubscription();

          if (!sub) {
            sub = await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
            });
          }

          // Save subscription to Supabase
          const { data: userData } = await sb.auth.getUser();
          if (userData && userData.user) {
            await sb.from('push_subscriptions').upsert({
              user_id: userData.user.id,
              subscription: sub
            }, { onConflict: 'user_id' });
          }
          alert('Push Notifications enabled successfully!');
        }
      } catch (err) {
        console.error('Error enabling push notifications:', err);
      }
    }

    // ------------------------------------------------------------------
    // 4. INITIALIZATION ON LOAD
    // ------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      initServiceWorker();
    });
  </script>
</body>
</html>
