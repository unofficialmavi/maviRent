<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>MavRent v9</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f4f5f7;
  color:#17202a
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:28px 18px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 15%,rgba(52,180,255,.3),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(0,98,255,.35),transparent 34%),
    radial-gradient(circle at 50% 100%,rgba(0,55,180,.45),transparent 45%),
    linear-gradient(135deg,#061b45,#0a4da2 48%,#03163d)
}

.login{
  width:min(450px,100%);
  padding:30px;
  position:relative;
  z-index:1;
  color:#fff;
  border:1px solid rgba(255,255,255,.28);
  border-radius:26px;
  background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.07));
  backdrop-filter:blur(22px);
  box-shadow:0 28px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)
}

.brand{
  font-size:32px;
  font-weight:900;
  letter-spacing:-1px
}

.brand span{color:#67c7ff}

.muted,.label{
  color:rgba(255,255,255,.72);
  font-size:13px
}

.role{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin:22px 0
}

.role button{
  padding:13px;
  border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.08);
  color:#fff;
  border-radius:13px
}

.role .sel{
  background:rgba(255,255,255,.88);
  color:#0869d7
}

label{
  display:block;
  font-size:12px;
  color:rgba(255,255,255,.82);
  margin:12px 0 6px
}

.login input,
.login select,
.login textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:12px;
  background:rgba(255,255,255,.1);
  color:#fff;
  outline:none
}

.login input::placeholder,
.login textarea::placeholder{
  color:rgba(255,255,255,.58)
}

.login select option{
  color:#17202a;
  background:#fff
}

textarea{
  min-height:80px;
  resize:vertical
}

.primary{
  width:100%;
  margin-top:14px;
  padding:13px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:12px;
  background:linear-gradient(135deg,#087cff,#00b8ff);
  color:#fff;
  font-weight:800;
  box-shadow:0 10px 28px rgba(0,132,255,.3)
}

.secondary{
  width:100%;
  margin-top:10px;
  padding:13px;
  font-weight:700;
  border:1px solid rgba(255,255,255,.35);
  border-radius:12px;
  background:rgba(255,255,255,.08);
  color:#fff
}

.link{
  background:none;
  border:0;
  color:#bfe7ff;
  margin-top:12px;
  text-decoration:underline
}

.message{
  margin-top:12px;
  padding:11px;
  border-radius:10px;
  font-size:12px
}

.error{
  background:rgba(255,70,70,.16);
  color:#ffd5d5
}

.success{
  background:rgba(70,255,160,.14);
  color:#d8ffeb
}

header{
  background:#111827;
  color:#fff;
  padding:15px;
  position:sticky;
  top:0;
  z-index:20
}

.bar,nav,main{
  max-width:1100px;
  margin:auto
}

.bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.brand.small{font-size:22px}

.userbox{
  font-size:12px;
  display:flex;
  align-items:center;
  gap:7px
}

.logout,.notifyBtn{
  background:#273244;
  color:#fff;
  border:0;
  border-radius:9px;
  padding:8px 10px
}

.notifyBtn{
  position:relative;
  font-size:17px
}

.notifyCount{
  position:absolute;
  right:-5px;
  top:-6px;
  background:#ef4444;
  color:#fff;
  font-size:10px;
  font-weight:800;
  min-width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  border:2px solid #111827
}

nav{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-top:12px
}

nav button{
  border:0;
  background:#273244;
  color:#dbe1e8;
  border-radius:9px;
  padding:9px 11px;
  white-space:nowrap
}

nav button.active{
  background:#fff;
  color:#111827
}

main{
  padding:20px 14px 50px
}

.title{
  margin-bottom:15px
}

.title h1{
  margin:0;
  font-size:25px
}

.title p{
  margin:5px 0;
  color:#6b7280
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.card{
  background:#fff;
  border:1px solid #e3e6ea;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px
}

.big{
  font-size:22px;
  font-weight:800;
  margin-top:6px
}

.green{color:#13844b}
.red{color:#c93636}
.orange{color:#b86b00}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}

.btn{
  border:1px solid #d9dde3;
  background:#fff;
  color:#17202a;
  border-radius:10px;
  padding:12px;
  text-align:left;
  font-weight:700
}

.danger{
  background:#fff0f0;
  color:#a72828;
  border-color:#f0cccc
}

.successBtn{
  background:#ecfdf3;
  color:#08743f;
  border-color:#b7e7ca
}

.warningBtn{
  background:#fff8e6;
  color:#966100;
  border-color:#f2d79b
}

.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.full{
  grid-column:1/-1
}

#app input,
#app select,
#app textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #d9dde3;
  border-radius:12px;
  background:#fff;
  color:#17202a!important;
  caret-color:#17202a!important;
  outline:none
}

#app input::placeholder,
#app textarea::placeholder{
  color:#8a929d!important;
  opacity:1!important
}

#app input:focus,
#app select:focus,
#app textarea:focus{
  border-color:#087cff;
  box-shadow:0 0 0 3px rgba(8,124,255,.12)
}

#app select option{
  color:#17202a!important;
  background:#fff!important
}

.tablewrap{
  overflow:auto
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

.table th,
.table td{
  padding:10px 7px;
  border-bottom:1px solid #eceef1;
  text-align:left;
  vertical-align:top;
  white-space:nowrap
}

.table td.wrap{
  white-space:normal;
  min-width:220px
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#eef1f5;
  font-size:11px
}

.badge.pending{
  background:#fff4d6;
  color:#956300
}

.badge.confirmed,
.badge.completed{
  background:#dcfce7;
  color:#166534
}

.badge.rejected,
.badge.cancelled{
  background:#fee2e2;
  color:#991b1b
}

.notice{
  padding:11px;
  border-radius:10px;
  background:#eef2ff;
  color:#273244;
  font-size:13px;
  margin-bottom:14px
}

.loading{
  text-align:center;
  padding:40px;
  color:#6b7280
}

.empty{
  padding:25px;
  text-align:center;
  color:#737b87;
  font-size:13px
}

.notificationPanel{
  position:fixed;
  right:20px;
  top:75px;
  width:min(390px,calc(100vw - 30px));
  max-height:75vh;
  overflow:auto;
  background:#fff;
  border:1px solid #e2e5e9;
  border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.22);
  z-index:100
}

.notificationHead{
  padding:15px;
  border-bottom:1px solid #eceef1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:#fff;
  z-index:2
}

.notificationHead h3{margin:0}

.notificationItem{
  padding:14px;
  border-bottom:1px solid #eceef1;
  cursor:pointer
}

.notificationItem:hover{
  background:#f8fafc
}

.notificationItem.unread{
  background:#eff6ff
}

.notificationTitle{
  font-weight:800;
  font-size:14px
}

.notificationMessage{
  font-size:12px;
  color:#5f6875;
  margin-top:4px;
  line-height:1.45
}

.notificationDate{
  font-size:10px;
  color:#9299a3;
  margin-top:7px
}

.paymentStatusBox{
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  background:#f8fafc
}

.paymentPending{
  border-left:4px solid #e5a400
}

.paymentConfirmed{
  border-left:4px solid #16a34a
}

.paymentRejected{
  border-left:4px solid #dc2626
}

.mediaBox{
  margin-top:8px;
  padding:10px;
  border:1px solid #e5e7eb;
  border-radius:10px;
  background:#f8fafc
}

.mediaPreview{
  display:block;
  max-width:280px;
  max-height:220px;
  border-radius:10px;
  margin-top:8px
}

.mediaInput{
  padding:10px!important
}

.smallText{
  font-size:11px;
  color:#6b7280
}

.code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-weight:800;
  letter-spacing:.5px
}

.profileIdBox{
  font-size:20px;
  text-align:center;
  letter-spacing:1px;
  padding:15px
}

.profileCard{
  display:grid;
  grid-template-columns:80px 1fr;
  gap:15px;
  align-items:center
}

.profileAvatar{
  width:70px;
  height:70px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#087cff,#00b8ff);
  color:#fff;
  font-size:27px;
  font-weight:900
}

.profileDetails p{
  margin:7px 0
}

.maintCard{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  background:#fff
}

.maintTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start
}

.maintMeta{
  font-size:12px;
  color:#667085;
  line-height:1.6
}

.maintActions{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #eef0f3
}

.maintActionsGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.maintAfter{
  margin-top:10px;
  padding:10px;
  border:1px dashed #cbd5e1;
  border-radius:10px;
  background:#f8fafc
}

.statusPill{
  font-weight:800;
  text-transform:capitalize
}

.progressLine{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:10px 0
}

.progressStep{
  padding:5px 9px;
  border-radius:999px;
  background:#eef1f5;
  font-size:11px
}

.progressStep.done{
  background:#dcfce7;
  color:#166534
}

.progressStep.current{
  background:#dbeafe;
  color:#1d4ed8
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr 1fr
  }

  .grid,
  .formgrid{
    grid-template-columns:1fr
  }

  .full{
    grid-column:auto
  }

  .title h1{
    font-size:22px
  }

  .card{
    padding:14px
  }

  .userbox span{
    display:none
  }

  .notificationPanel{
    right:10px;
    top:70px
  }

  .actions{
    grid-template-columns:1fr
  }

  .maintActionsGrid{
    grid-template-columns:1fr
  }

  .maintTop{
    display:block
  }

  .profileCard{
    grid-template-columns:1fr
  }

  .profileAvatar{
    margin:auto
  }
}
</style>
</head>

<body>

<div id="auth" class="auth">

  <div class="login">

    <div class="brand">Mav<span>Rent</span></div>
    <div class="muted">Rental management platform</div>

    <div class="role">
      <button id="landlordRole"
              class="sel"
              type="button"
              onclick="chooseRole('landlord')">
        🏢 Landlord
      </button>

      <button id="tenantRole"
              type="button"
              onclick="chooseRole('tenant')">
        👤 Tenant
      </button>
    </div>

    <form id="loginForm">

      <label>Email</label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        required
        placeholder="you@example.com">

      <label>Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        placeholder="Enter password">

      <button class="primary" type="submit">
        Login
      </button>

    </form>

    <button class="secondary" type="button" onclick="signup()">
      Create account
    </button>

    <button class="link" type="button" onclick="resetPassword()">
      Forgot password?
    </button>

    <div id="authMsg" class="message hidden"></div>

  </div>

</div>


<div id="app" class="hidden">

  <header>

    <div class="bar">

      <div class="brand small">
        Mav<span>Rent</span>
      </div>

      <div class="userbox">

        <span id="who"></span>

        <button
          class="notifyBtn"
          type="button"
          onclick="toggleNotifications()">
          🔔
          <span id="notifyCount" class="notifyCount hidden">0</span>
        </button>

        <button
          class="logout"
          type="button"
          onclick="logout()">
          Log out
        </button>

      </div>

    </div>

    <nav id="nav"></nav>

  </header>

  <main id="main"></main>

</div>


<div id="notificationPanel" class="notificationPanel hidden">

  <div class="notificationHead">

    <h3>🔔 Notifications</h3>

    <button
      class="btn"
      type="button"
      onclick="markAllNotificationsRead()">
      Mark all read
    </button>

  </div>

  <div id="notificationList">
    <div class="empty">Loading notifications...</div>
  </div>

</div>


<script>

const SUPABASE_URL='https://wborvbuqdiscoasnsrwa.supabase.co';

const SUPABASE_KEY='sb_publishable_1mthstK0eNmIFL1PHmBDLg_-5YJYScn';

const MEDIA_BUCKET='maintenance-media';

const sb=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let role='landlord';

let user=null;

let profile=null;

let appLoading=false;

let notifications=[];

let notificationChannel=null;


let cache={
  properties:[],
  units:[],
  tenants:[],
  registeredTenants:[],
  payments:[],
  maintenance_requests:[],
  expenses:[],
  receipts:[]
};


const $=id=>document.getElementById(id);

const money=n=>'UGX '+Number(n||0).toLocaleString('en-US');

const esc=s=>String(s??'').replace(
  /[&<>"']/g,
  m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[m])
);

const today=()=>new Date().toISOString().slice(0,10);


function msg(text,type='error'){

  const x=$('authMsg');

  x.textContent=text;

  x.className='message '+type;
}


function setMainLoading(text='Loading...'){

  $('main').innerHTML=
    '<div class="loading">'+
    esc(text)+
    '</div>';
}


/*
 V9 PROFILE ID FUNCTION

 Uses the real mavrent_id column from Supabase.

 Tenant:
 MVR-TN-00001

 Landlord:
 MVR-LD-00001
*/

function shortProfileId(uuid){

  if(!uuid)return'—';

  if(profile?.id===uuid && profile?.mavrent_id){

    return profile.mavrent_id;

  }

  const p=
    cache.registeredTenants.find(
      x=>x.id===uuid
    );

  if(p?.mavrent_id){

    return p.mavrent_id;

  }

  return 'MVR-—';
}


function chooseRole(r){

  role=r;

  $('landlordRole')
    .classList
    .toggle('sel',r==='landlord');

  $('tenantRole')
    .classList
    .toggle('sel',r==='tenant');
}


async function signup(){

  const email=$('email').value.trim();

  const password=$('password').value;

  if(!email)
    return msg('Enter your email.');

  if(password.length<6)
    return msg('Password must be at least 6 characters.');

  msg(
    'Creating your MavRent account...',
    'success'
  );

  const {data,error}=await sb.auth.signUp({

    email,
    password,

    options:{
      data:{
        role,
        full_name:'',
        phone:''
      }
    }

  });

  if(error)
    return msg(error.message);

  if(data.session){

    user=data.user;

    await loadApp();

  }else{

    msg(
      'Account created successfully. Check your email, confirm your account, then log in.',
      'success'
    );

  }
}


async function resetPassword(){

  const email=$('email').value.trim();

  if(!email)
    return msg('Enter your email first.');

  const {error}=
    await sb.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:window.location.origin
      }
    );

  if(error)
    return msg(error.message);

  msg(
    'Password reset email sent. Check your inbox.',
    'success'
  );
}


$('loginForm').addEventListener(
  'submit',
  async e=>{

    e.preventDefault();

    const email=$('email').value.trim();

    const password=$('password').value;

    if(!email||!password)
      return msg(
        'Enter your email and password.'
      );

    msg(
      'Logging in...',
      'success'
    );

    const {data,error}=
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if(error)
      return msg(error.message);

    user=data.user;

    await loadApp();

  }
);


async function loadProfile(){

  if(!user)return null;

  const result=
    await sb
      .from('profiles')
      .select('*')
      .eq('id',user.id)
      .maybeSingle();

  if(result.error){

    console.error(
      'Profile error:',
      result.error
    );

    return null;
  }

  return result.data;
}


async function loadApp(){

  if(!user||appLoading)return;

  appLoading=true;

  setMainLoading(
    'Loading your MavRent account...'
  );

  profile=await loadProfile();

  role=
    profile?.role||
    user.user_metadata?.role||
    role;

  if(!['landlord','tenant'].includes(role))
    role='tenant';

  $('auth').classList.add('hidden');

  $('app').classList.remove('hidden');

  buildNav();

  const success=await refresh();

  if(!success){

    appLoading=false;

    return;
  }

  await loadNotifications();

  show(
    role==='landlord'
      ?'dashboard'
      :'home',
    false
  );

  startNotificationRealtime();

  appLoading=false;
}


async function logout(){

  if(notificationChannel){

    await sb.removeChannel(
      notificationChannel
    );

    notificationChannel=null;
  }

  await sb.auth.signOut();

  user=null;

  profile=null;

  notifications=[];

  $('app').classList.add('hidden');

  $('auth').classList.remove('hidden');

  $('loginForm').reset();

  chooseRole('landlord');

  $('notificationPanel')
    .classList
    .add('hidden');

  $('notifyCount')
    .classList
    .add('hidden');
}


function showDbError(table,error){

  console.error(
    'MavRent database error:',
    table,
    error
  );

  $('main').innerHTML=
    '<div class="card">'+
    '<h2>Database error</h2>'+
    '<div class="notice" style="background:#fff0f0;color:#8f2222">'+
    '<b>'+esc(table)+'</b><br><br>'+
    esc(error?.message||String(error))+
    '</div>'+
    '<p>MavRent could not load this section. Check the Supabase table structure and RLS policy.</p>'+
    '</div>';

  return false;
}


async function refresh(){

  if(!user)return false;

  cache={
    properties:[],
    units:[],
    tenants:[],
    registeredTenants:[],
    payments:[],
    maintenance_requests:[],
    expenses:[],
    receipts:[]
  };


  if(role==='landlord'){

    /*
      V9:
      Load mavrent_id for tenant profiles.
    */

    let registered=
      await sb
        .from('profiles')
        .select(
          'id,full_name,email,phone,role,mavrent_id,created_at'
        )
        .eq('role','tenant')
        .order(
          'created_at',
          {ascending:false}
        );


    if(registered.error)
      return showDbError(
        'profiles',
        registered.error
      );


    cache.registeredTenants=
      registered.data||[];


    let p=
      await sb
        .from('properties')
        .select('*')
        .eq('landlord_id',user.id)
        .order(
          'created_at',
          {ascending:false}
        );


    if(p.error)
      return showDbError(
        'properties',
        p.error
      );


    cache.properties=
      p.data||[];


    const propertyIds=
      cache.properties.map(
        x=>x.id
      );


    if(propertyIds.length){

      let u=
        await sb
          .from('units')
          .select('*')
          .in(
            'property_id',
            propertyIds
          )
          .order(
            'created_at',
            {ascending:false}
          );


      if(u.error)
        return showDbError(
          'units',
          u.error
        );


      cache.units=
        u.data||[];
    }


    for(
      const table
      of [
        'tenants',
        'payments',
        'maintenance_requests',
        'expenses',
        'receipts'
      ]
    ){

      let r=
        await sb
          .from(table)
          .select('*')
          .eq(
            'landlord_id',
            user.id
          )
          .order(
            table==='receipts'
              ?'issued_at'
              :'created_at',
            {ascending:false}
          );


      if(r.error){

        if(table==='receipts'){

          r=
            await sb
              .from('receipts')
              .select('*')
              .eq(
                'landlord_id',
                user.id
              )
              .order(
                'issued_at',
                {ascending:false}
              );

        }

        if(r.error)
          return showDbError(
            table,
            r.error
          );
      }


      cache[table]=
        r.data||[];
    }


  }else{


    let t=
      await sb
        .from('tenants')
        .select('*')
        .eq(
          'profile_id',
          user.id
        )
        .eq(
          'status',
          'active'
        )
        .order(
          'created_at',
          {ascending:false}
        );


    if(t.error)
      return showDbError(
        'tenants',
        t.error
      );


    cache.tenants=
      t.data||[];


    const tenantIds=
      cache.tenants.map(
        x=>x.id
      );


    const unitIds=[
      ...new Set(
        cache.tenants
          .map(x=>x.unit_id)
          .filter(Boolean)
      )
    ];


    if(unitIds.length){

      let u=
        await sb
          .from('units')
          .select('*')
          .in(
            'id',
            unitIds
          );


      if(u.error)
        return showDbError(
          'units',
          u.error
        );


      cache.units=
        u.data||[];


      const propertyIds=[
        ...new Set(
          cache.units
            .map(x=>x.property_id)
            .filter(Boolean)
        )
      ];


      if(propertyIds.length){

        let p=
          await sb
            .from('properties')
            .select('*')
            .in(
              'id',
              propertyIds
            );


        if(p.error)
          return showDbError(
            'properties',
            p.error
          );


        cache.properties=
          p.data||[];
      }

    }


    if(tenantIds.length){

      let payment=
        await sb
          .from('payments')
          .select('*')
          .in(
            'tenant_id',
            tenantIds
          )
          .order(
            'payment_date',
            {ascending:false}
          );


      if(payment.error)
        return showDbError(
          'payments',
          payment.error
        );


      cache.payments=
        payment.data||[];


      let maint=
        await sb
          .from('maintenance_requests')
          .select('*')
          .in(
            'tenant_id',
            tenantIds
          )
          .order(
            'created_at',
            {ascending:false}
          );


      if(maint.error)
        return showDbError(
          'maintenance_requests',
          maint.error
        );


      cache.maintenance_requests=
        maint.data||[];


      let receipts=
        await sb
          .from('receipts')
          .select('*')
          .in(
            'tenant_id',
            tenantIds
          )
          .order(
            'issued_at',
            {ascending:false}
          );


      if(receipts.error)
        return showDbError(
          'receipts',
          receipts.error
        );


      cache.receipts=
        receipts.data||[];

    }

  }

  return true;
}

  }

      ?landlord(id)

async function loadNotifications(){

  if(!user)return;


  const r=
    await sb
      .from('notifications')
      .select('*')
      .eq(
        'user_id',
        user.id
      )
      .order(
        'created_at',
        {ascending:false}
      )
      .limit(50);


  if(r.error){

    console.error(
      'Notification error:',
      r.error
    );

    return;
  }


  notifications=
    r.data||[];


  updateNotificationCount();

  renderNotifications();
}


function updateNotificationCount(){

  const unread=
    notifications.filter(
      n=>!n.is_read
    ).length;


  const count=
    $('notifyCount');


  if(!count)return;


  count.textContent=
    unread>99
      ?'99+'
      :String(unread);


  count.classList.toggle(
    'hidden',
    unread===0
  );
}


function renderNotifications(){

  const box=
    $('notificationList');


  if(!box)return;


  if(!notifications.length){

    box.innerHTML=
      '<div class="empty">No notifications yet.</div>';

    return;
  }


  box.innerHTML=
    notifications
      .map(
        n=>`

        <div
          class="notificationItem ${n.is_read?'':'unread'}"
          data-notification-id="${esc(n.id)}"
          data-related-id="${esc(n.related_id||'')}">

          <div class="notificationTitle">
            ${esc(n.title)}
          </div>

          <div class="notificationMessage">
            ${esc(n.message)}
          </div>

          <div class="notificationDate">
            ${n.created_at
              ?new Date(n.created_at).toLocaleString()
              :''}
          </div>

        </div>

        `
      )
      .join('');


  document
    .querySelectorAll('.notificationItem')
    .forEach(
      item=>
        item.onclick=
          ()=>openNotification(
            item.dataset.notificationId,
            item.dataset.relatedId
          )
    );
}


function toggleNotifications(){

  $('notificationPanel')
    .classList
    .toggle('hidden');


  if(
    !$('notificationPanel')
      .classList
      .contains('hidden')
  ){

    loadNotifications();

  }

}


async function openNotification(
  notificationId
){

  await sb
    .from('notifications')
    .update({
      is_read:true
    })
    .eq(
      'id',
      notificationId
    )
    .eq(
      'user_id',
      user.id
    );


  await loadNotifications();


  const n=
    notifications.find(
      x=>x.id===notificationId
    );


  if(!n)return;


  $('notificationPanel')
    .classList
    .add('hidden');


  if(
    n.type==='payment' &&
    role==='landlord'
  )
    return show('payments');


  if(
    [
      'payment_confirmed',
      'payment_rejected'
    ].includes(n.type)
  )
    return show('myPayments');


  if(n.type==='maintenance')
    return show(
      role==='landlord'
        ?'maintenance'
        :'myMaintenance'
    );


  if(n.type==='tenant_assigned')
    return show('home');


  if(n.type==='receipt')
    return show('myReceipts');

}


async function markAllNotificationsRead(){

  if(!user)return;


  const r=
    await sb
      .from('notifications')
      .update({
        is_read:true
      })
      .eq(
        'user_id',
        user.id
      )
      .eq(
        'is_read',
        false
      );


  if(r.error)
    return alert(
      'Could not update notifications: '+
      r.error.message
    );


  await loadNotifications();
}


function cardStats(){

  const collected=
    cache.payments
      .filter(
        x=>x.status==='confirmed'
      )
      .reduce(
        (a,x)=>
          a+Number(x.amount||0),
        0
      );


  const expenses=
    cache.expenses
      .reduce(
        (a,x)=>
          a+Number(x.amount||0),
        0
      );


  const scheduled=
    cache.tenants
      .reduce(
        (a,x)=>
          a+Number(x.rent_amount||0),
        0
      );


  const occupied=
    cache.units
      .filter(
        x=>x.status==='occupied'
      )
      .length;


  const pending=
    cache.payments
      .filter(
        x=>x.status==='pending'
      )
      .length;


  const occupancy=
    cache.units.length
      ?Math.round(
        occupied/cache.units.length*100
      )
      :0;


  return `

  <div class="stats">

    <div class="card">
      <div class="label">Properties</div>
      <div class="big">
        ${cache.properties.length}
      </div>
    </div>

    <div class="card">
      <div class="label">Units</div>
      <div class="big">
        ${cache.units.length}
      </div>
    </div>

    <div class="card">
      <div class="label">Confirmed collected</div>
      <div class="big green">
        ${money(collected)}
      </div>
    </div>

    <div class="card">
      <div class="label">Pending payments</div>
      <div class="big orange">
        ${pending}
      </div>
    </div>

  </div>

  <div class="notice">

    <strong>Occupancy:</strong>
    ${occupancy}%

    &nbsp;·&nbsp;

    <strong>Scheduled rent:</strong>
    ${money(scheduled)}

    &nbsp;·&nbsp;

    <strong>Net:</strong>
    ${money(collected-expenses)}

  </div>

  `;
}

function table(
  head,
  rows,
  fn
){

  return `

  <div class="tablewrap">

    <table class="table">

      <thead>
        <tr>
          ${head
            .map(
              h=>`<th>${h}</th>`
            )
            .join('')
          }
        </tr>
      </thead>

      <tbody>

        ${
          rows.length
          ?rows.map(fn).join('')
          :`<tr>
              <td colspan="${head.length}">

        }

      </tbody>

    </table>

  </div>

  `;
}

async function uploadMaintenanceMedia(file){

  if(!file)return null;


  const type=
    (file.type||'').toLowerCase();


  const allowed=
    type.startsWith('image/')||
    type.startsWith('video/');


  if(!allowed)
    throw new Error(
      'Please select an image or video file.'
    );


  const max=
    25*1024*1024;


  if(file.size>max)
    throw new Error(
      'This file is too large. Please choose a photo or video under 25 MB.'
    );


  if(!user?.id)
    throw new Error(
      'Your MavRent session has expired. Please log in again.'
    );


  const safeName=
    (file.name||'upload')
      .replace(
        /[^a-zA-Z0-9._-]/g,
        '_'
      );


  const path=
    `${user.id}/${Date.now()}-${Math.random().toString(36).slice(2,10)}-${safeName}`;


  const bucket=
    sb.storage.from(
      MEDIA_BUCKET
    );


  const {error}=
    await bucket.upload(
      path,
      file,
      {
        contentType:type,
        cacheControl:'3600',
        upsert:false
      }
    );


  if(error){

    throw new Error(
      'Photo/video upload failed: '+
      (
        error.message||
        'Storage upload error'
      )+
      ' Make sure the maintenance-media Storage policies were created in Supabase.'
    );

  }


  const publicResult=
    bucket.getPublicUrl(path);


  const url=
    publicResult?.data?.publicUrl;


  if(!url)
    throw new Error(
      'The file uploaded, but MavRent could not create its viewing link.'
    );


  return {
    url,
    path,
    type,
    name:file.name
  };

}

async function submitTenantMaintenance(event){

  if(event)
    event.preventDefault();


  const form=
    $('tenantMaintForm');


  const status=
    $('tenantMaintStatus');


  const button=
    $('submitTenantMaintenanceBtn');


  const setStatus=(
    text,
    type='notice'
  )=>{

    if(status){

      status.textContent=text;

      status.className=
        'notice full';

      if(type==='error'){

        status.style.background=
          '#fff0f0';

        status.style.color=
          '#8f2222';

      }else{

        status.style.background=
          '#eef2ff';

        status.style.color=
          '#273244';

      }

    }

  };


  try{

    if(!user?.id)
      throw new Error(
        'Your MavRent session has expired. Please log in again.'
      );


    const tenant=
      cache.tenants[0];


    if(!tenant)
      throw new Error(
        'You have not been assigned a rental unit yet.'
      );


    const title=
      $('ttitle')?.value.trim()||
      '';


    const description=
      $('tdesc')?.value.trim()||
      '';


    const file=
      $('tmedia')?.files?.[0]||
      null;


    if(!title)
      throw new Error(
        'Please enter the problem title.'
      );


    if(!description)
      throw new Error(
        'Please describe the problem.'
      );


    if(file){

      const allowed=
        file.type.startsWith('image/')||
        file.type.startsWith('video/');


      if(!allowed)
        throw new Error(
          'Please choose an image or video file.'
        );


      if(
        file.size>
        25*1024*1024
      )
        throw new Error(
          'The file is too large. Please use a photo or video under 25 MB.'
        );

    }


    button.disabled=true;


    button.textContent=
      file
      ?'Uploading photo/video...'
      :'Sending report...';


    setStatus(
      file
      ?'Uploading your attachment...'
      :'Sending your maintenance report...'
    );


    let media=null;


    if(file)
      media=
        await uploadMaintenanceMedia(
          file
        );


    button.textContent=
      'Sending report...';


    const payload={

      tenant_id:
        tenant.id,

      landlord_id:
        tenant.landlord_id,

      unit_id:
        tenant.unit_id,

      title,

      description,

      status:'pending',

      repair_cost:0

    };


    if(media){

      payload.media_url=
        media.url;

      payload.media_path=
        media.path;

      payload.media_type=
        media.type;

      payload.media_name=
        media.name;

    }


    const result=
      await sb
        .from('maintenance_requests')
        .insert(payload)
        .select()
        .single();


    if(result.error){

      if(media?.path){

        await sb
          .storage
          .from(MEDIA_BUCKET)
          .remove([
            media.path
          ]);

      }


      throw new Error(
        'Report could not be saved: '+
        result.error.message
      );

    }


    setStatus(
      'Maintenance report sent successfully to your landlord.'
    );


    form.reset();


    await refresh();


    setTimeout(
      ()=>show(
        'myMaintenance',
        false
      ),
      500
    );


  }catch(err){

    console.error(
      'MavRent maintenance submit error:',
      err
    );


    setStatus(
      err.message||
      'Could not send the maintenance report.',
      'error'
    );


  }finally{

    button.disabled=false;

    button.textContent=
      '📷 Submit Problem Report';

  }

}


async function uploadCompletionMedia(
  file,
  requestId
){

  if(!file)return null;


  const allowed=
    file.type.startsWith('image/')||
    file.type.startsWith('video/');


  if(!allowed)
    throw new Error(
      'Please choose an image or video file.'
    );


  if(
    file.size>
    25*1024*1024
  )
    throw new Error(
      'The file is too large. Please use a file under 25 MB.'
    );


  const ext=
    (
      file.name
        .split('.')
        .pop()||
      'bin'
    ).toLowerCase();


  const path=
    `${user.id}/maintenance-after/${requestId}-${Date.now()}.${ext}`;


  const up=
    await sb
      .storage
      .from(MEDIA_BUCKET)
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:file.type
        }
      );


  if(up.error)
    throw new Error(
      'After-repair upload failed: '+
      up.error.message
    );


  const pub=
    sb
      .storage
      .from(MEDIA_BUCKET)
      .getPublicUrl(path);


  return {

    path,

    url:
      pub.data.publicUrl,

    type:
      file.type,

    name:
      file.name

  };

}

async function updateMaintenanceRequest(id){

  const request=
    cache.maintenance_requests.find(
      x=>x.id===id
    );


  if(!request)
    return alert(
      'Maintenance request not found.'
    );


  const status=
    $(`status_${id}`)?.value||
    request.status||
    'pending';


  const cost=
    Number(
      $(`cost_${id}`)?.value||
      0
    );


  const notes=
    $(`notes_${id}`)
      ?.value
      .trim()||
    null;


  const file=
    $(`after_${id}`)?.files?.[0]||
    null;


  if(cost<0)
    return alert(
      'Repair cost cannot be negative.'
    );


  try{

    const btn=
      event?.target;


    if(btn){

      btn.disabled=true;

      btn.textContent=
        file
        ?'Uploading after-repair media...'
        :'Saving update...';

    }


    let media=null;


    if(file)
      media=
        await uploadCompletionMedia(
          file,
          id
        );


    const payload={

      status,

      repair_cost:
        cost,

      landlord_notes:
        notes

    };


    if(media){

      payload.completion_media_url=
        media.url;

      payload.completion_media_path=
        media.path;

      payload.completion_media_type=
        media.type;

      payload.completion_media_name=
        media.name;

    }


    const r=
      await sb
        .from('maintenance_requests')
        .update(payload)
        .eq(
          'id',
          id
        )
        .eq(
          'landlord_id',
          user.id
        );


    if(r.error){

      if(media?.path){

        await sb
          .storage
          .from(MEDIA_BUCKET)
          .remove([
            media.path
          ]);

      }

      throw new Error(
        r.error.message
      );

    }


    const label=
      status.replace(
        '_',
        ' '
      );


    await createTenantNotification(
      request.tenant_id,
      'Maintenance update',
      `Your maintenance request “${request.title}” is now ${label}.${cost?` Repair cost: ${money(cost)}.`:''}`,
      status==='completed'
        ?'maintenance_completed'
        :'maintenance'
    );


    alert(
      'Maintenance request updated and the tenant has been notified.'
    );


    await loadNotifications();

    show('maintenance');


  }catch(e){

    console.error(e);

    alert(
      'Could not update maintenance: '+
      (
        e.message||
        e
      )
    );

  }

}

    f.onsubmit=
      async e=>{

        e.preventDefault();


        const payment=
          cache.payments.find(
            x=>
              x.id===
              $('rpayment').value
          );


        const receiptNumber=
          $('rnumber')
            .value
            .trim();


        if(!payment)
          return alert(
            'Select a payment.'
          );


        if(
          payment.status!=='confirmed'
        )
          return alert(
            'Only confirmed payments can receive a receipt.'
          );


        if(!receiptNumber)
          return alert(
            'Enter a receipt number.'
          );


        const r=
          await sb
            .from('receipts')
            .insert({

              payment_id:
                payment.id,

              tenant_id:
                payment.tenant_id,

              landlord_id:
                user.id,

              receipt_number:
                receiptNumber

            });


        if(r.error)
          return alert(
            'Receipt error: '+
            r.error.message
          );


        alert(
          'Receipt issued successfully.'
        );


        show('receipts');

      };

}


async function delProperty(id){

  if(
    !confirm(
      'Delete this property? Units belonging to it may prevent deletion.'
    )
  )
    return;


  const r=
    await sb
      .from('properties')
      .delete()
      .eq(
        'id',
        id
      )
      .eq(
        'landlord_id',
        user.id
      );


  if(r.error)
    return alert(
      'Delete error: '+
      r.error.message
    );


  alert(
    'Property deleted.'
  );


  show('properties');

}


async function delUnit(id){

  if(
    !confirm(
      'Delete this unit?'
    )
  )
    return;


  const unit=
    cache.units.find(
      x=>x.id===id
    );


  if(
    unit?.status==='occupied'
  )
    return alert(
      'You cannot delete an occupied unit. Remove the tenant first.'
    );


  const r=
    await sb
      .from('units')
      .delete()
      .eq(
        'id',
        id
      );


  if(r.error)
    return alert(
      'Delete error: '+
      r.error.message
    );


  alert(
    'Unit deleted.'
  );


  show('units');

}


async function removeTenant(
  tenantId,
  unitId
){

  if(
    !confirm(
      'Remove this tenant from the unit?'
    )
  )
    return;


  const r=
    await sb
      .from('tenants')
      .update({
        status:'inactive'
      })
      .eq(
        'id',
        tenantId
      )
      .eq(
        'landlord_id',
        user.id
      );


  if(r.error)
    return alert(
      'Tenant removal error: '+
      r.error.message
    );


  const ur=
    await sb
      .from('units')
      .update({
        status:'vacant'
      })
      .eq(
        'id',
        unitId
      );


  if(ur.error)
    return alert(
      'Tenant removed, but unit status could not be updated: '+
      ur.error.message
    );


  alert(
    'Tenant removed and unit is now vacant.'
  );


  show('tenants');

}


document.addEventListener(
  'click',
  e=>{

    const panel=
      $('notificationPanel');

    const button=
      e.target.closest(
        '.notifyBtn'
      );


    if(
      panel&&
      !panel.classList.contains(
        'hidden'
      )&&
      !panel.contains(e.target)&&
      !button
    ){

      panel
        .classList
        .add('hidden');

    }

  }
);


function startNotificationRealtime(){

  if(!user)return;


  if(notificationChannel)
    sb.removeChannel(
      notificationChannel
    );


  notificationChannel=
    sb
      .channel(
        'mavrent-notifications-'+
        user.id
      )
      .on(
        'postgres_changes',
        {
          event:'*',
          schema:'public',
          table:'notifications',
          filter:
            'user_id=eq.'+
            user.id
        },
        ()=>loadNotifications()
      )
      .subscribe();

}


sb.auth.onAuthStateChange(
  async(
    event,
    session
  )=>{

    if(event==='SIGNED_OUT')
      return;


    if(
      session&&
      !user&&
      !appLoading
    ){

      user=session.user;

      await loadApp();

    }

  }
);


(async()=>{

  const {
    data,
    error
  }=
    await sb.auth.getSession();


  if(error)
    return msg(
      'Unable to initialize MavRent: '+
      error.message
    );


  if(data.session){

    user=
      data.session.user;

    await loadApp();

  }

})();

</script>
