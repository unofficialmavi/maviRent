<body>

<button
id="landlordRole"
class="sel"
type="button"
onclick="chooseRole('landlord')">
🏢 Landlord

id="tenantRole"
type="button"
onclick="chooseRole('tenant')">

id="email"

required

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
'https://wborvbuqdiscoasnsrwa.supabase.co';

const SUPABASE_KEY =
'sb_publishable_1mthstK0eNmIFL1PHmBDLg_-5YJYScn';

const MEDIA_BUCKET =
'maintenance-media';

const sb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   GLOBAL STATE
===================================================== */

let role='landlord';
let user=null;
let profile=null;
let notifications=[];
let channel=null;
let loading=false;

let cache={
properties:[],
units:[],
tenants:[],
registeredTenants:[],
payments:[],
maintenance_requests:[],
expenses:[],
receipts:[],
rent_records:[]
};


/* =====================================================
   HELPERS
===================================================== */

const $=x=>document.getElementById(x);

const money=n =>
'UGX '+Number(n||0).toLocaleString('en-US');

const today=() =>
new Date().toISOString().slice(0,10);

const esc=s =>
String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

function shortId(id){
return id
?'MVR-'+String(id)
.replace(/-/g,'')
.slice(0,8)
.toUpperCase()
:'—';
}

function monthLabel(date){

if(!date)return '—';

let d=new Date(
date+'T00:00:00'
);

return d.toLocaleDateString(
'en-US',
{
month:'long',
year:'numeric'
}
);

}

function monthStart(date){

let d=new Date(
date+'T00:00:00'
);

return new Date(
d.getFullYear(),
d.getMonth(),
1
)
.toISOString()
.slice(0,10);

}

function addMonths(date,n){

let d=new Date(
date+'T00:00:00'
);

d.setMonth(
d.getMonth()+n
);

return new Date(
d.getFullYear(),
d.getMonth(),
1
)
.toISOString()
.slice(0,10);

}

function rentBalance(r){

return Math.max(
0,
Number(r.amount_due||0)-
Number(r.amount_paid||0)
);

}

function rentStatusClass(status){

return String(
status||'pending'
)
.toLowerCase()
.replace(/\s+/g,'_');

}

function msg(t,c='error'){

let x=$('authMsg');

x.textContent=t;

x.className=
'message '+c;

}


/* =====================================================
   LOGIN
===================================================== */

function chooseRole(r){

role=r;

$('landlordRole')
.classList.toggle(
'sel',
r==='landlord'
);

$('tenantRole')
.classList.toggle(
'sel',
r==='tenant'
);

}


async function signup(){

let email=$('email')
.value.trim();

let password=$('password')
.value;

if(!email)
return msg(
'Enter your email.'
);

if(password.length<6)
return msg(
'Password must be at least 6 characters.'
);

msg(
'Creating account...',
'success'
);

let r=
await sb.auth.signUp({
email,
password,
options:{
data:{
role,
full_name:'',
phone:''
}
}
});

if(r.error)
return msg(
r.error.message
);

if(r.data.session){

user=r.data.user;

await loadApp();

}else{

msg(
'Account created. Check your email, confirm it, then log in.',
'success'
);

}

}


async function resetPassword(){

let e=$('email')
.value.trim();

if(!e)
return msg(
'Enter your email first.'
);

let r=
await sb.auth.resetPasswordForEmail(
e,
{
redirectTo:location.origin
}
);

if(r.error)
return msg(
r.error.message
);

msg(
'Password reset email sent.',
'success'
);

}


$('loginForm').onsubmit=
async e=>{

e.preventDefault();

msg(
'Logging in...',
'success'
);

let r=
await sb.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});

if(r.error)
return msg(
r.error.message
);

user=r.data.user;

await loadApp();

};


/* =====================================================
   PROFILE
===================================================== */

async function loadProfile(){

let r=
await sb
.from('profiles')
.select('*')
.eq('id',user.id)
.maybeSingle();

if(r.error){

console.error(
r.error
);

return null;

}

return r.data;

}


/* =====================================================
   LOAD APPLICATION
===================================================== */

async function loadApp(){

if(!user||loading)
return;

loading=true;

profile=
await loadProfile();

role=
profile?.role||
user.user_metadata?.role||
role;

if(
!['landlord','tenant']
.includes(role)
)
role='tenant';

$('auth')
.classList.add(
'hidden'
);

$('app')
.classList.remove(
'hidden'
);

buildNav();

await refresh();

await loadNotifications();

show(
role==='landlord'
?'dashboard'
:'home',
false
);

startRealtime();

loading=false;

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

if(channel)
await sb.removeChannel(
channel
);

await sb.auth.signOut();

location.reload();

}


/* =====================================================
   DATABASE ERROR
===================================================== */

function dbErr(t,e){

console.error(
t,e
);

$('main').innerHTML=`

<div class="card">

<h2>
Database error
</h2>

<div class="notice error">

<b>${esc(t)}</b>

<br>

${esc(e?.message||e)}

</div>

</div>

`;

}


/* =====================================================
   REFRESH
===================================================== */

async function refresh(){

cache={
properties:[],
units:[],
tenants:[],
registeredTenants:[],
payments:[],
maintenance_requests:[],
expenses:[],
receipts:[],
rent_records:[]
};


/* LANDLORD */

if(role==='landlord'){

let r=
await sb
.from('profiles')
.select(
'id,full_name,email,phone,role,tenant_code,created_at'
)
.eq('role','tenant')
.order(
'created_at',
{ascending:false}
);

if(r.error)
return dbErr(
'profiles',
r.error
);

cache.registeredTenants=
r.data||[];


/* PROPERTIES */

r=
await sb
.from('properties')
.select('*')
.eq(
'landlord_id',
user.id
)
.order(
'created_at',
{ascending:false}
);

if(r.error)
return dbErr(
'properties',
r.error
);

cache.properties=
r.data||[];


/* UNITS */

let ids=
cache.properties.map(
x=>x.id
);

if(ids.length){

r=
await sb
.from('units')
.select('*')
.in(
'property_id',
ids
);

if(r.error)
return dbErr(
'units',
r.error
);

cache.units=
r.data||[];

}


/* MAIN TABLES */

for(
let t of [
'tenants',
'payments',
'maintenance_requests',
'expenses',
'receipts'
]
){

r=
await sb
.from(t)
.select('*')
.eq(
'landlord_id',
user.id
)
.order(
t==='receipts'
?'issued_at'
:'created_at',
{ascending:false}
);

if(
r.error&&
t==='receipts'
){

r=
await sb
.from(t)
.select('*')
.eq(
'landlord_id',
user.id
);

}

if(r.error)
return dbErr(
t,
r.error
);

cache[t]=
r.data||[];

}


/* RENT RECORDS */

r=
await sb
.from('rent_records')
.select('*')
.eq(
'landlord_id',
user.id
)
.order(
'period_month',
{ascending:false}
);

if(r.error)
return dbErr(
'rent_records',
r.error
);

cache.rent_records=
r.data||[];


/* TENANT */

}else{

let r=
await sb
.from('tenants')
.select('*')
.eq(
'profile_id',
user.id
)
.eq(
'status',
'active'
);

if(r.error)
return dbErr(
'tenants',
r.error
);

cache.tenants=
r.data||[];


let uids=
cache.tenants
.map(
x=>x.unit_id
)
.filter(Boolean);

if(uids.length){

r=
await sb
.from('units')
.select('*')
.in(
'id',
uids
);

if(r.error)
return dbErr(
'units',
r.error
);

cache.units=
r.data||[];


let pids=
cache.units
.map(
x=>x.property_id
)
.filter(Boolean);

if(pids.length){

r=
await sb
.from('properties')
.select('*')
.in(
'id',
pids
);

if(r.error)
return dbErr(
'properties',
r.error
);

cache.properties=
r.data||[];

}

}


let tids=
cache.tenants.map(

);

'payments',
'maintenance_requests',
'receipts'
]
){

await sb
.from(t)
.select('*')
.in(
'tenant_id',
tids
)
.order(
t==='payments'
?'payment_date'
:t==='receipts'
?'issued_at'
:'created_at',
{ascending:false}
);

if(r.error)
return dbErr(
t,
r.error
);

cache[t]=
r.data||[];

}


r=
await sb
.from('rent_records')
.select('*')
.in(
'tenant_id',
tids
)
.order(
'period_month',
{ascending:false}
);

);

r.data||[];

);

if(!cache.tenants.length)
return alert(

);

let created=0;
let skipped=0;
let errors=[];

for(
let t of cache.tenants
){

let unit=
cache.units
.find(
u=>u.id===t.unit_id
);

let amount=
Number(
t.rent_amount||
unit?.monthly_rent||
0
);

let dueDay=
Number(
t.rent_due_day||
1
);

let d=
new Date(
month+'T00:00:00'
);

let lastDay=
new Date(
d.getFullYear(),
d.getMonth()+1,
0
).getDate();

let safeDay=
Math.min(
dueDay,
lastDay
);

let dueDate=
new Date(
d.getFullYear(),
d.getMonth(),
safeDay
)
.toISOString()
.slice(0,10);

let existing=
cache.rent_records.find(
r=>
r.tenant_id===t.id &&
r.period_month===month
);

if(existing){

skipped++;

continue;

}

let r=
await sb
.from('rent_records')
.insert({

tenant_id:t.id,
landlord_id:t.landlord_id||user.id,
unit_id:t.unit_id,
period_month:month,
due_date:dueDate,
amount_due:amount,
amount_paid:0,
status:'pending'

});

if(r.error){

errors.push(
r.error.message
);

}else{

created++;

/* V11 RENT CREATED NOTIFICATION */

await createNotification({

user_id:t.profile_id,

title:'💰 New Rent Due',

message:
`Your rent for ${monthLabel(month)} is ${money(amount)} and is due on ${dueDate}.`,

type:'rent_due',

related_id:null

});

}

}

await refresh();

show('rent',false);

if(errors.length){

alert(
`Created ${created} rent record(s). Skipped ${skipped}. Some records failed:\n\n`+
errors.join('\n')
);

}else{

alert(
`Rent generation complete.\n\nCreated: ${created}\nAlready existed: ${skipped}`
);

}

}

async function openRentPayment(id){

let rr=
cache.rent_records
.find(
x=>x.id===id
);

if(!rr)
return;

let balance=
rentBalance(rr);

if(balance<=0)
return alert(
'This rent record is already fully paid.'
);

let amount=
prompt(
`Enter payment amount.\n\nBalance: ${money(balance)}`
);

if(amount===null)
return;

amount=
Number(amount);

if(!amount||amount<=0)
return alert(
'Enter a valid payment amount.'
);

let method=
prompt(
'Payment method:',
'mtn_mobile_money'
);

if(!method)
return;

let reference=
prompt(
'Transaction reference (optional):'
);

let newPaid=
Number(rr.amount_paid||0)+amount;

let newStatus=
newPaid>=Number(rr.amount_due||0)
?'paid'
:'partial';

let paymentPayload={

tenant_id:rr.tenant_id,
landlord_id:user.id,
amount,
payment_date:today(),
payment_method:method,
transaction_reference:
reference?.trim()||null,
notes:
`Rent payment for ${monthLabel(rr.period_month)}`,
status:'confirmed',
confirmed_at:new Date().toISOString(),
confirmed_by:user.id,
rent_record_id:rr.id

};

let p=
await sb
.from('payments')
.insert(
paymentPayload
)
.select()
.single();

if(p.error)
return alert(
'Payment could not be recorded: '+
p.error.message
);

let update=
await sb
.from('rent_records')
.update({

amount_paid:newPaid,
status:newStatus,
payment_id:p.data.id,
paid_at:
newStatus==='paid'
?new Date().toISOString()
:null

})
.eq(
'id',
rr.id
)
.eq(
'landlord_id',
user.id
);

if(update.error)
return alert(
'Payment was created but rent record could not be updated: '+
update.error.message
);


/* V11 TENANT NOTIFICATION */

let tenantProfile=
cache.tenants
.find(
x=>x.id===rr.tenant_id
)?.profile_id;

if(tenantProfile){

await createNotification({

user_id:tenantProfile,

title:'💳 Payment Recorded',

message:
`Your payment of ${money(amount)} for ${monthLabel(rr.period_month)} has been recorded by your landlord.`,

type:'payment',

related_id:p.data.id

});

}

await refresh();

show('rent',false);

alert(
`Rent payment recorded successfully.\n\nAmount: ${money(amount)}`
);

}

/* =====================================================
   MEDIA UPLOAD
===================================================== */

async function upload(
file,
path
){

if(!file)
return null;

if(
!/^image\//.test(file.type)&&
!/^video\//.test(file.type)
)
throw Error(
'Choose an image or video.'
);

if(
file.size>
25*1024*1024
)
throw Error(
'File must be under 25 MB.'
);

let r=
await sb
.storage
.from(MEDIA_BUCKET)
.upload(
path,
file,
{
contentType:file.type,
upsert:false
}
);

if(r.error)
throw Error(
'Upload failed: '+
r.error.message
);

let u=
sb.storage
.from(MEDIA_BUCKET)
.getPublicUrl(path);

return{
url:u.data.publicUrl,
path,
type:file.type,
name:file.name
};

}

   CREATE NOTIFICATION

async function createNotification({
user_id,
title,
message,
type='general',
related_id=null
}){

if(!user_id)
return null;

let r=
await sb
.from('notifications')
.insert({

user_id,
title,
message,
type,
related_id,
is_read:false

});

if(r.error){

console.error(
'Notification error:',
r.error
);

return null;

}

return r;

}

/* =====================================================

===================================================== */

async function loadNotifications(){

if(!user)
return;

let r=
await sb
.from('notifications')
.select('*')
.eq(
'user_id',
user.id
)
.order(
'created_at',
{ascending:false}
)
.limit(50);

if(r.error){

console.error(
'Could not load notifications:',
r.error
);

return;

}

notifications=
r.data||[];

let unread=
notifications.filter(
x=>!x.is_read
).length;

$('notifyCount')
.textContent=
unread;

$('notifyCount')
.classList.toggle(
'hidden',
unread===0
);

$('notificationList').innerHTML=
notifications.length
?notifications.map(
n=>`

<div
class="notificationItem ${
n.is_read?'':'unread'
}"
onclick="openNotification('${n.id}')">

<div class="notificationTitle">
${esc(n.title)}
</div>

<div class="notificationMessage">
${esc(n.message)}
</div>

<div class="notificationType">
${esc(n.type||'notification')}
</div>

<div class="notificationDate">
${
n.created_at
?new Date(
n.created_at
).toLocaleString()
:''
}
</div>

</div>

`
).join('')
:`

<div class="empty">
No notifications yet.
</div>

`;

}


/* =====================================================
   OPEN NOTIFICATION
===================================================== */

async function openNotification(id){

let n=
notifications.find(
x=>x.id===id
);

if(!n)
return;

if(!n.is_read){

await sb
.from('notifications')
.update({
is_read:true
})
.eq(
'id',
id
)
.eq(
'user_id',
user.id
);

}

await loadNotifications();

}

/* =====================================================
   REALTIME NOTIFICATIONS
===================================================== */

function startRealtime(){

if(channel)
sb.removeChannel(
channel
);

channel=
sb.channel(
'mavrent-'+user.id
)
.on(
'postgres_changes',
{

event:'*',
schema:'public',
table:'notifications',

filter:
'user_id=eq.'+
user.id

},
payload=>{

loadNotifications();

/* Browser notification if permission is available */

if(
payload.eventType==='INSERT' &&
Notification.permission==='granted'
){

try{

new Notification(
payload.new?.title||
'MavRent Notification',
{
body:
payload.new?.message||
'You have a new notification.'
}
);

}catch(e){

console.log(e);

}

}

}
)
.subscribe();


/* Ask browser permission */

if(
'Notification' in window &&
Notification.permission==='default'
){

Notification.requestPermission()
.catch(
()=>{}
);

}

}
