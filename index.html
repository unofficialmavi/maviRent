<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="auth" class="auth">
  <div class="login">
    <div class="brand">Mav<span>Rent</span></div>
    <div class="muted">Rental management platform</div>

    <div class="role">
      <button id="landlordRole" class="sel" type="button" onclick="chooseRole('landlord')">🏢 Landlord</button>
      <button id="tenantRole" type="button" onclick="chooseRole('tenant')">👤 Tenant</button>
    </div>

    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" required placeholder="you@example.com">

      <label>Password</label>
      <input id="password" type="password" required placeholder="Enter password">

      <button class="primary" type="submit">Login</button>
    </form>

    <button class="secondary" onclick="signup()">Create account</button>
    <button class="link" onclick="resetPassword()">Forgot password?</button>

    <div id="authMsg" class="message hidden"></div>
  </div>
</div>

<!-- =====================================================
     APPLICATION
===================================================== -->

<div id="app" class="hidden">
  <header>
    <div class="bar">
      <div class="brand small">Mav<span>Rent</span></div>

      <div class="userbox">
        <span id="who"></span>

        <button class="notifyBtn" onclick="toggleNotifications()" title="Notifications">
          🔔
          <span id="notifyCount" class="notifyCount hidden">0</span>
        </button>

        <button class="logout" onclick="logout()">Log out</button>
      </div>
    </div>

    <nav id="nav"></nav>
  </header>

  <main id="main"></main>
</div>

<!-- =====================================================
     NOTIFICATION PANEL
===================================================== -->

<div id="notificationPanel" class="notificationPanel hidden">
  <div class="notificationHead">
    <h3 style="margin:0">🔔 Notifications</h3>
    <button class="btn" onclick="markAllNotificationsRead()">Mark all read</button>
  </div>
  <div id="notificationList"></div>
</div>

<script>

/* =====================================================
   STARTUP SAFETY
===================================================== */
window.addEventListener('load',()=>{
  const loader=document.getElementById('mavLoading');
  if(loader){
    setTimeout(()=>loader.classList.add('hide'),700);
  }
});

/* =====================================================
   ONLINE STATUS MONITOR
===================================================== */
function updateOnlineStatus(){
  const statusEl = $('connectionStatus');
  const textEl = $('connectionText');
  if(!statusEl) return;
  if(navigator.onLine){
    statusEl.className = 'connection-status online';
    textEl.textContent = 'Online';
  } else {
    statusEl.className = 'connection-status offline';
    textEl.textContent = 'Offline';
  }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);

/* =====================================================
   PWA SERVICE WORKER
===================================================== */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(reg=>console.log('MavRent SW registered:', reg.scope))
      .catch(err=>console.error('MavRent SW registration failed:', err));
  });
}

/* =====================================================
   SUPABASE INITIALIZATION
===================================================== */
const SUPABASE_URL = 'https://wborvbuqdiscoasnsrwa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1mthstK0eNmIFL1PHmBDLg_-5YJYScn';

let sb=null;
if(window.supabase && typeof window.supabase.createClient==='function'){
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
}else{
  console.error('MavRent: Supabase library did not load.');
  window.addEventListener('load',()=>{
    const box=document.getElementById('authMsg');
    if(box){
      box.textContent='MavRent could not connect to its login service. Please refresh.';
      box.className='message error';
      box.classList.remove('hidden');
    }
  });
}

/* =====================================================
   GLOBAL STATE
===================================================== */
let role='landlord';
let user=null;
let profile=null;
let notifications=[];
let channel=null;
let loading=false;

let cache={
  properties:[],
  units:[],
  tenants:[],
  registeredTenants:[],
  payments:[],
  maintenance_requests:[],
  expenses:[],
  receipts:[],
  rent_records:[]
};

/* =====================================================
   HELPERS
===================================================== */
const $=x=>document.getElementById(x);
const money=n=>'UGX '+Number(n||0).toLocaleString('en-US');
const today=()=>new Date().toISOString().slice(0,10);

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#039;'
}[m]));

function rentBalance(r){
  return Math.max(0, Number(r.amount_due||0)-Number(r.amount_paid||0));
}

function msg(t,c='error'){
  let x=$('authMsg');
  if(!x) return;
  x.textContent=t;
  x.className='message '+c;
  x.classList.remove('hidden');
}

/* =====================================================
   LOGIN & AUTH
===================================================== */
function chooseRole(r){
  role=r;
  $('landlordRole').classList.toggle('sel',r==='landlord');
  $('tenantRole').classList.toggle('sel',r==='tenant');
}

async function signup(){
  let email=$('email').value.trim();
  let password=$('password').value;

  if(!email) return msg('Enter your email.');
  if(password.length<6) return msg('Password must be at least 6 characters.');

  msg('Creating account...','success');

  let r=await sb.auth.signUp({
    email,
    password,
    options:{ data:{ role, full_name:'', phone:'' } }
  });

  if(r.error) return msg(r.error.message);

  if(r.data.session){
    user=r.data.user;
    await loadApp();
  }else{
    msg('Account created. Check your email to confirm, then log in.','success');
  }
}

async function resetPassword(){
  let e=$('email').value.trim();
  if(!e) return msg('Enter your email first.');

  let r=await sb.auth.resetPasswordForEmail(e,{ redirectTo:location.origin });
  if(r.error) return msg(r.error.message);

  msg('Password reset email sent.','success');
}

$('loginForm').onsubmit=async e=>{
  e.preventDefault();
  msg('Logging in...','success');

  let r=await sb.auth.signInWithPassword({
    email:$('email').value.trim(),
    password:$('password').value
  });

  if(r.error) return msg(r.error.message);

  user=r.data.user;
  await loadApp();
};

/* =====================================================
   PROFILE & APP INITIALIZATION
===================================================== */
async function loadProfile(){
  let r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(r.error){
    console.error(r.error);
    return null;
  }
  return r.data;
}

async function loadApp(){
  if(!user||loading) return;
  loading=true;

  profile=await loadProfile();
  role=profile?.role || user.user_metadata?.role || role;
  if(!['landlord','tenant'].includes(role)) role='tenant';

  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');

  buildNav();
  await refresh();
  await loadNotifications();

  show(role==='landlord'?'dashboard':'home',false);
  startRealtime();

  loading=false;
}

async function logout(){
  if(channel) await sb.removeChannel(channel);
  await sb.auth.signOut();
  location.reload();
}

/* =====================================================
   DATA FETCHING & REFRESH
===================================================== */
function dbErr(t,e){
  console.error(t,e);
  $('main').innerHTML=`
    <div class="card">
      <h2>Database error</h2>
      <div class="notice error">
        <b>${esc(t)}</b><br>${esc(e?.message||e)}
      </div>
    </div>
  `;
}

async function refresh(){
  cache={
    properties:[], units:[], tenants:[], registeredTenants:[],
    payments:[], maintenance_requests:[], expenses:[], receipts:[], rent_records:[]
  };

  if(role==='landlord'){
    let r=await sb.from('profiles').select('*').eq('role','tenant');
    if(r.error) return dbErr('profiles',r.error);
    cache.registeredTenants=r.data||[];

    r=await sb.from('properties').select('*').eq('landlord_id',user.id);
    if(r.error) return dbErr('properties',r.error);
    cache.properties=r.data||[];

    let ids=cache.properties.map(x=>x.id);
    if(ids.length){
      r=await sb.from('units').select('*').in('property_id',ids);
      if(r.error) return dbErr('units',r.error);
      cache.units=r.data||[];
    }

    for(let t of ['tenants','payments','maintenance_requests','expenses','receipts']){
      r=await sb.from(t).select('*').eq('landlord_id',user.id);
      if(r.error) return dbErr(t,r.error);
      cache[t]=r.data||[];
    }

    r=await sb.from('rent_records').select('*').eq('landlord_id',user.id);
    if(r.error) return dbErr('rent_records',r.error);
    cache.rent_records=r.data||[];

  }else{
    let r=await sb.from('tenants').select('*').eq('profile_id',user.id);
    if(r.error) return dbErr('tenants',r.error);
    cache.tenants=r.data||[];

    let tids=cache.tenants.map(x=>x.id);
    if(tids.length){
      for(let t of ['payments','maintenance_requests','receipts','rent_records']){
        r=await sb.from(t).select('*').in('tenant_id',tids);
        if(r.error) return dbErr(t,r.error);
        cache[t]=r.data||[];
      }
    }
  }
}

/* =====================================================
   NAVIGATION & UI ROUTING
===================================================== */
function buildNav(){
  $('who').textContent=(role==='landlord'?'Landlord: ':'Tenant: ') + (profile?.full_name||user.email);

  const landlordItems = [
    'dashboard:🏠 Dashboard','rent:💰 Rent','properties:🏘️ Properties',
    'units:🚪 Units','tenants:👥 Tenants','payments:💳 Payments',
    'maintenance:🔧 Maintenance','expenses:🧾 Expenses','receipts:🧾 Receipts',
    'reports:📊 Reports','guide:❓ Guide','profile:👤 Profile'
  ];

  const tenantItems = [
    'home:🏠 My Home','myRent:💰 My Rent','myPayments:💳 My Payments',
    'myMaintenance:🔧 Maintenance','myReceipts:🧾 My Receipts',
    'guide:❓ Guide','profile:👤 My Profile'
  ];

  const items = role==='landlord' ? landlordItems : tenantItems;

  $('nav').innerHTML=items.map(x=>{
    let[a,b]=x.split(':');
    return `<button data-p="${a}">${b}</button>`;
  }).join('');

  document.querySelectorAll('#nav button').forEach(b=>{
    b.onclick=()=>show(b.dataset.p);
  });
}

async function show(id,reload=true){
  if(reload) await refresh();

  $('main').innerHTML= (role==='landlord') ? landlord(id) : tenant(id);

  document.querySelectorAll('#nav button').forEach(b=>
    b.classList.toggle('active', b.dataset.p===id)
  );
}

/* =====================================================

===================================================== */
function landlord(id){
  if(id==='dashboard') return landlordDashboard();
  if(id==='rent') return pageTemplate('Rent Management', 'Manage rent schedules & tracking');
  if(id==='properties') return pageTemplate('Properties', 'Manage your buildings');
  if(id==='units') return pageTemplate('Units', 'Manage rooms and apartments');
  if(id==='tenants') return pageTemplate('Tenants', 'Manage active tenant profiles');
  if(id==='payments') return pageTemplate('Payments', 'Review incoming payments');
  if(id==='maintenance') return pageTemplate('Maintenance Requests', 'Manage work orders');
  if(id==='expenses') return pageTemplate('Expenses', 'Track property costs');
  if(id==='receipts') return pageTemplate('Receipts', 'Issued payment receipts');
  if(id==='reports') return pageTemplate('Financial Reports', 'Overview of earnings');
  if(id==='guide') return pageTemplate('Landlord Guide', 'Help & instructions');
  if(id==='profile') return pageTemplate('Landlord Profile', 'Account settings');
  return '<div>Page not found</div>';
}

function landlordDashboard(){
  let paid=cache.rent_records.reduce((a,x)=>a+Number(x.amount_paid||0),0);
  let due=cache.rent_records.reduce((a,x)=>a+Number(x.amount_due||0),0);
  let outstanding=Math.max(0, due-paid);
  let overdue=cache.rent_records.filter(x=>x.status==='overdue').reduce((a,x)=>a+rentBalance(x),0);

  return `
    <section>
      <div class="title">
        <h1>Landlord Dashboard</h1>
        <p>Manage your rental business.</p>
      </div>

      <div class="stats">
        <div class="card"><small>Properties</small><div class="big">${cache.properties.length}</div></div>
        <div class="card"><small>Units</small><div class="big">${cache.units.length}</div></div>
        <div class="card"><small>Rent Collected</small><div class="big green">${money(paid)}</div></div>
        <div class="card"><small>Outstanding Rent</small><div class="big red">${money(outstanding)}</div></div>
      </div>

      <div class="grid">
        <div class="card">
          <h3>💰 Rent Overview</h3>
          <p>Total rent due: <b>${money(due)}</b></p>
          <p>Collected: <b class="green">${money(paid)}</b></p>
          <p>Outstanding: <b class="red">${money(outstanding)}</b></p>
          <p>Overdue: <b class="red">${money(overdue)}</b></p>
          <button class="primary" onclick="show('rent')">Open Rent System</button>
        </div>

        <div class="card">
          <h3>Quick Actions</h3>
          <div class="actions">
            <button class="btn" onclick="show('rent')">💰 Rent</button>
            <button class="btn" onclick="show('properties')">＋ Property</button>
            <button class="btn" onclick="show('units')">＋ Unit</button>
            <button class="btn" onclick="show('tenants')">＋ Tenant</button>
            <button class="btn" onclick="show('payments')">💳 Payments</button>
            <button class="btn" onclick="show('maintenance')">🔧 Maintenance</button>
          </div>
        </div>
      </div>
    </section>
  `;
}

/* =====================================================
   NOTIFICATIONS SYSTEM (FIXED & FULLY IMPLEMENTED)
===================================================== */
function toggleNotifications(){
  const panel = $('notificationPanel');
  if(panel){
    panel.classList.toggle('hidden');
  }
}

async function loadNotifications(){
  if(!user||!sb) return;
  try {
    let r = await sb
      .from('notifications')
      .select('*')
      .eq('user_id', user.id)
      .order('created_at', {ascending: false});

    if(r.error){
      console.warn('Notifications fetch error:', r.error);
      return;
    }

    notifications = r.data || [];
    renderNotifications();
  } catch(e) {
    console.warn('loadNotifications exception:', e);
  }
}

function renderNotifications(){
  const countEl = $('notifyCount');
  const listEl = $('notificationList');

  const unreadCount = notifications.filter(n => !n.is_read).length;
  if(countEl){
    countEl.textContent = unreadCount;
    countEl.classList.toggle('hidden', unreadCount === 0);
  }

  if(!listEl) return;

  if(!notifications.length){
    listEl.innerHTML = '<div class="empty">No notifications yet.</div>';
    return;
  }

  listEl.innerHTML = notifications.map(n => `
    <div class="notificationItem ${n.is_read ? '' : 'unread'}" onclick="markNotificationRead('${n.id}')">
      <div class="notificationTitle">${esc(n.title || 'Notification')}</div>
      <div class="notificationMessage">${esc(n.message || '')}</div>
      <div class="notificationDate">${new Date(n.created_at).toLocaleString()}</div>
    </div>
  `).join('');
}

async function markNotificationRead(id){
  const item = notifications.find(n => n.id === id);
  if(item && !item.is_read){
    item.is_read = true;
    renderNotifications();
    await sb.from('notifications').update({is_read: true}).eq('id', id);
  }
}

async function markAllNotificationsRead(){
  notifications.forEach(n => n.is_read = true);
  renderNotifications();
  await sb.from('notifications').update({is_read: true}).eq('user_id', user.id);
}

function startRealtime(){
  if(!user||!sb) return;
  channel = sb.channel('public:notifications:' + user.id)
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'notifications',
      filter: `user_id=eq.${user.id}`
    }, payload => {
      notifications.unshift(payload.new);
      renderNotifications();
    })
    .subscribe();
}
