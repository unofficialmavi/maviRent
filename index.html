<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Push Notification Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }

    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
    }

    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    #status {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Notifications</h2>
    <p>Enable push notifications to receive updates directly in your browser.</p>
    <button id="notify-btn">Enable Notifications</button>
    <div id="status"></div>
  </div>

  <script>
    const VAPID_PUBLIC_KEY = 'BPta9_z15Ou9pn1uxOt-uvH5i8hRPO0ARNUx-tZtWTHe5HWoBYgRbkXGl6CudK-VRz7mNHc7WY5BZPfUWOhko2A';
    const btn = document.getElementById('notify-btn');
    const statusDiv = document.getElementById('status');

    // Convert Base64 VAPID public key to Uint8Array
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // Register embedded inline Service Worker script
    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        throw new Error('Service Workers are not supported in this browser.');
      }

      const swCode = `
        self.addEventListener('push', event => {
          const data = event.data ? event.data.text() : 'New notification received!';
          event.waitUntil(
            self.registration.showNotification('App Notification', {
              body: data,
              icon: 'https://via.placeholder.com/128'
            })
          );
        });
      `;

      const blob = new Blob([swCode], { type: 'application/javascript' });
      const blobUrl = URL.createObjectURL(blob);
      return await navigator.serviceWorker.register(blobUrl);
    }

    // Button event handler
    btn.addEventListener('click', async () => {
      if (!('Notification' in window) || !('PushManager' in window)) {
        statusDiv.textContent = 'Push messaging is not supported by your browser.';
        return;
      }

      try {
        btn.disabled = true;
        statusDiv.textContent = 'Requesting permission...';

        const permission = await Notification.requestPermission();

        if (permission !== 'granted') {
          statusDiv.textContent = 'Permission was denied or dismissed.';
          btn.disabled = false;
          return;
        }

        statusDiv.textContent = 'Registering Service Worker...';
        const registration = await registerServiceWorker();

        statusDiv.textContent = 'Subscribing to Push service...';
        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });

        console.log('Push Subscription Payload:', JSON.stringify(subscription));

        btn.textContent = 'Notifications Enabled';
        statusDiv.textContent = 'Subscribed successfully! Check the browser console to copy your subscription payload.';
      } catch (error) {
        console.error('Push Setup Error:', error);
        statusDiv.textContent = `Error: ${error.message}`;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
