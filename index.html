<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mavrent Dashboard</title>
  <link rel="manifest" href="/manifest.json" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 antialiased min-h-screen">

  <!-- Header Navigation -->
  <header class="bg-blue-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-tight">Mavrent Portal</h1>
      <div id="auth-controls">
        <button id="auth-btn" onclick="handleAuthAction()" class="bg-white text-blue-600 px-4 py-1.5 rounded-md font-medium text-sm hover:bg-gray-100 transition">
          Loading...
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- Alert Containers for Dynamic Notifications -->
    <section id="landlord-approval-container" class="space-y-3 mb-6"></section>
    <section id="tenant-alert-container" class="mb-6"></section>

    <!-- Main Dashboard Body -->
    <div id="dashboard-content" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <h2 class="text-lg font-bold mb-4">Dashboard Overview</h2>
      <p class="text-gray-600">Select an action or review your current unit summaries above.</p>
    </div>

  </main>

  <!-- Payment Proof Modal -->
  <div id="payment-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl border border-gray-100 space-y-4">
      <h3 class="text-lg font-bold text-gray-900">Submit Rent Payment</h3>
      <p class="text-sm text-gray-600">Enter your Mobile Money, Bank Reference, or Receipt transaction ID below for landlord verification.</p>
      
      <input type="hidden" id="modal-ledger-id" />
      
      <div>
        <label for="modal-tx-ref" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
          Transaction Reference / Receipt #
        </label>
        <input 
          type="text" 
          id="modal-tx-ref" 
          placeholder="e.g. TXN-9840283 or MM-84920" 
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div class="flex justify-end space-x-2 pt-2">
        <button 
          onclick="closePaymentModal()" 
          class="px-4 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100 transition font-medium"
        >
          Cancel
        </button>
        <button 
          onclick="submitPaymentProof()" 
          id="submit-proof-btn"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold transition"
        >
          Submit for Approval
        </button>
      </div>
    </div>
  </div>

  <script>
    // Supabase Client Config - Replace with your project details
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentUserRole = null;

    // --- DOM Loaded Setup ---
    window.addEventListener('DOMContentLoaded', async () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Registration failed:', err));
      }

      const { data: { user } } = await supabase.auth.getUser();
      currentUser = user;

      if (currentUser) {
        // Fetch User Profile Role
        const { data: profile } = await supabase
          .from('profiles')
          .select('role')
          .eq('id', currentUser.id)
          .single();
        
        currentUserRole = profile ? profile.role : 'tenant';
        updateAuthUI(true);
        await initDashboardData();
      } else {
        updateAuthUI(false);
      }
    });

    // --- UI Data Ingestion ---
    async function initDashboardData() {
      if (!currentUser) return;

      if (currentUserRole === 'landlord') {
        await loadLandlordApprovalAlerts();
      } else {
        await loadTenantRentSummary(currentUser.id);
      }
    }

    // --- Tenant Alert View ---
    async function loadTenantRentSummary(tenantId) {
      const alertContainer = document.getElementById('tenant-alert-container');
      if (!alertContainer) return;

      const { data: summary, error } = await supabase
        .from('tenant_rent_summaries')
        .select('*')
        .eq('tenant_id', tenantId)
        .maybeSingle();

      if (error || !summary) {
        alertContainer.innerHTML = '';
        return;
      }

      if (summary.oldest_unpaid_status === 'Pending Approval') {
        alertContainer.innerHTML = `
          <div class="alert bg-blue-50 border border-blue-200 text-blue-900 p-4 rounded-xl flex items-center justify-between shadow-sm">
            <div>
              <p class="font-bold text-sm">Payment Verification Pending</p>
              <p class="text-xs text-blue-700 mt-0.5">
                Ref Code: <span class="font-mono font-semibold">${summary.transaction_ref || 'N/A'}</span>. Waiting for landlord confirmation.
              </p>
            </div>
            <span class="text-xs bg-blue-200 text-blue-800 font-bold px-2.5 py-1 rounded-full">Pending Approval</span>
          </div>
        `;
        return;
      }

      alertContainer.innerHTML = `
        <div class="alert bg-amber-50 border border-amber-200 text-amber-900 p-4 rounded-xl flex items-center justify-between shadow-sm">
          <div>
            <p class="font-bold text-sm">Outstanding Rent Due</p>
            <p class="text-xs text-amber-800 mt-0.5">
              Balance: <strong class="text-sm font-semibold text-amber-950">$${summary.oldest_unpaid_balance}</strong> | Due Date: <strong>${summary.oldest_unpaid_due_date}</strong>
            </p>
          </div>
          <button 
            onclick="openPaymentModal('${summary.oldest_unpaid_ledger_id}')" 
            class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg font-semibold text-xs transition-all shadow-sm"
          >
            Pay Now / Submit Ref
          </button>
        </div>
      `;
    }

    // --- Landlord Approval View ---
    async function loadLandlordApprovalAlerts() {
      const container = document.getElementById('landlord-approval-container');
      if (!container) return;

      const { data: pendingLedgers, error } = await supabase
        .from('rent_ledgers')
        .select('*, profiles:tenant_id(full_name)')
        .eq('status', 'Pending Approval');

      if (error || !pendingLedgers || pendingLedgers.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = pendingLedgers.map(item => `
        <div class="bg-indigo-50 border border-indigo-200 text-indigo-950 p-4 rounded-xl flex items-center justify-between shadow-sm">
          <div>
            <p class="font-bold text-sm">${item.profiles?.full_name || 'Tenant'} submitted a payment</p>
            <p class="text-xs text-indigo-800 mt-0.5">
              Ref Code: <span class="font-mono font-bold bg-indigo-100 px-1.5 py-0.5 rounded text-indigo-900">${item.transaction_ref || 'None'}</span> | Amount: <strong>$${item.amount_due}</strong>
            </p>
          </div>
          <div class="flex space-x-2">
            <button 
              onclick="processLandlordDecision('${item.id}', 'Paid')" 
              class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg font-semibold text-xs transition"
            >
              Approve
            </button>
            <button 
              onclick="processLandlordDecision('${item.id}', 'Overdue')" 
              class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg font-semibold text-xs transition"
            >
              Reject
            </button>
          </div>
        </div>
      `).join('');
    }

    // --- Payment Proof Modal Handling ---
    function openPaymentModal(ledgerId) {
      document.getElementById('modal-ledger-id').value = ledgerId;
      document.getElementById('modal-tx-ref').value = '';
      document.getElementById('payment-modal').classList.remove('hidden');
      document.getElementById('payment-modal').classList.add('flex');
    }

    function closePaymentModal() {
      document.getElementById('payment-modal').classList.add('hidden');
      document.getElementById('payment-modal').classList.remove('flex');
    }

    async function submitPaymentProof() {
      const ledgerId = document.getElementById('modal-ledger-id').value;
      const txRef = document.getElementById('modal-tx-ref').value.trim();

      if (!txRef) {
        alert("Please enter a valid transaction reference code or receipt number.");
        return;
      }

      const btn = document.getElementById('submit-proof-btn');
      btn.disabled = true;
      btn.innerText = "Submitting...";

      try {
        const { error } = await supabase
          .from('rent_ledgers')
          .update({
            status: 'Pending Approval',
            transaction_ref: txRef
          })
          .eq('id', ledgerId);

        if (error) throw error;

        closePaymentModal();
        await initDashboardData();
        alert("Payment proof submitted successfully! Pending landlord approval.");
      } catch (err) {
        alert("Submission failed: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Submit for Approval";
      }
    }

    // --- Landlord Approve/Reject Handler ---
    async function processLandlordDecision(ledgerId, newStatus) {
      const actionText = newStatus === 'Paid' ? 'approve' : 'reject';
      if (!confirm(`Are you sure you want to ${actionText} this payment?`)) return;

      try {
        const updateData = { status: newStatus };
        if (newStatus === 'Paid') {
          updateData.amount_paid = supabase.raw ? supabase.raw('amount_due') : undefined;
        }

        const { error } = await supabase
          .from('rent_ledgers')
          .update(updateData)
          .eq('id', ledgerId);

        if (error) throw error;

        await initDashboardData();
      } catch (err) {
        alert("Decision update failed: " + err.message);
      }
    }

    // --- Authentication Helper ---
    function updateAuthUI(isLoggedIn) {
      const btn = document.getElementById('auth-btn');
      if (isLoggedIn) {
        btn.innerText = "Log Out";
      } else {
        btn.innerText = "Log In";
      }
    }

    function handleAuthAction() {
      if (currentUser) {
        supabase.auth.signOut().then(() => location.reload());
      } else {
        // Redirect to your login page or open login modal
        alert("Redirecting to login...");
      }
    }
  </script>
</body>
</html>
