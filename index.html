<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">

<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MavRent">

<title>MavRent V15</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:#f4f5f7;
color:#17202a;
-webkit-font-smoothing:antialiased
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.mav-loading{
position:fixed;
inset:0;
z-index:99999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:
radial-gradient(circle at 20% 20%,#34b4ff44,transparent 30%),
linear-gradient(135deg,#061b45,#0869d7 55%,#03163d);
color:#fff;
transition:opacity .35s ease,visibility .35s ease
}

.mav-loading.hide{
opacity:0;
visibility:hidden;
pointer-events:none
}

.mav-loading-logo{
width:82px;
height:82px;
border-radius:24px;
display:grid;
place-items:center;
background:linear-gradient(135deg,#087cff,#00b8ff);
box-shadow:0 20px 50px #0005;
font-size:42px;
font-weight:900
}

.mav-loading-name{
margin-top:18px;
font-size:32px;
font-weight:900
}

.mav-loading-name span{color:#67c7ff}

.mav-loading-text{
margin-top:5px;
color:#ffffffaa;
font-size:13px
}

.mav-loading-status{
margin-top:22px;
font-size:11px;
color:#ffffff99
}

.mav-spinner{
width:25px;
height:25px;
margin-top:18px;
border:3px solid #ffffff40;
border-top-color:#fff;
border-radius:50%;
animation:mavspin .8s linear infinite
}

@keyframes mavspin{
to{transform:rotate(360deg)}
}

.connection-status{
position:fixed;
right:12px;
bottom:14px;
z-index:90;
display:flex;
align-items:center;
gap:7px;
padding:7px 11px;
border-radius:999px;
background:#fff;
border:1px solid #e5e7eb;
box-shadow:0 5px 20px #0002;
font-size:11px;
font-weight:800
}

.connection-dot{
width:8px;
height:8px;
border-radius:50%;
background:#16a34a
}

.connection-status.offline{color:#991b1b}

.connection-status.offline .connection-dot{
background:#ef4444
}

/* AUTH */

.auth{
min-height:100vh;
display:grid;
place-items:center;
padding:25px;
background:
radial-gradient(circle at 15% 15%,#34b4ff55,transparent 30%),
radial-gradient(circle at 85% 20%,#0062ff66,transparent 34%),
linear-gradient(135deg,#061b45,#0a4da2 48%,#03163d)
}

.login{
width:min(450px,100%);
padding:30px;
color:#fff;
border:1px solid #ffffff44;
border-radius:26px;
background:#ffffff18;
backdrop-filter:blur(22px);
box-shadow:0 28px 80px #00000055
}

.brand{
font-size:32px;
font-weight:900
}

.brand span{color:#67c7ff}

.muted{
color:#ffffffb8;
font-size:13px
}

.role{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin:22px 0
}

.role button,.secondary{
padding:13px;
border:1px solid #ffffff44;
background:#ffffff12;
color:#fff;
border-radius:12px
}

.role .sel{
background:#fff;
color:#0869d7
}

label{
display:block;
font-size:12px;
margin:12px 0 6px;
color:#ffffffd0
}

.login input{
width:100%;
padding:13px;
border:1px solid #ffffff4d;
border-radius:12px;
background:#ffffff12;
color:#fff;
outline:0
}

.login input::placeholder{color:#ffffff99}

.primary{
width:100%;
margin-top:12px;
padding:13px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#087cff,#00b8ff);
color:#fff;
font-weight:800
}

.primary:disabled{
opacity:.55;
cursor:not-allowed
}

.secondary{
width:100%;
margin-top:10px;
font-weight:700
}

.link{
background:none;
border:0;
color:#bfe7ff;
margin-top:12px;
text-decoration:underline
}

.message,.notice{
padding:11px;
border-radius:10px;
font-size:13px;
margin-top:12px
}

.error{
background:#fff0f0;
color:#8f2222
}

.success{
background:#ecfdf3;
color:#08743f
}

.warning{
background:#fff8e6;
color:#8a5a00
}

/* APP */

header{
background:#111827;
color:#fff;
padding:15px;
position:sticky;
top:0;
z-index:20
}

.bar,nav,main{
max-width:1100px;
margin:auto
}

.bar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.small{font-size:22px}

.userbox{
font-size:12px;
display:flex;
gap:7px;
align-items:center
}

.logout,.notifyBtn{
background:#273244;
color:#fff;
border:0;
border-radius:99px;
padding:8px 10px
}

.notifyBtn{
position:relative;
font-size:17px
}

.notifyCount{
position:absolute;
right:-5px;
top:-6px;
background:#ef4444;
border-radius:50%;
font-size:10px;
min-width:18px;
height:18px;
display:grid;
place-items:center;
border:2px solid #111827
}

/* NAVIGATION */

.navWrap{
max-width:1100px;
margin:auto;
position:relative
}

nav{
display:flex;
gap:6px;
margin-top:12px;
align-items:center
}

nav button{
border:0;
background:#273244;
color:#dbe1e8;
border-radius:9px;
padding:9px 11px;
white-space:nowrap
}

nav button.active{
background:#fff;
color:#111827
}

.navMore{
position:relative
}

.navMore>button{
background:#087cff;
color:#fff;
font-weight:800
}

.moreMenu{
position:absolute;
right:0;
top:45px;
width:230px;
background:#fff;
border:1px solid #e2e5e9;
border-radius:14px;
box-shadow:0 20px 50px #0003;
padding:8px;
z-index:200
}

.moreMenu button{
display:block;
width:100%;
text-align:left;
border:0;
background:#fff;
color:#17202a;
padding:12px;
border-radius:9px;
font-weight:700
}

.moreMenu button:hover{
background:#f1f5f9
}

.moreMenu button.active{
background:#e8f2ff;
color:#087cff
}

main{
padding:20px 14px 50px
}

.title{
margin-bottom:15px
}

.title h1{
margin:0;
font-size:25px
}

.title p{
margin:5px 0;
color:#6b7280
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

.card{
background:#fff;
border:1px solid #e3e6ea;
border-radius:14px;
padding:16px;
margin-bottom:14px
}

.big{
font-size:22px;
font-weight:800;
margin-top:6px
}

.green{color:#13844b}
.orange{color:#b86b00}
.red{color:#c93636}
.blue{color:#1769d1}

.grid,.formgrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.full{grid-column:1/-1}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.btn{
border:1px solid #d9dde3;
background:#fff;
color:#17202a;
border-radius:10px;
padding:11px;
text-align:left;
font-weight:700
}

.btn:hover{
background:#f8fafc
}

.danger{
background:#fff0f0;
color:#a72828
}

.successBtn{
background:#ecfdf3;
color:#08743f
}

.warningBtn{
background:#fff8e6;
color:#966100
}

#app input,
#app select,
#app textarea{
width:100%;
padding:13px 14px;
border:1px solid #d9dde3;
border-radius:12px;
background:#fff;
color:#17202a!important;
caret-color:#17202a;
outline:0
}

#app input:focus,
#app select:focus,
#app textarea:focus{
border-color:#087cff;
box-shadow:0 0 0 3px #087cff1f
}

.tablewrap{
overflow:auto
}

.table{
width:100%;
border-collapse:collapse;
font-size:13px
}

.table th,.table td{
padding:10px 7px;
border-bottom:1px solid #eceef1;
text-align:left;
vertical-align:top;
white-space:nowrap
}

.wrap{
white-space:normal!important;
min-width:200px
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:20px;
background:#eef1f5;
font-size:11px
}

.badge.pending{
background:#fff4d6;
color:#956300
}

.badge.confirmed,
.badge.completed,
.badge.paid,
.badge.active,
.badge.vacant{
background:#dcfce7;
color:#166534
}

.badge.rejected,
.badge.cancelled,
.badge.overdue,
.badge.inactive,
.badge.moved_out{
background:#fee2e2;
color:#991b1b
}

.badge.partial{
background:#fef3c7;
color:#92400e
}

.badge.in_progress,
.badge.occupied{
background:#dbeafe;
color:#1d4ed8
}

.empty,.loading{
text-align:center;
padding:30px;
color:#737b87
}

.code{
font-family:monospace;
font-weight:800;
letter-spacing:.5px
}

/* RENT */

.rentHero{
background:
linear-gradient(135deg,#071b41,#0869d7 55%,#00b8ff);
color:#fff;
border:0
}

.rentHero .muted{
color:#ffffffc9
}

.rentBalance{
font-size:32px;
font-weight:900;
margin-top:7px
}

.rentMiniGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px
}

.rentMini{
background:#ffffff18;
border:1px solid #ffffff30;
border-radius:12px;
padding:12px
}

.rentMini small{
display:block;
color:#ffffffb8
}

.rentMini strong{
display:block;
margin-top:4px
}

.monthCard{
border:1px solid #e5e7eb;
border-radius:14px;
padding:15px;
margin-bottom:12px;
background:#fff
}

.monthTop{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px
}

.monthName{
font-weight:900;
font-size:17px
}

.amountGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:12px
}

.amountBox{
padding:11px;
border-radius:10px;
background:#f8fafc
}

.amountBox small{
display:block;
color:#667085
}

.amountBox strong{
display:block;
margin-top:4px
}

.rentActionRow{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px
}

.rentActionRow button{
border:1px solid #d9dde3;
background:#fff;
border-radius:9px;
padding:9px 12px;
font-weight:700
}

.alertCard{
border-left:4px solid #f59e0b;
background:#fffaf0
}

.dangerCard{
border-left:4px solid #ef4444;
background:#fff5f5
}

.infoCard{
border-left:4px solid #087cff;
background:#f3f8ff
}

/* GUIDE */

.guideGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.guideItem{
border:1px solid #e5e7eb;
border-radius:14px;
padding:16px;
background:#fff
}

.guideIcon{
font-size:28px
}

.guideItem h3{
margin:8px 0 5px
}

.guideItem p{
color:#667085;
font-size:13px;
line-height:1.55
}

.step{
display:flex;
gap:12px;
margin:14px 0
}

.stepNum{
min-width:32px;
height:32px;
border-radius:50%;
background:#087cff;
color:#fff;
display:grid;
place-items:center;
font-weight:900
}

/* PROFILE */

.profileHero{
display:flex;
align-items:center;
gap:15px;
margin-bottom:16px
}

.avatar{
width:68px;
height:68px;
border-radius:50%;
display:grid;
place-items:center;
background:linear-gradient(135deg,#087cff,#00b8ff);
color:#fff;
font-size:25px;
font-weight:900
}

.profileId{
background:#eef2ff;
border-radius:10px;
padding:10px;
font-family:monospace;
font-weight:800
}

/* NOTIFICATIONS */

.notificationPanel{
position:fixed;
right:20px;
top:75px;
width:min(390px,calc(100vw - 30px));
max-height:75vh;
overflow:auto;
background:#fff;
border:1px solid #e2e5e9;
border-radius:16px;
box-shadow:0 20px 60px #0003;
z-index:100
}

.notificationHead{
padding:15px;
border-bottom:1px solid #eceef1;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.notificationItem{
padding:14px;
border-bottom:1px solid #eceef1
}

.notificationItem.unread{
background:#eff6ff
}

.notificationTitle{
font-weight:800
}

.notificationMessage{
font-size:12px;
color:#5f6875;
margin-top:4px
}

.notificationDate{
font-size:10px;
color:#9299a3;
margin-top:7px
}

/* MAINTENANCE */

.mediaPreview{
max-width:280px;
max-height:220px;
border-radius:10px;
margin-top:8px
}

.mediaBox{
padding:10px;
border:1px solid #e5e7eb;
border-radius:10px;
background:#f8fafc;
margin-top:8px
}

.maintCard{
border:1px solid #e5e7eb;
border-radius:14px;
padding:14px;
margin-bottom:12px
}

.maintTop{
display:flex;
justify-content:space-between;
gap:10px
}

.maintMeta{
font-size:12px;
color:#667085;
line-height:1.6
}

.maintActions{
margin-top:12px;
padding-top:12px;
border-top:1px solid #eef0f3
}

.maintActionsGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

/* UNIT MANAGEMENT */

.autoUnitBox{
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:12px;
padding:13px;
margin-top:10px
}

.unitCountPreview{
font-size:12px;
color:#667085;
margin-top:7px
}

.propertySummary{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap
}

.statPill{
padding:7px 10px;
border-radius:999px;
background:#eef2ff;
font-size:11px;
font-weight:800
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:#0008;
z-index:500;
display:grid;
place-items:center;
padding:18px
}

.modalBox{
width:min(500px,100%);
max-height:90vh;
overflow:auto;
background:#fff;
border-radius:18px;
padding:20px;
box-shadow:0 30px 90px #0005
}

.modalHead{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.closeBtn{
border:0;
background:#f1f5f9;
border-radius:50%;
width:38px;
height:38px;
font-size:18px
}

/* MOBILE */

@media(max-width:700px){

body{
padding-bottom:70px
}

header{
padding:11px 10px
}

.bar{
min-height:42px
}

.brand.small{
font-size:21px
}

.userbox{
gap:5px
}

.userbox span{
display:none
}

.logout{
padding:8px;
font-size:0
}

.logout::after{
content:"↪";
font-size:18px
}

nav{
position:fixed;
left:0;
right:0;
bottom:0;
z-index:80;
height:64px;
margin:0;
padding:6px 5px calc(6px + env(safe-area-inset-bottom));
background:#111827;
border-top:1px solid #ffffff18;
display:flex;
justify-content:space-around;
gap:3px;
overflow:visible
}

nav button{
flex:1;
min-width:0;
padding:6px 3px;
border-radius:9px;
background:transparent;
color:#aeb7c5;
font-size:10px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
white-space:normal
}

nav button.active{
background:#fff;
color:#111827
}

.navMore{
flex:1;
display:flex;
position:static
}

.navMore>button{
width:100%;
background:#273244;
color:#dbe1e8
}

.navMore>button.active{
background:#fff;
color:#111827
}

.moreMenu{
position:fixed;
right:8px;
bottom:70px;
top:auto;
width:230px;
max-height:65vh;
overflow:auto
}

main{
padding:15px 10px 35px
}

.stats{
grid-template-columns:1fr 1fr;
gap:8px
}

.grid,.formgrid,.guideGrid{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

.card{
border-radius:16px;
padding:14px
}

.title h1{
font-size:21px
}

.actions{
grid-template-columns:1fr
}

#app input,
#app select,
#app textarea{
min-height:48px;
font-size:16px
}

.primary,.secondary,.btn{
min-height:46px
}

.tablewrap{
margin:0 -5px
}

.notificationPanel{
top:62px;
right:8px;
width:calc(100vw - 16px);
max-height:70vh
}

.connection-status{
bottom:76px;
right:8px
}

.rentBalance{
font-size:28px
}

.rentMiniGrid{
grid-template-columns:1fr
}

.amountGrid{
grid-template-columns:1fr
}

.maintTop{
display:block
}

.maintActionsGrid{
grid-template-columns:1fr
}

.profileHero{
align-items:flex-start
}

}
</style>
</head>

<body>

<!-- =====================================================
     LOADING
===================================================== -->

<div id="mavLoading" class="mav-loading">

<div class="mav-loading-logo">M</div>

<div class="mav-loading-name">
Mav<span>Rent</span>
</div>

<div class="mav-loading-text">
Rental management platform
</div>

<div class="mav-spinner"></div>

<div id="loadingStatus" class="mav-loading-status">
Starting MavRent...
</div>

</div>

<div id="connectionStatus" class="connection-status">

<span class="connection-dot"></span>

<span id="connectionText">
Online
</span>

</div>

<!-- =====================================================
     AUTH
===================================================== -->

<div id="auth" class="auth">

<div class="login">

<div class="brand">
Mav<span>Rent</span>
</div>

<div class="muted">
Rental management platform
</div>

<div class="role">

<button
id="landlordRole"
class="sel"
type="button"
onclick="chooseRole('landlord')">
🏢 Landlord
</button>

<button
id="tenantRole"
type="button"
onclick="chooseRole('tenant')">
👤 Tenant
</button>

</div>

<form id="loginForm">

<label>Email</label>

<input
id="email"
type="email"
required
autocomplete="email"
placeholder="you@example.com">

<label>Password</label>

<input
id="password"
type="password"
required
autocomplete="current-password"
placeholder="Enter password">

<button id="loginBtn" class="primary" type="submit">
Login
</button>

</form>

<button class="secondary" type="button" onclick="signup()">
Create account
</button>

<button class="link" type="button" onclick="resetPassword()">
Forgot password?
</button>

<div id="authMsg" class="message hidden"></div>

</div>
</div>

<!-- =====================================================
     APPLICATION
===================================================== -->

<div id="app" class="hidden">

<header>

<div class="bar">

<div class="brand small">
Mav<span>Rent</span>
</div>

<div class="userbox">

<span id="who"></span>

<button
class="notifyBtn"
type="button"
onclick="toggleNotifications()"
title="Notifications">

🔔

<span
id="notifyCount"
class="notifyCount hidden">
0
</span>

</button>

<button
class="logout"
type="button"
onclick="logout()">
Log out
</button>

</div>

</div>

<div class="navWrap">

<nav id="nav"></nav>

<div
id="moreMenu"
class="moreMenu hidden">
</div>

</div>

</header>

<main id="main"></main>

</div>

<!-- =====================================================
     NOTIFICATIONS
===================================================== -->

<div
id="notificationPanel"
class="notificationPanel hidden">

<div class="notificationHead">

<h3 style="margin:0">
🔔 Notifications
</h3>

<button
class="btn"
type="button"
onclick="markAllNotificationsRead()">
Mark all read
</button>

</div>

<div id="notificationList"></div>

</div>

<!-- =====================================================
     MODAL
===================================================== -->

<div
id="modal"
class="modal hidden">

<div class="modalBox">

<div class="modalHead">

<h2 id="modalTitle" style="margin:0">
MavRent
</h2>

<button
class="closeBtn"
onclick="closeModal()">
×
</button>

</div>

<div id="modalBody"></div>

</div>

</div>

<script>

   CONFIGURATION
===================================================== */

const SUPABASE_URL =

const SUPABASE_KEY =
'sb_publishable_1mthstK0eNmIFL1PHmBDLg_-5YJYScn';

const MEDIA_BUCKET =
'maintenance-media';

const sb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   GLOBAL STATE
===================================================== */

let role='landlord';
let user=null;

/* =====================================================
   HELPERS
===================================================== */

const $=id=>document.getElementById(id);

const money=n =>
'UGX '+Number(n||0).toLocaleString('en-US');

const today=() =>
new Date().toISOString().slice(0,10);

const esc=s =>
String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

function shortId(id){

return id
?'MVR-'+String(id)
.replace(/-/g,'')
.slice(0,8)
.toUpperCase()
:'—';

}

function monthLabel(date){

if(!date)return '—';

return new Date(
date+'T00:00:00'
).toLocaleDateString(
'en-US',
{
month:'long',
year:'numeric'
}
);

}

function monthStart(date){

const d=new Date(
(date||today())+'T00:00:00'
);

return new Date(
d.getFullYear(),
d.getMonth(),
1
)
.toISOString()
.slice(0,10);

}

function addMonths(date,n){

const d=new Date(
(date||today())+'T00:00:00'
);

d.setDate(1);

d.setMonth(
d.getMonth()+Number(n)
);

return d.toISOString().slice(0,10);

}

function rentBalance(r){

return Math.max(
0,
Number(r.amount_due||0)-
Number(r.amount_paid||0)
);

}

function getRentStatus(r){

const due=Number(r.amount_due||0);
const paid=Number(r.amount_paid||0);

if(paid>=due&&due>0)
return 'paid';

if(paid>0&&paid<due)
return 'partial';

if(
r.due_date &&
r.due_date<today() &&
paid<due
)
return 'overdue';

return 'pending';

}

function rentStatusClass(status){

return String(
status||'pending'
)
.toLowerCase()
.replace(/\s+/g,'_');

}

function msg(text,type='error'){

const box=$('authMsg');

if(!box)return;

box.textContent=text;

box.className=
'message '+type;

}

function setLoadingStatus(text){

const x=$('loadingStatus');

if(x)x.textContent=text;

}

function hideLoader(){

const loader=$('mavLoading');

if(loader)
loader.classList.add('hide');

}

function showLoader(){

const loader=$('mavLoading');

if(loader)
loader.classList.remove('hide');

}

function closeMore(){

moreOpen=false;

const menu=$('moreMenu');

if(menu)
menu.classList.add('hidden');

}

function openModal(title,html){

$('modalTitle').textContent=title;
$('modalBody').innerHTML=html;
$('modal').classList.remove('hidden');

}

function closeModal(){

$('modal').classList.add('hidden');

}


/* =====================================================
   CONNECTION
===================================================== */

function updateConnectionStatus(){

const box=$('connectionStatus');
const text=$('connectionText');

if(!box||!text)return;

if(navigator.onLine){

box.classList.remove('offline');
text.textContent='Online';

}else{

box.classList.add('offline');
text.textContent='Offline';

}

}

window.addEventListener(
'online',
updateConnectionStatus
);

window.addEventListener(
'offline',
updateConnectionStatus
);

updateConnectionStatus();

async function signup(){

const email=$('email').value.trim();
const password=$('password').value;

if(!email)
return msg('Enter your email.');

if(password.length<6)
return msg(
'Password must be at least 6 characters.'
);

msg(
'Creating account...',
'success'
);

const r=
await sb.auth.signUp({
email,
password,
options:{
data:{
role,
full_name:'',
phone:''
}
}
});

if(r.error)
return msg(r.error.message);

if(r.data.session){

user=r.data.user;

await loadApp();

}else{

msg(
'Account created. Check your email, confirm it, then log in.',
'success'
);

}

}

async function resetPassword(){

const email=$('email').value.trim();

if(!email)
return msg('Enter your email first.');

const r=
await sb.auth.resetPasswordForEmail(
email,
{
redirectTo:location.origin
}
);

if(r.error)
return msg(r.error.message);

msg(
'Password reset email sent.',
'success'
);

}

$('loginForm').addEventListener(
'submit',
async e=>{

e.preventDefault();

if(busy)return;

busy=true;

const btn=$('loginBtn');

btn.disabled=true;
btn.textContent='Logging in...';

msg(
'Logging in...',
'success'
);

try{

const r=
await sb.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});

if(r.error)
throw r.error;

user=r.data.user;

await loadApp();

}catch(error){

console.error(error);

msg(
error.message||'Login failed.'
);

}finally{

busy=false;
btn.disabled=false;
btn.textContent='Login';

}

}
);

/* =====================================================
   REFRESH DATABASE
===================================================== */

async function refresh(){

const fresh={
properties:[],
units:[],
tenants:[],
registeredTenants:[],
payments:[],
maintenance_requests:[],
expenses:[],
receipts:[],
rent_records:[]
};

if(role==='landlord'){

let r=
await sb
.from('profiles')
.select(
'id,full_name,email,phone,role,tenant_code,created_at'
)
.eq('role','tenant')
.order(
'created_at',
{ascending:false}
);

if(r.error)
return dbErr(
'Tenant profiles',
r.error
);

fresh.registeredTenants=
r.data||[];

r=
await sb
.from('properties')
.select('*')
.eq('landlord_id',user.id)
.order(
'created_at',
{ascending:false}
);

if(r.error)
return dbErr(
'Properties',
r.error
);

fresh.properties=
r.data||[];

const propertyIds=
fresh.properties.map(
x=>x.id
);

if(propertyIds.length){

r=
await sb
.from('units')
.select('*')
.in(
'property_id',
propertyIds
);

if(r.error)
return dbErr(
'Units',
r.error
);

fresh.units=
r.data||[];

}

for(const tableName of [
'tenants',
'payments',
'maintenance_requests',
'expenses',
'receipts'
]){

r=
await sb
.from(tableName)
.select('*')
.eq(
'landlord_id',
user.id
);

if(r.error)
return dbErr(
tableName,
r.error
);

fresh[tableName]=
r.data||[];

}

r=
await sb
.from('rent_records')
.select('*')
.eq(
'landlord_id',
user.id
)
.order(
'period_month',
{ascending:false}
);

if(r.error)
return dbErr(
'Rent records',
r.error
);

fresh.rent_records=
r.data||[];

}else{

let r=
await sb
.from('tenants')
.select('*')
.eq(
'profile_id',
user.id
)
.eq(
'status',
'active'
);

if(r.error)
return dbErr(
'Tenant account',
r.error
);

fresh.tenants=
r.data||[];

const tenantIds=
fresh.tenants.map(
x=>x.id
);

const unitIds=
fresh.tenants
.map(x=>x.unit_id)
.filter(Boolean);

if(unitIds.length){

r=
await sb
.from('units')
.select('*')
.in('id',unitIds);

if(r.error)
return dbErr(
'Units',
r.error
);

fresh.units=
r.data||[];

const propertyIds=
fresh.units
.map(x=>x.property_id)
.filter(Boolean);

if(propertyIds.length){

r=
await sb
.from('properties')
.select('*')
.in(
'id',
propertyIds
);

if(r.error)
return dbErr(
'Properties',
r.error
);

fresh.properties=
r.data||[];

}

}

if(tenantIds.length){

for(const tableName of [
'payments',
'maintenance_requests',
'receipts'
]){

r=
await sb
.from(tableName)
.select('*')
.in(
'tenant_id',
tenantIds
);

if(r.error)
return dbErr(
tableName,
r.error
);

fresh[tableName]=
r.data||[];

}

r=
await sb
.from('rent_records')
.select('*')
.in(
'tenant_id',
tenantIds
)
.order(
'period_month',
{ascending:false}
);

if(r.error)
return dbErr(
'Rent records',
r.error
);

fresh.rent_records=
r.data||[];

}

}

cache=fresh;

await ensureCurrentRentRecords();

}


/* =====================================================
   AUTOMATIC RENT GENERATION
===================================================== */

async function ensureCurrentRentRecords(){

if(
!user||
!cache.tenants.length
)
return;

const existing=
cache.rent_records;

for(const tenant of cache.tenants){

const unit=
cache.units.find(
u=>u.id===tenant.unit_id
);

const rentAmount=
Number(
tenant.rent_amount||
unit?.monthly_rent||
0
);

if(!rentAmount)
continue;

const startMonth=
monthStart(
tenant.move_in_date||
tenant.created_at||
today()
);

let month=startMonth;

const currentMonth=
monthStart(today());

let safety=0;

while(
month<=currentMonth &&
safety<36
){

safety++;

const exists=
existing.some(
r=>
r.tenant_id===tenant.id &&
monthStart(r.period_month)===month
);

if(!exists){

await createRentRecord(
tenant,
unit,
month,
rentAmount
);

}

month=addMonths(
month,
1
);

}

}

if(role==='landlord'){

const r=
await sb
.from('rent_records')
.select('*')
.eq(
'landlord_id',
user.id
)
.order(
'period_month',
{ascending:false}
);

if(!r.error)
cache.rent_records=
r.data||[];

}else{

const ids=
cache.tenants.map(x=>x.id);

if(ids.length){

const r=
await sb
.from('rent_records')
.select('*')
.in(
'tenant_id',
ids
)
.order(
'period_month',
{ascending:false}
);

if(!r.error)
cache.rent_records=
r.data||[];

}

}

}


/* =====================================================
   CREATE RENT RECORD
===================================================== */

async function createRentRecord(
tenant,
unit,
periodMonth,
amount
){

const dueDay=
Math.min(
28,
Math.max(
1,
Number(
tenant.rent_due_day||
5
)
)
);

const d=
new Date(
periodMonth+'T00:00:00'
);

d.setDate(dueDay);

const dueDate=
d.toISOString().slice(0,10);

const payload={
landlord_id:
tenant.landlord_id||
user.id,

tenant_id:
tenant.id,

unit_id:
tenant.unit_id||
null,

period_month:
periodMonth,

due_date:
dueDate,

amount_due:
amount,

amount_paid:
0,

status:
'pending'
};

const r=
await sb
.from('rent_records')
.insert(payload);

if(r.error){

if(
!String(r.error.message||'')
.toLowerCase()
.includes('duplicate')
){

console.warn(
'Rent generation:',
r.error.message
);

}

}

}

function getPreviousUnpaidRecords(){

const result=[];

for(const tenant of cache.tenants){

const records=
cache.rent_records
.filter(
r=>r.tenant_id===tenant.id
)
.sort(
(a,b)=>
String(a.period_month)
.localeCompare(
String(b.period_month)
)
);

for(
let i=0;
i<records.length;
i++
){

const r=records[i];

if(
getRentStatus(r)==='paid'
)
continue;

const next=
records[i+1];

if(next){

result.push({
tenant,
record:r,
next
});

}

}

}

return result;

}

function renderLandlordRentWarnings(){

const warnings=[];

for(const tenant of cache.tenants){

const records=
cache.rent_records
.filter(
r=>r.tenant_id===tenant.id
)
.sort(
(a,b)=>
String(b.period_month)
.localeCompare(
String(a.period_month)
)
);

if(!records.length)
continue;

const latest=records[0];

if(
getRentStatus(latest)!=='paid'
){

const p=
cache.registeredTenants.find(
x=>x.id===tenant.profile_id
);

warnings.push(`

<div class="card ${
getRentStatus(latest)==='overdue'
?'dangerCard'
:'alertCard'
}">

<h3>
⚠️ ${esc(
p?.full_name||
p?.email||
'Tenant'
)}
</h3>

<p>
${esc(
monthLabel(latest.period_month)
)}
has a balance of
<b>${money(
rentBalance(latest)
)}</b>.
</p>

</div>

`);

}

}

return warnings.join('');

}

/* =====================================================
   TENANT RENT WARNINGS
===================================================== */

function renderTenantRentWarnings(records){

const warnings=[];

for(
let i=0;
i<records.length-1;
i++
){

const current=records[i];
const previous=records[i+1];

if(
rentBalance(previous)>0 &&
getRentStatus(previous)!=='paid'
){

warnings.push(`

<div class="card dangerCard">

<h3>
⚠️ Previous rent still unpaid
</h3>

<p>
${esc(
monthLabel(
previous.period_month
)
)}
has a remaining balance of
<b>
${money(
rentBalance(previous)
)}
</b>.
</p>

</div>

`);

break;

}

}

if(records[0]){

const diff=
Math.ceil(
(
new Date(
records[0].due_date
)-
new Date(today())
)/86400000
);

if(
diff>=0 &&
diff<=5 &&
rentBalance(records[0])>0
){

warnings.push(`

<div class="card alertCard">

<h3>
🔔 Rent Reminder
</h3>

<p>
Your rent is due
<b>
${esc(
records[0].due_date
)}
</b>.
</p>

<p>
Remaining:
<b>
${money(
rentBalance(records[0])
)}
</b>
</p>

</div>

`);

}

}

return warnings.join('');

}

/* =====================================================
   MOVE TENANT OUT
===================================================== */

async function moveOutTenant(id){

const tenant=
cache.tenants.find(
t=>t.id===id
);

if(!tenant)
return;

const p=
cache.registeredTenants.find(
x=>x.id===tenant.profile_id
);

const unit=
cache.units.find(
x=>x.id===tenant.unit_id
);

const tenantName=
p?.full_name||
p?.email||
'Tenant';

if(!confirm(
`Move ${tenantName} out of ${
unit?.unit_number||'the unit'
}? Their historical rent and payment records will be preserved.`
))
return;

try{

/*
   Important:
   We DO NOT delete the tenant record.
   This preserves historical records.
*/

const r=
await sb
.from('tenants')
.update({
status:'inactive'
})
.eq(
'id',
id
)
.eq(
'landlord_id',
user.id
);

if(r.error)
throw r.error;


/*
   Make the unit available again.
*/

if(tenant.unit_id){

const u=
await sb
.from('units')
.update({
status:'vacant'
})
.eq(
'id',
tenant.unit_id
)
.eq(
'landlord_id',
user.id
);

if(u.error)
throw u.error;

}

await refresh();

renderPage(
'tenants'
);

addLocalNotification(
'Tenant moved out',
`${tenantName} has been moved out of ${unit?.unit_number||'the unit'}. The unit is now available.`
);

}catch(error){

console.error(error);

alert(
'Could not move tenant out: '+
(error.message||error)
);

}

}

}else{

const img=

'mediaPreview';

file.name+

async function loadNotifications(){

notifications=[];

const count=
$('notifyCount');

if(count)
count.classList.add(
'hidden'
);

renderNotifications();

}

function renderNotifications(){

const list=
$('notificationList');

if(!list)return;

if(!notifications.length){

list.innerHTML=`

<div class="empty">

No new notifications.

</div>

`;

return;

}

list.innerHTML=
notifications.map(
n=>
`

<div class="notificationItem unread">

<div class="notificationTitle">
${esc(n.title)}
</div>

<div class="notificationMessage">
${esc(n.message)}
</div>

<div class="notificationDate">
${esc(n.date||'')}
</div>

</div>

`
).join('');

}

function addLocalNotification(
title,
message
){

notifications.unshift({
title,
message,
date:
new Date()
.toLocaleString()
});

const count=
$('notifyCount');

if(count){

count.textContent=
notifications.length;

count.classList.remove(
'hidden'
);

}

renderNotifications();

}

function toggleNotifications(){

const panel=
$('notificationPanel');

if(panel)
panel.classList.toggle(
'hidden'
);

}

function markAllNotificationsRead(){

notifications=[];

const count=
$('notifyCount');

if(count)
count.classList.add(
'hidden'
);

renderNotifications();

}


/* =====================================================
   RENT REMINDERS
===================================================== */

function checkRentReminders(){

if(
!user||
!cache.rent_records.length
)
return;

const todayDate=
new Date(today());

for(
const record
of cache.rent_records
){

const balance=
rentBalance(record);

if(balance<=0)
continue;

if(!record.due_date)
continue;

const due=
new Date(
record.due_date
);

const days=
Math.ceil(
(due-todayDate)/
86400000
);

if(days===0){

addLocalNotification(
'Rent due today',
`${monthLabel(
record.period_month
)} has a balance of ${money(balance)}.`
);

}

if(days===1){

addLocalNotification(
'Rent due tomorrow',
`${monthLabel(
record.period_month
)} is due tomorrow.`
);

}

if(days===3){

addLocalNotification(
'Rent reminder',
`${monthLabel(
record.period_month
)} is due in 3 days.`
);

}

if(days<0){

addLocalNotification(
'Overdue rent',
`${monthLabel(
record.period_month
)} is overdue by ${money(balance)}.`
);

}

}

}


/* =====================================================
   REALTIME
===================================================== */

function startRealtime(){

if(!user)return;

if(channel){

try{

sb.removeChannel(
channel
);

}catch(e){}

}

channel=
sb
.channel(
'mavrent-user-'+
user.id
)
.on(
'postgres_changes',
{
event:'*',
schema:'public'
},
async()=>{

try{

await refresh();

if(
$('app') &&
!$('app')
.classList
.contains('hidden')
){

renderPage(
currentPage
);

}

}catch(e){

console.warn(
'Realtime refresh:',
e
);

}

}
)
.subscribe();

}


/* =====================================================
   CLOSE PANELS
===================================================== */

document.addEventListener(

e=>{

const panel=
$('notificationPanel');

const notifyButton=
e.target.closest(
'.notifyBtn'
);

if(
panel &&
!panel
.classList
.contains('hidden') &&
!panel.contains(e.target) &&

){

panel.classList.add(
'hidden'
);

}

const menu=
$('moreMenu');

e.target.closest(

);

if(
menu &&

!menu.contains(e.target) &&

){

closeMore();

}

});


$('modal').addEventListener(
'click',
e=>{

if(e.target===$('modal'))
closeModal();

});


/* =====================================================
   AUTH STATE
===================================================== */

sb.auth.onAuthStateChange(
async(
event,
session
)=>{

if(
session?.user &&
!user
){

user=session.user;

await loadApp();

}

});


/* =====================================================
   STARTUP
===================================================== */

window.addEventListener(
'resize',
()=>{

if(
$('app') &&
!$('app')
.classList
.contains('hidden')
){

buildNav();

}

}
);

window.addEventListener(
'load',
async()=>{

setTimeout(
hideLoader,
1200
);

try{

setLoadingStatus(
'Checking your account...'
);

const r=
await sb.auth.getSession();

if(r.data.session){

user=
r.data.session.user;

await loadApp();

}else{

hideLoader();

}

}catch(error){

console.error(
'Startup error:',
error
);

hideLoader();

}

});


/* =====================================================
   PERIODIC REMINDER CHECK
===================================================== */

setInterval(
()=>{

try{

checkRentReminders();

}catch(e){

console.warn(e);

}

},
60000
);

</script>
