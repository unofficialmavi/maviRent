<script>

/* =========================================================
   SUPABASE CONNECTION
   ========================================================= */

/* Your Supabase Project URL */
const SUPABASE_URL =
  'https://wborvbuqdiscoasnsrwda.supabase.co';


/* Your Supabase publishable key */
const SUPABASE_KEY =
  'sb_publishable_1mthstK0eNmIFL1PHmBDLg_-5YJYScn';


const { createClient } = window.supabase;

const supabaseClient =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   APPLICATION VARIABLES
   ========================================================= */

let role = 'landlord';
let currentUser = null;


/* =========================================================
   BASIC HELPERS
   ========================================================= */

const money = n =>
  'UGX ' +
  Number(n || 0).toLocaleString('en-US');


const esc = s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );


function showMessage(text,type='error'){

  const box =
    document.getElementById('authMessage');

  box.textContent = text;

  box.className =
    'message ' + type;

}


/* =========================================================
   ROLE SELECTION
   ========================================================= */

function chooseRole(r){

  role = r;

  document
    .getElementById('landlordRole')
    .classList.toggle(
      'sel',
      r === 'landlord'
    );

  document
    .getElementById('tenantRole')
    .classList.toggle(
      'sel',
      r === 'tenant'
    );

}


/* =========================================================
   REAL SUPABASE LOGIN
   ========================================================= */

document
  .getElementById('loginForm')
  .addEventListener(
    'submit',
    async function(e){

      e.preventDefault();

      const email =
        document.getElementById(
          'loginEmail'
        ).value.trim();

      const password =
        document.getElementById(
          'loginPass'
        ).value;

      showMessage(
        'Logging in...',
        'success'
      );

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if(error){

        showMessage(
          error.message,
          'error'
        );

        return;
      }

      currentUser = data.user;

      await loadUser();

    }
  );


/* =========================================================
   CREATE REAL SUPABASE ACCOUNT
   ========================================================= */

async function signup(){

  const email =
    document.getElementById(
      'loginEmail'
    ).value.trim();

  const password =
    document.getElementById(
      'loginPass'
    ).value;

  if(!email){

    showMessage(
      'Enter your email first.',
      'error'
    );

    return;
  }

  if(password.length < 6){

    showMessage(
      'Password must be at least 6 characters.',
      'error'
    );

    return;
  }

  showMessage(
    'Creating your account...',
    'success'
  );


  const {
    data,
    error
  } =
    await supabaseClient.auth.signUp({

      email: email,

      password: password,

      options:{
        data:{
          role: role
        }
      }

    });


  if(error){

    showMessage(
      error.message,
      'error'
    );

    return;
  }


  if(data.session){

    currentUser = data.user;

    await loadUser();

  }else{

    showMessage(
      'Account created. Check your email to confirm your account, then log in.',
      'success'
    );

  }

}


/* =========================================================
   PASSWORD RESET
   ========================================================= */

async function resetPassword(){

  const email =
    document.getElementById(
      'loginEmail'
    ).value.trim();

  if(!email){

    showMessage(
      'Enter your email first.',
      'error'
    );

    return;
  }


  const {
    error
  } =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:
          window.location.origin
      }
    );


  if(error){

    showMessage(
      error.message,
      'error'
    );

    return;
  }


  showMessage(
    'Password reset email sent.',
    'success'
  );

}


/* =========================================================
   LOAD CURRENT USER
   ========================================================= */

async function loadUser(){

  if(!currentUser){

    const result =
      await supabaseClient.auth.getUser();

    currentUser =
      result.data.user;
  }


  if(!currentUser){

    return;
  }


  /*
   * First try the role saved in Supabase Auth metadata.
   */

  let userRole =
    currentUser.user_metadata?.role;


  /*
   * Then try the profiles table.
   *
   * This matches the profile system we created
   * in your Supabase project.
   */

  try{

    const {
      data: profile
    } =
      await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id',currentUser.id)
        .maybeSingle();


    if(profile?.role){

      userRole =
        profile.role;

    }

  }catch(error){

    console.log(
      'Profile lookup:',
      error
    );

  }


  /*
   * Use the saved account role.
   */

  if(
    userRole === 'landlord' ||
    userRole === 'tenant'
  ){

    role = userRole;

  }


  document
    .getElementById('auth')
    .classList.add('hidden');

  document
    .getElementById('app')
    .classList.remove('hidden');


  buildNav();


  show(
    role === 'landlord'
      ? 'dashboard'
      : 'tenantDashboard'
  );

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  document
    .getElementById('app')
    .classList.add('hidden');

  document
    .getElementById('auth')
    .classList.remove('hidden');

  document
    .getElementById('loginForm')
    .reset();

}


/* =========================================================
   CHECK EXISTING SESSION
   ========================================================= */

async function checkSession(){

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if(data.session){

    currentUser =
      data.session.user;

    await loadUser();

  }

}


checkSession();


/* =========================================================
   NAVIGATION
   ========================================================= */

function buildNav(){

  const email =
    currentUser?.email || 'User';


  document
    .getElementById('who')
    .textContent =
      (role === 'landlord'
        ? 'Landlord: '
        : 'Tenant: ') +
      email;


  const nav =
    document.getElementById('nav');


  nav.innerHTML =
    role === 'landlord'

    ?

`
<button data-page="dashboard">
🏠 Dashboard
</button>

<button data-page="properties">
🏘️ Properties
</button>

<button data-page="tenants">
👥 Tenants
</button>

<button data-page="payments">
💰 Payments
</button>

<button data-page="repairs">
🔧 Repairs
</button>

<button data-page="reports">
📊 Reports
</button>
`

    :

`
<button data-page="tenantDashboard">
🏠 My Home
</button>

<button data-page="myPayments">
💰 My Payments
</button>

<button data-page="myRepairs">
🔧 Report Problem
</button>

<button data-page="myProfile">
👤 My Profile
</button>
`;


  nav
    .querySelectorAll('button')
    .forEach(
      b =>
        b.onclick =
          () =>
            show(
              b.dataset.page
            )
    );

}


/* =========================================================
   PAGE SWITCHING
   ========================================================= */

function show(id){

  document
    .getElementById('main')
    .innerHTML =
      role === 'landlord'
        ? landlordPage(id)
        : tenantPage(id);


  document
    .querySelectorAll(
      '#nav button'
    )
    .forEach(
      b =>
        b.classList.toggle(
          'active',
          b.dataset.page === id
        )
    );


  attachForms();

  window.scrollTo(0,0);

}

function attachForms(){

  /*
   * These forms currently confirm that the interface works.
   *
   * The next step is connecting each one directly to
   * your Supabase tables:
   *
   * properties
   * units
   * tenants
   * payments
   * maintenance
   * expenses
   * receipts
   *
   * We should do that table-by-table so we don't break
   * your RLS policies.
   */


  let f =
    document.getElementById(
      'propertyForm'
    );


  if(f){

    f.onsubmit =
      async e => {

        e.preventDefault();

        alert(
          'Property form is ready. We will connect it to Supabase next.'
        );

      };

  }


  f =
    document.getElementById(
      'tenantForm'
    );


  if(f){

        );

      };

  f =

    );


  if(f){

    f.onsubmit =
      async e => {

        e.preventDefault();

        alert(
          'Payment form is ready. We will connect it to Supabase next.'
        );

  f =

  f =

  }

}
